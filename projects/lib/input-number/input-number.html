<wr-input-group [rounded]="resolvedRounded()">
  @if (prefix(); as p) {
    <span wrInputPrefix>{{ p }}</span>
  }
  <input
    #input
    wrInput
    type="text"
    inputmode="decimal"
    autocomplete="off"
    [size]="resolvedSize()"
    [rounded]="resolvedRounded()"
    [attr.aria-label]="resolvedAriaLabel()"
    spellcheck="false"
    [value]="text()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
  />
  @if (suffix(); as s) {
    <span wrInputSuffix>{{ s }}</span>
  }
  @if (showSteppers()) {
    <div class="wr-input-number__steppers" wrInputSuffix>
      <button
        type="button"
        class="wr-input-number__step"
        tabindex="-1"
        [attr.aria-label]="resolvedIncrement()"
        [disabled]="!interactive() || atMax()"
        (click)="stepBy(1)"
      >
        <svg
          class="wr-icon__svg"
          width="14"
          height="14"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
      <button
        type="button"
        class="wr-input-number__step"
        tabindex="-1"
        [attr.aria-label]="resolvedDecrement()"
        [disabled]="!interactive() || atMin()"
        (click)="stepBy(-1)"
      >
        <svg
          class="wr-icon__svg"
          width="14"
          height="14"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
    </div>
  }
</wr-input-group>
