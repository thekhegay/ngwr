<div class="wr-pagination__inner">
  @if (showTotal()) {
    <span class="wr-pagination__total">{{ rangeLabel() }}</span>
  }

  <div class="wr-pagination__nav">
    <!--
      `wr-pagination__nav-btn` exists so the stylesheet can mirror the arrow
      glyph under `dir="rtl"`. A class rather than `:first-child` /
      `:last-child` on the row: those two positions do hold today — which is why
      the `--square` end caps use them — but only while the prev button, the
      compact label and the next button all stay unconditional and in this
      order. A mirror keyed to position would follow a reorder, or land on a
      page cell, without a word.
    -->
    <wr-btn
      class="wr-pagination__nav-btn"
      [size]="size()"
      outlined
      [attr.aria-label]="resolvedPrev()"
      [disabled]="disabled() || currentPage() === 1"
      (click)="goTo(currentPage() - 1)"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </wr-btn>

    @for (page of pages(); track $index) {
      @if (page === ellipsis) {
        <span class="wr-pagination__ellipsis">{{ ellipsis }}</span>
      } @else {
        <wr-btn
          class="wr-pagination__page"
          [size]="size()"
          [outlined]="!isCurrent(page)"
          [color]="isCurrent(page) ? 'primary' : null"
          [attr.aria-current]="isCurrent(page) ? 'page' : null"
          [attr.aria-label]="goToPage({ page })"
          [disabled]="disabled()"
          (click)="goTo(page)"
        >
          {{ page }}
        </wr-btn>
      }
    }

    <!-- Compact pager — shown only in responsive mode on a narrow box (CSS). -->
    <span class="wr-pagination__current" aria-hidden="true">{{ currentPage() }} / {{ totalPages() }}</span>

    <wr-btn
      class="wr-pagination__nav-btn"
      [size]="size()"
      outlined
      [attr.aria-label]="resolvedNext()"
      [disabled]="disabled() || currentPage() === totalPages()"
      (click)="goTo(currentPage() + 1)"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </wr-btn>
  </div>

  @if (showSizeChanger()) {
    <!--
      `ariaLabel`, not `[attr.aria-label]`: `<wr-select>`'s host carries no role,
      so an attribute there names nothing and never reaches the `role="combobox"`
      button inside — the size changer announced itself as the catalog's generic
      "Select".
    -->
    <wr-select
      class="wr-pagination__size"
      [ariaLabel]="resolvedItemsPerPage()"
      [disabled]="disabled()"
      [value]="pageSize()"
      (valueChange)="onSizeChange($event)"
    >
      @for (option of pageSizeOptions(); track option) {
        <wr-option [value]="option">{{ perPage({ size: option }) }}</wr-option>
      }
    </wr-select>
  }
</div>
