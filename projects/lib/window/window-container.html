<wr-window
  [model]="ref._model"
  [windowRef]="ref"
  [injector]="childInjector"
  [titleExtra]="config.titleExtra ?? null"
  [statusBar]="config.statusBar ?? null"
  (closed)="ref.close()"
  #window
>
  <ng-container #content />
</wr-window>

<!--
  The snap hint lives here, not inside `<wr-window>`: `.wr-window` clips, and a
  fixed child is clipped with it while the open animation's transform is on.
  It takes the exact box the drop will give the window, from the same model
  arithmetic, so the hint and the landing cannot disagree — they did when the
  hint was a CSS 50% of the layout viewport and the snap was half of
  `innerWidth`, 7.5px apart with a classic scrollbar showing.
-->
@if (ref._model.previewRect(); as box) {
  <div
    class="wr-window__snap-hint"
    [attr.data-target]="ref._model.dragTarget()"
    [style.left.px]="box.left"
    [style.top.px]="box.top"
    [style.width.px]="box.width"
    [style.height.px]="box.height"
    [style.z-index]="ref._model.z() + 1"
    aria-hidden="true"
  ></div>
}
