<!--
  The double-click gate is `!== false`, NOT `maximizeVisible()`, and the
  difference is a window nobody can get out of. The Linux preset hides the
  maximize BUTTON; the gesture is how GNOME maximizes, and it worked on every
  chrome before this input went tri-state. Gating it on button visibility would
  have killed it there — and `maximized` is reachable on Linux with no button at
  all (a snap to the top edge, `ref.maximize()`, a restored layout), after which
  every exit disappears at once: no restore-down button, no minimize button,
  `startMove` refuses while the state is not `normal`, the resize handles are not
  rendered, and the only key the window listens for is Escape, which closes it.
  An explicit `showMaximize: false` still turns the gesture off everywhere.
-->
<div class="wr-window__chrome" (pointerdown)="startMove($event)" (dblclick)="showMaximize() !== false && maximize()">
  <div class="wr-window__title" [attr.id]="titleId">{{ title() }}</div>
  <div class="wr-window__title-extra">
    <ng-content select="[wrWindowTitleExtra]" />
  </div>

  <div class="wr-window__chrome-actions">
    @if (resolvedOs() === 'macos') {
      <!-- macOS-style traffic-light cluster: close → minimize → maximize.
           Glyphs (×, −, +) appear on cluster hover. -->
      @if (showClose()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--close"
          [attr.aria-label]="closeLabel()"
          (click)="close()"
        >
          <svg class="wr-window__chrome-action-glyph" viewBox="0 0 10 10" aria-hidden="true">
            <path
              d="M2.2 2.2 L7.8 7.8 M7.8 2.2 L2.2 7.8"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
      }
      @if (minimizeVisible()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--minimize"
          [attr.aria-label]="minimizeActionLabel()"
          (click)="minimize()"
        >
          <svg class="wr-window__chrome-action-glyph" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="2" y1="5" x2="8" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      }
      @if (maximizeVisible()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--maximize"
          [attr.aria-label]="maximizeActionLabel()"
          (click)="maximize()"
        >
          <svg class="wr-window__chrome-action-glyph" viewBox="0 0 10 10" aria-hidden="true">
            @if (state() === 'maximized') {
              <path
                d="M3 1 L1 1 L1 3 M7 1 L9 1 L9 3 M1 7 L1 9 L3 9 M9 7 L9 9 L7 9"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                fill="none"
              />
            } @else {
              <path d="M2 5 L8 5 M5 2 L5 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            }
          </svg>
        </button>
      }
    } @else {
      <!-- Windows / Linux glyph buttons. Linux hides minimize and maximize by
           DEFAULT, not by rule: `minimizeVisible()` resolves the input first, so
           `[showMinimize]="true"` puts the button back — which is the only way a
           user on Linux can reach `<wr-window-taskbar>` at all. -->
      @if (minimizeVisible()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--minimize"
          [attr.aria-label]="minimizeActionLabel()"
          (click)="minimize()"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="1" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      }

      @if (maximizeVisible()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--maximize"
          [attr.aria-label]="maximizeActionLabel()"
          (click)="maximize()"
        >
          @if (state() === 'maximized') {
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1.5" y="2.5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.2" />
              <rect x="3" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.2" />
            </svg>
          } @else {
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2" />
            </svg>
          }
        </button>
      }

      @if (showClose()) {
        <button
          type="button"
          class="wr-window__chrome-action wr-window__chrome-action--close"
          [attr.aria-label]="closeLabel()"
          (click)="close()"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      }
    }
  </div>
</div>

<div class="wr-window__body">
  <ng-content />
</div>

<div class="wr-window__status-bar">
  <ng-content select="[wrWindowStatusBar]" />
</div>

@if (resizable() && state() === 'normal') {
  <span class="wr-window__handle wr-window__handle--t" (pointerdown)="resizeT($event)"></span>
  <span class="wr-window__handle wr-window__handle--r" (pointerdown)="resizeR($event)"></span>
  <span class="wr-window__handle wr-window__handle--b" (pointerdown)="resizeB($event)"></span>
  <span class="wr-window__handle wr-window__handle--l" (pointerdown)="resizeL($event)"></span>
  <span class="wr-window__handle wr-window__handle--tl" (pointerdown)="resizeTL($event)"></span>
  <span class="wr-window__handle wr-window__handle--tr" (pointerdown)="resizeTR($event)"></span>
  <span class="wr-window__handle wr-window__handle--bl" (pointerdown)="resizeBL($event)"></span>
  <span class="wr-window__handle wr-window__handle--br" (pointerdown)="resizeBR($event)"></span>
}
