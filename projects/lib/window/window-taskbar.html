@if (items().length > 0) {
  <div class="wr-window-taskbar__rail">
    @for (ref of items(); track ref.id) {
      @let slot = slots().get(ref) ?? -1;
      <!--
        Two SIBLING buttons in a plain container, not a close button nested
        inside the tab. The close used to be a `role="button"` span with
        `tabindex="0"` inside the tab's own `<button>` — interactive content
        inside interactive content, which the HTML parser and `nested-interactive`
        both object to. Nothing caught it: a taskbar tab exists only while a
        window is minimized, and the a11y sweep reads prerendered HTML, where the
        rail is not rendered at all.
      -->
      <!--
        A folded window keeps its tab, hidden and out of the row but laid out,
        so the rail can read the width it would take to draw it again.
      -->
      <div
        #tab
        class="wr-window-taskbar__tab"
        [class.wr-window-taskbar__tab--active]="isCurrent(ref)"
        [class.wr-window-taskbar__tab--minimized]="ref.state() === 'minimized'"
        [class.wr-window-taskbar__tab--folded]="slot < 0"
        [attr.inert]="slot < 0 ? '' : null"
      >
        <button
          type="button"
          class="wr-window-taskbar__tab-restore"
          [attr.aria-label]="tabLabel(ref)"
          [attr.aria-pressed]="show() === 'all' ? isCurrent(ref) : null"
          [attr.tabindex]="tabIndex(slot < 0 ? -1 : slot * 2)"
          (click)="press(ref)"
        >
          <span class="wr-window-taskbar__tab-title">{{ tabTitle(ref) }}</span>
        </button>
        <button
          type="button"
          class="wr-window-taskbar__tab-close"
          [attr.aria-label]="closeLabel()"
          [attr.tabindex]="tabIndex(slot < 0 ? -1 : slot * 2 + 1)"
          (click)="close(ref, $event)"
        >
          <svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    }
    @if (folded().length > 0) {
      <button
        #more
        #fold="wrDropdown"
        type="button"
        class="wr-window-taskbar__more"
        [wrDropdown]="foldMenu"
        [position]="menuPosition()"
        [attr.aria-label]="moreLabel({ count: folded().length })"
        [attr.tabindex]="tabIndex(visible().length * 2)"
      >
        +{{ folded().length }}
      </button>
      <wr-dropdown-menu #foldMenu>
        @for (ref of folded(); track ref.id) {
          <wr-dropdown-item
            class="wr-window-taskbar__fold-item"
            [class.wr-window-taskbar__fold-item--minimized]="ref.state() === 'minimized'"
            [attr.aria-label]="tabLabel(ref)"
            (click)="pick(ref, fold)"
          >
            {{ tabTitle(ref) }}
          </wr-dropdown-item>
        }
      </wr-dropdown-menu>
    }
  </div>
}
