@if (iconPosition() === 'start') {
  @if (loading()) {
    <wr-spinner class="wr-tag__adornment" size="sm" />
  } @else if (icon(); as name) {
    <wr-icon class="wr-tag__adornment" [name]="name" />
  }
}

<ng-content />

@if (iconPosition() === 'end') {
  @if (loading()) {
    <wr-spinner class="wr-tag__adornment" size="sm" />
  } @else if (icon(); as name) {
    <wr-icon class="wr-tag__adornment" [name]="name" />
  }
}

@if (closable()) {
  <button type="button" class="wr-tag__remove" [attr.aria-label]="removeName()" (click)="onRemove($event)">
    <svg
      class="wr-icon__svg"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>
}
