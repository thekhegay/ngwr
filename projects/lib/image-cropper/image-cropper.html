@if (objectUrl(); as url) {
  <!--
    The stage. A press on it that the crop window did not take pans the zoomed image, a
    second finger pinches, and the wheel zooms: see `onStagePointerDown` and `onWheel`.
  -->
  <div
    class="wr-image-cropper__canvas"
    [style.width.px]="stageBox()?.w"
    [style.height.px]="stageBox()?.h"
    (pointerdown)="onStagePointerDown($event)"
    (pointermove)="onStagePointerMove($event)"
    (pointerup)="onStagePointerUp($event)"
    (pointercancel)="onStagePointerUp($event)"
    (wheel)="onWheel($event)"
  >
    <!--
      The picture, and the element `toCanvas` draws from. Until it is measured it sits in
      the layout and sizes the stage. From then on the sizer below does that, and this is
      laid over the stage and zoomed, panned and turned. The viewport clips it; the stage
      cannot, or it would clip the handles that overhang its edge.

      `crossorigin` is what lets a URL on another origin be exported at all: an image
      fetched without it taints the canvas `toCanvas` draws into, even when the server
      sends CORS headers, and every export then throws a SecurityError. It is static
      so it is in place before `src` starts the request.
    -->
    <div class="wr-image-cropper__viewport" [class.wr-image-cropper__viewport--on]="measured()">
      <img
        #img
        class="wr-image-cropper__image"
        crossorigin="anonymous"
        [class.wr-image-cropper__image--measured]="measured()"
        [style.width.px]="view()?.w"
        [style.height.px]="view()?.h"
        [style.transform]="view()?.transform"
        [src]="url"
        alt=""
        draggable="false"
        (load)="onImageLoad()"
        (error)="onImageError()"
      />
    </div>

    <!--
      Holds the stage open once the image is measured: a blank canvas with the source's
      dimensions, swapped while the image is turned, which the stylesheet sizes as it
      sized the image.
    -->
    @if (natural().w > 0) {
      <canvas
        #sizer
        class="wr-image-cropper__sizer"
        aria-hidden="true"
        [width]="turned() ? natural().h : natural().w"
        [height]="turned() ? natural().w : natural().h"
      ></canvas>
    }

    @if (display().w > 0) {
      <!-- Semi-transparent backdrop with a cut-out for the crop window. -->
      <div
        class="wr-image-cropper__backdrop"
        [style.clip-path]="`polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 ${cropDisplay().y}px, ${cropDisplay().x}px ${cropDisplay().y}px, ${cropDisplay().x}px ${cropDisplay().y + cropDisplay().h}px, ${cropDisplay().x + cropDisplay().w}px ${cropDisplay().y + cropDisplay().h}px, ${cropDisplay().x + cropDisplay().w}px ${cropDisplay().y}px, 0 ${cropDisplay().y}px)`"
      ></div>

      <!--
        Crop window — drag to move, with eight resize handles, and the ONE
        keyboard control the component has (see `onWindowKeydown`). The eight
        handles stay pointer-only and `aria-hidden`: eight extra tab stops per
        cropper would be hostile. The keys resize from the east and south edges
        only, so a west or north drag comes out as a resize plus a move rather
        than as one gesture.

        `role="group"` rather than no role at all, because `aria-label` is
        prohibited on a roleless `<div>` and this needs a name; and rather than
        `role="application"`, which would switch the reader out of its own
        browse mode for the whole subtree — far more than one rectangle is worth.
      -->
      <div
        class="wr-image-cropper__window"
        role="group"
        tabindex="0"
        [attr.aria-label]="resolvedWindowLabel()"
        [attr.aria-describedby]="helpId"
        [style.left.px]="cropDisplay().x"
        [style.top.px]="cropDisplay().y"
        [style.width.px]="cropDisplay().w"
        [style.height.px]="cropDisplay().h"
        (pointerdown)="onPointerDown('move', $event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
        (lostpointercapture)="onPointerUp($event)"
        (keydown)="onWindowKeydown($event)"
        (keyup)="onWindowKeyup()"
      >
        @for (h of handles; track h) {
          <span
            aria-hidden="true"
            [class]="`wr-image-cropper__handle wr-image-cropper__handle--${h}`"
            (pointerdown)="onPointerDown(h, $event)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp($event)"
            (pointercancel)="onPointerUp($event)"
            (lostpointercapture)="onPointerUp($event)"
          ></span>
        }
      </div>

      <p class="wr-image-cropper__sr-only" [id]="helpId">{{ resolvedKeyHelp() }} {{ resolvedTransformHelp() }}</p>

      <!--
        The crop rect in SOURCE pixels (or the new zoom or rotation, as a catalog
        sentence), announced after a keyboard change only:
        a pointer drag already gives sighted feedback and would flood the region,
        and the initial crop is not news. Deliberately bare numbers: a sentence
        here would be a translated string the catalog does not carry, and the
        reader has just been told what the four numbers mean by `helpId`.
      -->
      <p class="wr-image-cropper__sr-only" role="status">{{ announcement() }}</p>
    }
  </div>
} @else {
  <div class="wr-image-cropper__empty">{{ emptyText() }}</div>
}
