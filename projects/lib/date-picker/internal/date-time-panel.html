<wr-calendar
  [date]="calendarValue()"
  [min]="min()"
  [max]="max()"
  [dateFilter]="dateFilter()"
  [autoFocus]="autoFocus()"
  (dateChange)="onCalendarSelect($event)"
/>

<div class="wr-date-time-panel__time">
  <wr-time-picker
    [value]="timeValue()"
    [format]="timeFormat()"
    [showSeconds]="showSeconds()"
    [step]="step()"
    (valueChange)="onTimeChange($event)"
  />
</div>
