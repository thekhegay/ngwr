<wr-input-group [rounded]="rounded()">
  <input
    #startInput
    wrInput
    type="text"
    autocomplete="off"
    spellcheck="false"
    class="wr-date-range-picker__input"
    [size]="size()"
    [rounded]="rounded()"
    [attr.aria-label]="startLabel()"
    [attr.aria-invalid]="startAriaInvalid()"
    [attr.aria-describedby]="startDescribedBy()"
    [value]="startText()"
    [placeholder]="startPlaceholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    (click)="openOnInput(0)"
    (keydown)="onFieldKey($event, 0)"
    (input)="onStartInput($event)"
    (blur)="onBlur($event)"
  />
  <span class="wr-date-range-picker__separator" aria-hidden="true">{{ separator() }}</span>
  <!--
    `wrDateRangeEnd` hides the surrounding `<wr-form-field>` from this input, so
    only the start one adopts its `controlId` — see the directive for why the
    second half of a range carries no id at all.
  -->
  <input
    #endInput
    wrInput
    wrDateRangeEnd
    type="text"
    autocomplete="off"
    spellcheck="false"
    class="wr-date-range-picker__input"
    [size]="size()"
    [rounded]="rounded()"
    [attr.aria-label]="endLabel()"
    [attr.aria-invalid]="endAriaInvalid()"
    [attr.aria-describedby]="endDescribedBy()"
    [value]="endText()"
    [placeholder]="endPlaceholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    (click)="openOnInput(1)"
    (keydown)="onFieldKey($event, 1)"
    (input)="onEndInput($event)"
    (blur)="onBlur($event)"
  />
  <!-- Pointer-only, as the select's is: emptying both fields is the keyboard way to clear. -->
  @if (clearable() && hasValue() && !disabled() && !readonly()) {
    <span
      class="wr-date-picker__clear"
      role="button"
      [attr.aria-label]="resolvedClear()"
      tabindex="-1"
      (click)="clear($event)"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </span>
  }
  <!--
    `readonly` refuses to open the popup, so the trigger is disabled with it —
    otherwise it stays a focusable button advertising `aria-haspopup="dialog"`
    for a dialog it will never show.
  -->
  <button
    #trigger
    type="button"
    wrInputSuffix
    class="wr-date-picker__trigger"
    [attr.aria-label]="triggerLabel()"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-expanded]="overlayOpen()"
    [attr.aria-controls]="overlayOpen() ? panelId : null"
    [disabled]="disabled() || readonly()"
    (click)="toggleOverlay($event)"
    (keydown.arrowDown)="onTriggerArrow($event)"
    (blur)="onBlur($event)"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <rect x="1.5" y="2.5" width="11" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" />
      <line x1="1.5" y1="5.5" x2="12.5" y2="5.5" stroke="currentColor" stroke-width="1.2" />
      <line x1="4" y1="1" x2="4" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      <line x1="10" y1="1" x2="10" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      @if (isDateTime()) {
        <circle cx="7" cy="9" r="1.5" fill="currentColor" />
      }
    </svg>
  </button>
</wr-input-group>
<!--
  Why a typed end was refused, for a screen reader — the same live region
  <wr-date-picker> carries, written when a refusal is shown and emptied when it is
  corrected. Silent inside a <wr-form-field> bound to the same control, and for a
  refusal the app's catalog has no `validation.*` sentence for.
-->
<span class="wr-date-range-picker__sr-only" role="status" [id]="statusId">{{ announcement() }}</span>
