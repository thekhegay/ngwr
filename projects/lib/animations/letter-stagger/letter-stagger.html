@if (plain()) {
  <span class="wr-letter-stagger__text">{{ text() }}</span>
} @else {
  <span class="wr-letter-stagger__pieces" aria-hidden="true">
    @for (item of items(); track $index) {
      @if (item.pieces.length) {
        <span class="wr-letter-stagger__word">
          @for (piece of item.pieces; track piece.index) {
            <span class="wr-letter-stagger__piece" [style.--wr-letter-stagger-i]="piece.index">{{ piece.text }}</span>
          }
        </span>
      } @else {
        <span class="wr-letter-stagger__gap">{{ item.gap }}</span>
      }
    }
  </span>
  <span class="wr-letter-stagger__sr">{{ text() }}</span>
}
