<span class="wr-word-rotator__sr">{{ phrase() }}</span>
<span
  class="wr-word-rotator__slot"
  aria-hidden="true"
  [style.width.px]="width()"
  [style.--wr-word-rotator-count]="count()"
>
  @if (outgoing() === null) {
    <span class="wr-word-rotator__word">{{ word() }}</span>
  } @else {
    <span class="wr-word-rotator__word wr-word-rotator__word--out">
      @for (letter of outLetters(); track letter.index) {
        <span class="wr-word-rotator__letter wr-word-rotator__letter--out" [style.--wr-word-rotator-i]="letter.index">{{
          letter.text
        }}</span>
      }
    </span>
    <span class="wr-word-rotator__word wr-word-rotator__word--in">
      @for (letter of inLetters(); track letter.index) {
        <span class="wr-word-rotator__letter wr-word-rotator__letter--in" [style.--wr-word-rotator-i]="letter.index">{{
          letter.text
        }}</span>
      }
    </span>
  }
</span>
