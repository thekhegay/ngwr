<svg
  #ring
  class="wr-circle-text__ring"
  xmlns="http://www.w3.org/2000/svg"
  [attr.viewBox]="view"
  role="img"
  [attr.aria-label]="name()"
>
  <defs>
    <path [attr.id]="pathId" [attr.d]="path" fill="none" />
  </defs>
  <text
    class="wr-circle-text__text"
    aria-hidden="true"
    xml:space="preserve"
    [attr.textLength]="length"
    lengthAdjust="spacing"
  >
    <textPath [attr.href]="pathRef" [attr.textLength]="length" lengthAdjust="spacing">{{ text() }}</textPath>
  </text>
</svg>
<span class="wr-circle-text__centre"><ng-content /></span>
