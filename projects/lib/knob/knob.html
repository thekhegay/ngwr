<div
  class="wr-knob__surface"
  role="slider"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="value()"
  [attr.aria-readonly]="readonly() || null"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-invalid]="fieldAria.ariaInvalid()"
  [attr.aria-describedby]="fieldAria.describedBy()"
  [attr.tabindex]="focusable() ? 0 : -1"
  [style.width.px]="size()"
  [style.height.px]="size()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (keydown)="onKeydown($event)"
  (blur)="onBlur()"
>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path
      class="wr-knob__track"
      [attr.d]="trackPath()"
      [attr.stroke]="trackColor()"
      [attr.stroke-width]="strokeWidth()"
      fill="none"
      stroke-linecap="round"
    />
    <path
      class="wr-knob__value"
      [attr.d]="valuePath()"
      [attr.stroke]="valueColor()"
      [attr.stroke-width]="strokeWidth()"
      fill="none"
      stroke-linecap="round"
    />
    <circle
      class="wr-knob__handle"
      [attr.cx]="handlePos().x"
      [attr.cy]="handlePos().y"
      [attr.r]="strokeWidth() / 2"
      [attr.fill]="valueColor()"
    />
  </svg>
  @if (showValue()) {
    <!--
      `dir="auto"` because this is a number and a unit read as one phrase, and
      the browser is the only thing that knows which way that phrase runs. In an
      RTL paragraph the Unicode BiDi algorithm treats a digit run as neutral
      against the letters beside it, so `40 dB` was drawn `dB 40` — and `-5 dB`
      as `dB 5-`, with the sign on the wrong end of the number. `dir="auto"`
      picks the direction from the first strong character in the composed text,
      so a Latin `suffix` keeps the number first and an Arabic one reads
      right-to-left, which is correct for both.

      `unicode-bidi: isolate` does NOT fix this and was measured doing nothing:
      isolation seals the element off from its SURROUNDINGS, and the flip
      happens inside it.
    -->
    <div class="wr-knob__text" dir="auto">
      {{ value() }}<span class="wr-knob__suffix">{{ suffix() }}</span>
    </div>
  }
</div>
