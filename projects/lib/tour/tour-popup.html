@let step = tour.step();

<p class="wr-tour-popup__progress" [id]="progressId">{{ progressText() }}</p>

@if (step?.title; as title) {
  <h2 class="wr-tour-popup__title" [id]="titleId">{{ title }}</h2>
}

<p class="wr-tour-popup__content" [id]="contentId">{{ step?.content }}</p>

<div class="wr-tour-popup__actions">
  <!-- The three buttons are told apart by a class rather than by their position in
       the row: the back button is conditional, so an index means one thing on the
       first step and another everywhere else — and the labels are translated. -->
  <button
    wr-btn
    type="button"
    size="sm"
    outlined
    class="wr-tour-popup__action wr-tour-popup__action--skip"
    (click)="tour.stop()"
  >
    {{ skipLabel() }}
  </button>

  <span class="wr-tour-popup__spacer"></span>

  @if (!isFirst()) {
    <button
      wr-btn
      type="button"
      size="sm"
      outlined
      class="wr-tour-popup__action wr-tour-popup__action--back"
      (click)="tour.prev()"
    >
      {{ backLabel() }}
    </button>
  }
  <!-- Under `autoFocus: 'first-tabbable'` focus opens on the button that walks the
       tour, not on Skip, the first in the row: the focus trap reads
       `cdkFocusInitial`, as the confirm dialog has it. -->
  <button
    wr-btn
    type="button"
    size="sm"
    color="primary"
    class="wr-tour-popup__action wr-tour-popup__action--next"
    [attr.cdkFocusInitial]="tour.focusNext() ? '' : null"
    (click)="tour.next()"
  >
    {{ isLast() ? doneLabel() : nextLabel() }}
  </button>
</div>
