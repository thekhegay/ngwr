<span class="wr-avatar__content" [attr.aria-hidden]="fallbackHidden() ? 'true' : null"><ng-content /></span>

@if (url(); as src) {
  @if (!failed()) {
    <img
      #img
      class="wr-avatar__img"
      [src]="src"
      [alt]="resolvedAlt()"
      [attr.width]="pxSize()"
      [attr.height]="pxSize()"
      (load)="onImageLoad()"
      (error)="onImageError()"
      decoding="async"
    />

    @if (!loaded()) {
      <wr-spinner class="wr-avatar__spin" />
    }
  }
}
