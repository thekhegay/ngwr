<span class="wr-avatar__content" [attr.aria-hidden]="fallbackHidden() ? 'true' : null"><ng-content /></span>

@if (url(); as src) {
  @if (!failed()) {
    <img
      #img
      class="wr-avatar__img"
      [src]="src"
      [alt]="resolvedAlt()"
      [attr.width]="pxSize()"
      [attr.height]="pxSize()"
      (load)="onImageLoad()"
      (error)="onImageError()"
      decoding="async"
    />

    @if (!loaded()) {
      <wr-spinner class="wr-avatar__spin" />
    }
  } @else if (resolvedAlt()) {
    <!--
      The broken <img> is removed so the fallback can show, and its `alt` went with
      it: with no initials projected, the avatar was left with no name at all. With
      initials, the stylesheet hides this and they name the avatar, as before.
    -->
    <span class="wr-avatar__alt" role="img" [attr.aria-label]="resolvedAlt()"></span>
  }
}
