<div #track class="wr-slider__track" (pointerdown)="onTrackPointerDown($event)">
  <!--
    Positioned on the INLINE axis, not with `left`: `inset-inline-start` is the
    same edge in LTR and mirrors under `dir="rtl"`, so the track paints itself
    the right way round without the component reading a direction to draw.
  -->
  <span class="wr-slider__fill" [style.inset-inline-start.%]="fillStart()" [style.width.%]="fillWidth()"></span>

  <button
    type="button"
    class="wr-slider__thumb wr-slider__thumb--low"
    role="slider"
    [attr.id]="thumbId()"
    [style.inset-inline-start.%]="lowPercent()"
    [disabled]="disabled()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="range() ? high() : max()"
    [attr.aria-valuenow]="low()"
    [attr.aria-label]="resolvedLowLabel()"
    (pointerdown)="onPointerDown($event, 'low')"
    (keydown)="onKey($event, 'low')"
  ></button>

  @if (range()) {
    <button
      type="button"
      class="wr-slider__thumb wr-slider__thumb--high"
      role="slider"
      [style.inset-inline-start.%]="highPercent()"
      [disabled]="disabled()"
      [attr.aria-valuemin]="low()"
      [attr.aria-valuemax]="max()"
      [attr.aria-valuenow]="high()"
      [attr.aria-label]="resolvedUpperLabel()"
      (pointerdown)="onPointerDown($event, 'high')"
      (keydown)="onKey($event, 'high')"
    ></button>
  }
</div>

@if (showLabel()) {
  <div class="wr-slider__label">{{ label() }}</div>
}
