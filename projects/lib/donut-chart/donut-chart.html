<div class="wr-donut-chart__surface" [style.width.px]="size()">
  <!-- The name sits on the DRAWING, not on this wrapper. `img` is a
       children-presentational role, so with it out here WebKit dropped the whole
       subtree — including the centre value and label, which are real text and are
       the headline datum the legend does not carry. -->
  <svg viewBox="0 0 100 100" role="img" [attr.aria-label]="resolvedAriaLabel()">
    <!-- Every slice is stroked in the SURFACE colour, so adjacent arcs are
         separated by a visible gap rather than by the boundary between two
         fills. Without it the only thing dividing two slices is the colour
         change itself, and the default palette's entries sit within about
         1.06:1 of each other in relative luminance — for a reader who cannot
         separate hue, two neighbours merge into one arc and the chart reads as
         having fewer slices than it has. A gap is a shape, and it survives
         greyscale, printing and a monochrome display. -->
    @for (slice of slices(); track $index) {
      <path
        [attr.d]="slice.path"
        [attr.fill]="slice.color"
        stroke="var(--wr-color-surface)"
        stroke-width="1"
        stroke-linejoin="round"
      />
    }
  </svg>
  @if (centerValue() || centerLabel()) {
    <div class="wr-donut-chart__center">
      @if (centerValue()) {
        <div class="wr-donut-chart__center-value">{{ centerValue() }}</div>
      }
      @if (centerLabel()) {
        <div class="wr-donut-chart__center-label">{{ centerLabel() }}</div>
      }
    </div>
  }
</div>

@if (showLegend() && slices().length > 0) {
  <ul class="wr-donut-chart__legend">
    @for (slice of slices(); track $index) {
      <li class="wr-donut-chart__legend-item">
        <span class="wr-donut-chart__swatch" [style.background]="slice.color"></span>
        <span class="wr-donut-chart__legend-label">{{ slice.label }}</span>
        <span class="wr-donut-chart__legend-value">{{ slice.value }}</span>
      </li>
    }
  </ul>
}
