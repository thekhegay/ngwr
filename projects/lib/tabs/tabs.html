<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div
  #strip
  class="wr-tabs__strip"
  role="tablist"
  aria-orientation="horizontal"
  (keydown)="onStripKeydown($event)"
  (scroll)="updateFades()"
>
  @for (tab of tabs(); track tab.key()) {
    @if (tab.routerLink() !== null) {
      <!--
        `aria-selected` and `--active` come off the SAME `tab.routerActive()`, so the
        announced state and the painted one can never disagree. Without it a
        `role="tablist"` shipped with no tab selected in any of them: the route decides
        here, and the class it paints is invisible to assistive tech.

        A real `href` rather than a `[routerLink]`: the directive would drag
        `@angular/router` into every content-only strip as well (see `WR_TABS_ROUTING`).
        The href, the active match and the click all come from the adapter the
        `ngwr/tabs/router` directive publishes, which is `RouterLink` doing the work.
      -->
      <a
        class="wr-tabs__tab"
        role="tab"
        [attr.id]="headerId(tab.key())"
        [attr.href]="tab.routerHref()"
        [class.wr-tabs__tab--active]="tab.routerActive()"
        [class.wr-tabs__tab--disabled]="tab.disabled()"
        [attr.aria-disabled]="tab.disabled() ? true : null"
        [attr.aria-selected]="tab.routerActive()"
        [attr.tabindex]="tab.disabled() ? -1 : 0"
        (click)="onRouterTabClick(tab, $event)"
      >
        {{ tab.title() }}
      </a>
    } @else {
      <button
        type="button"
        class="wr-tabs__tab"
        role="tab"
        [attr.id]="headerId(tab.key())"
        [attr.aria-controls]="panelId(tab.key())"
        [attr.tabindex]="tab === activeTab() && !tab.disabled() ? 0 : -1"
        [class.wr-tabs__tab--active]="tab === activeTab()"
        [class.wr-tabs__tab--disabled]="tab.disabled()"
        [attr.aria-selected]="tab === activeTab()"
        [disabled]="tab.disabled()"
        (click)="onTabClick(tab)"
      >
        {{ tab.title() }}
      </button>
    }
  }
</div>

@if (!isRouter() && activeTab(); as tab) {
  <div
    class="wr-tabs__panel"
    role="tabpanel"
    tabindex="0"
    [attr.id]="panelId(tab.key())"
    [attr.aria-labelledby]="headerId(tab.key())"
  >
    <ng-container [ngTemplateOutlet]="tab.contentTpl()" />
  </div>
}
