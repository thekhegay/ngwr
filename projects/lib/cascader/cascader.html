<button
  type="button"
  class="wr-cascader__trigger"
  role="combobox"
  [attr.aria-label]="resolvedAriaLabel()"
  [disabled]="disabled()"
  [attr.aria-haspopup]="'menu'"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="panelId"
  [attr.aria-readonly]="readonly() || null"
  [attr.aria-invalid]="fieldAria.ariaInvalid()"
  [attr.aria-describedby]="fieldAria.describedBy()"
  (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown($event)"
  (blur)="touch.emit()"
>
  @if (displayLabel(); as label) {
    <span class="wr-cascader__value">{{ label }}</span>
  } @else {
    <span class="wr-cascader__placeholder">{{ placeholder() }}</span>
  }

  @if (clearable() && hasSelection() && !disabled() && !readonly()) {
    <span
      class="wr-cascader__clear"
      role="button"
      [attr.aria-label]="resolvedClearLabel()"
      tabindex="-1"
      (click)="clearSelection($event)"
      (keydown.enter)="clearSelection($event)"
      (keydown.space)="clearSelection($event)"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </span>
  }

  <svg
    class="wr-icon__svg wr-cascader__chevron"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>

<ng-template #panelTpl>
  <div
    class="wr-cascader-panel"
    [class.wr-cascader-panel--sm]="size() === 'sm'"
    [class.wr-cascader-panel--lg]="size() === 'lg'"
    role="menu"
    [attr.id]="panelId"
  >
    @for (col of columns(); track $index; let colIndex = $index) {
      <ul class="wr-cascader__col" role="menu">
        @for (opt of col; track opt.value) {
          <!--
            aria-haspopup / aria-expanded, because the only other thing that says
            "this one goes deeper" is the chevron below, and that svg is
            aria-hidden. Announcing a branch as a plain menuitem tells a screen
            reader the choice is final, so Enter reads as committing rather than
            as descending. `expanded` is exactly `isActiveAt`: `columns()` renders
            the next column for the active option and only when it has children,
            so the state can never claim a column that is not on screen.
          -->
          <li
            class="wr-cascader__opt"
            role="menuitem"
            [class.wr-cascader__opt--active]="isActiveAt(colIndex, opt.value)"
            [class.wr-cascader__opt--disabled]="opt.disabled"
            [attr.tabindex]="opt.disabled ? -1 : 0"
            [attr.aria-disabled]="opt.disabled ? true : null"
            [attr.aria-haspopup]="opt.children?.length ? 'menu' : null"
            [attr.aria-expanded]="opt.children?.length ? isActiveAt(colIndex, opt.value) : null"
            (click)="onOptionClick(colIndex, opt, $event)"
            (keydown.enter)="onOptionClick(colIndex, opt, $event)"
            (keydown.space)="onOptionClick(colIndex, opt, $event)"
          >
            <span class="wr-cascader__opt-label">{{ opt.label }}</span>
            @if (opt.children?.length) {
              <svg
                class="wr-icon__svg wr-cascader__opt-arrow"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            }
          </li>
        }
      </ul>
    }
  </div>
</ng-template>
