@if (closeAllVisible()) {
  <button type="button" class="wr-toast-host__close-all" (click)="onCloseAll()">
    {{ closeAllLabel() }} ({{ totalCount() }})
  </button>
}

@for (toast of toasts(); track toast.id) {
  <wr-toast
    [style.--wr-toast-stack-index]="stackIndex($index)"
    [type]="toast.type ?? 'info'"
    [title]="toast.title ?? null"
    [message]="toast.message"
    [closable]="toast.closable ?? true"
    [showProgress]="showProgressFor(toast)"
    [showCopy]="showCopyFor(toast)"
    [extraClass]="toast.class ?? null"
    [duration]="toast.resolvedDuration"
    [labels]="labels()"
    [actionLabel]="toast.action?.label ?? null"
    (dismissed)="onItemDismissed(toast.id, $index)"
    (actionRequested)="onItemAction(toast.id, $index)"
    (pauseRequested)="pauseRequested.emit(toast.id)"
    (resumeRequested)="resumeRequested.emit(toast.id)"
  />
}
