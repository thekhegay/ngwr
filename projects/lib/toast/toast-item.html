<!-- A glyph per type, and this is the one channel the toast had none of. Its
     four types differed by `--wr-toast-accent` alone — a 3px inline-start
     border, in four colours that sit within 1.06:1 of each other in relative
     luminance, so `success` and `danger` were the same 3px line to a reader
     who cannot separate hue. The shapes are the ones `wr-alert` and
     `wr-result` already use for the same four meanings: a check in a broken
     circle, a triangle, an octagon, an `i`. Three components agreeing is worth
     more than three components each being locally reasonable.

     `aria-hidden`, because the type is already announced: the host takes
     `role="alert"` for danger and `role="status"` otherwise. -->
<svg
  class="wr-toast__icon wr-icon__svg"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (type()) {
    @case ('success') {
      <path d="M21.801 10A10 10 0 1 1 17 3.335" />
      <path d="m9 11 3 3L22 4" />
    }
    @case ('warning') {
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    }
    @case ('danger') {
      <path
        d="M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z"
      />
      <path d="M12 8v4" />
      <path d="M12 16h.01" />
    }
    @default {
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    }
  }
</svg>

<div class="wr-toast__body">
  @if (title(); as text) {
    <p class="wr-toast__title">{{ text }}</p>
  }
  <p class="wr-toast__message">{{ message() }}</p>
</div>

<div class="wr-toast__actions">
  @if (showCopy()) {
    <button
      type="button"
      class="wr-toast__action wr-toast__action--copy"
      [attr.aria-label]="justCopied() ? labels().copied : labels().copy"
      [title]="justCopied() ? labels().copied : labels().copy"
      (click)="onCopy()"
    >
      @if (justCopied()) {
        <svg
          class="wr-icon__svg"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      } @else {
        <svg
          class="wr-icon__svg"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
      }
    </button>
  }

  @if (dismissible()) {
    <button
      type="button"
      class="wr-toast__action wr-toast__action--close"
      [attr.aria-label]="labels().close"
      [title]="labels().close"
      (click)="dismissed.emit()"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  }
</div>

@if (progressVisible()) {
  <span class="wr-toast__progress" aria-hidden="true"></span>
}
