<svg
  #svg
  [attr.viewBox]="viewBox"
  [style.width]="width()"
  [style.height]="height()"
  [attr.role]="ariaLabel() ? 'img' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-hidden]="ariaLabel() ? null : 'true'"
  preserveAspectRatio="none"
  (mousemove)="onPointerMove($event)"
  (mouseleave)="tip.leave($event)"
>
  @if (showArea() && areaPath()) {
    <path class="wr-sparkline__area" [attr.d]="areaPath()" [attr.fill]="color()" fill-opacity="0.15" stroke="none" />
  }
  @if (linePath()) {
    <path
      class="wr-sparkline__line"
      [attr.d]="linePath()"
      fill="none"
      [attr.stroke]="color()"
      [attr.stroke-width]="strokeWidth()"
      stroke-linecap="round"
      stroke-linejoin="round"
      vector-effect="non-scaling-stroke"
    />
  }
  <!-- A zero-length line with a round cap and a non-scaling stroke, which stays a
       circle however the drawing stretches; a `<circle>` stretched with it, into a
       21 × 5px pill on the docs' full-width demo. Three times the line's width. -->
  @if (showTip() && tipPath(); as d) {
    <path
      class="wr-sparkline__tip"
      [attr.d]="d"
      fill="none"
      [attr.stroke]="color()"
      [attr.stroke-width]="strokeWidth() * 3"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke"
    />
  }
</svg>
@if (markerAt(); as at) {
  <span
    #marker
    class="wr-sparkline__marker"
    aria-hidden="true"
    [style.left.px]="at.x"
    [style.top.px]="at.y"
    [style.background]="color()"
  ></span>
}
