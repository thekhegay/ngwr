<svg
  #svg
  [attr.viewBox]="viewBox"
  [style.width]="width()"
  [style.height]="height()"
  [attr.role]="ariaLabel() ? 'img' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-hidden]="ariaLabel() ? null : 'true'"
  preserveAspectRatio="none"
  (mousemove)="onPointerMove($event)"
  (mouseleave)="tip.leave($event)"
>
  @if (showArea() && areaPath()) {
    <path class="wr-sparkline__area" [attr.d]="areaPath()" [attr.fill]="color()" fill-opacity="0.15" stroke="none" />
  }
  @if (linePath()) {
    <path
      class="wr-sparkline__line"
      [attr.d]="linePath()"
      fill="none"
      [attr.stroke]="color()"
      [attr.stroke-width]="strokeWidth()"
      stroke-linecap="round"
      stroke-linejoin="round"
      vector-effect="non-scaling-stroke"
    />
  }
  @if (showTip() && tipPoint(); as last) {
    <circle class="wr-sparkline__tip" [attr.cx]="last.x" [attr.cy]="last.y" r="1.5" [attr.fill]="color()" />
  }
</svg>
@if (markerAt(); as at) {
  <span
    #marker
    class="wr-sparkline__marker"
    aria-hidden="true"
    [style.left.%]="at.x"
    [style.top.%]="at.y"
    [style.background]="color()"
  ></span>
}
