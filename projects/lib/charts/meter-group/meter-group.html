<div
  class="wr-meter-group__bar"
  role="progressbar"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-valuemin]="0"
  [attr.aria-valuemax]="resolvedMax()"
  [attr.aria-valuenow]="totalValue()"
  [attr.aria-valuetext]="totalText()"
>
  <!-- Only the shown segments draw a band; each keeps its segment's own position, which
       is what the tooltip looks it up by. `data-label` is what the harness reads a band's
       label from; the `title` it used to read is only written while the tooltip is off. -->
  @for (slice of bands(); track slice.index) {
    <span
      #slice
      class="wr-meter-group__slice"
      [attr.title]="tooltip() ? null : slice.label"
      [attr.data-label]="slice.label"
      [style.width.%]="slice.percent"
      [style.background]="slice.color"
      (mouseenter)="tip.enter(slice.index)"
      (mouseleave)="tip.leave($event)"
    ></span>
  }
</div>

@if (showLegend() && slices().length > 0) {
  <ul
    wr-chart-legend
    class="wr-meter-group__legend"
    [items]="legendItems()"
    [toggleable]="toggleableLegend()"
    [(hiddenSeries)]="hiddenSegments"
  ></ul>
}
