<!-- A named `group`, not an `img`: `img` is a children-presentational role, so the
     bars' own `img` names inside it are dropped by a user agent that follows the spec —
     WebKit drops exactly such a subtree, which is why the donut moved its `img` off the
     wrapper. -->
<div class="wr-bar-chart__plot" role="group" [attr.aria-label]="resolvedAriaLabel()" [style.height.px]="height()">
  @for (bar of bars(); track $index) {
    <div
      class="wr-bar-chart__column"
      role="img"
      [attr.aria-label]="bar.name"
      (mouseenter)="tip.enter($index)"
      (mouseleave)="tip.leave($event)"
    >
      @if (showValues()) {
        <span class="wr-bar-chart__value">{{ bar.value }}</span>
      }
      <div #barEl class="wr-bar-chart__bar" [style.flex-grow]="bar.share" [style.background]="bar.color"></div>
    </div>
  }
</div>
<!-- Named on the column above, so the visible label row is decoration here. -->
<div class="wr-bar-chart__labels" aria-hidden="true">
  @for (bar of bars(); track $index) {
    <span class="wr-bar-chart__label">{{ bar.label }}</span>
  }
</div>
