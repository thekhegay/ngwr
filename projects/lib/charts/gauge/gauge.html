<!--
  The dial is drawn in an aria-hidden <svg> and the printed value is optional, so
  with `showValue` off the component had no accessible representation at all.
  `role="meter"` plus the value attributes make it readable either way.
-->
<div
  #surface
  class="wr-gauge__surface"
  [style.width.px]="size()"
  role="meter"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="displayValue()"
  [attr.aria-valuetext]="valueText()"
  (mouseenter)="tip.enter(0)"
  (mouseleave)="tip.leave($event)"
>
  <svg [attr.viewBox]="viewBox" aria-hidden="true">
    <path
      class="wr-gauge__track"
      [attr.d]="trackPath()"
      fill="none"
      [attr.stroke]="trackColor()"
      [attr.stroke-width]="strokeWidth()"
      stroke-linecap="round"
    />
    <path
      class="wr-gauge__value"
      [attr.d]="valuePath()"
      fill="none"
      [attr.stroke]="valueColor()"
      [attr.stroke-width]="strokeWidth()"
      stroke-linecap="round"
    />
  </svg>
  @if (showValue()) {
    <!--
      `dir="auto"`, as on `wr-knob`'s value: a number and its unit read as one phrase,
      and the browser is the only thing that knows which way that phrase runs. In an
      RTL page the flex row ran right to left, so `72%` was drawn `% 72` and `9.5/10`
      as `10/ 9.5`. `dir="auto"` takes the direction from the first strong character,
      so a Latin or symbol `suffix` keeps the number first, and an Arabic one still
      reads right to left. `unicode-bidi: isolate` does nothing here, since the flip
      happens inside the element; a hard `dir="ltr"` would be wrong for that Arabic
      suffix.
    -->
    <div class="wr-gauge__text" dir="auto">
      {{ displayText() }}<span class="wr-gauge__suffix">{{ suffix() }}</span>
    </div>
  }
</div>
