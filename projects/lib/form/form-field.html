@if (label()) {
  <label class="wr-form-field__label" [attr.for]="labelFor()">
    {{ label() }}
    @if (required()) {
      <span class="wr-form-field__required" aria-hidden="true">*</span>
    } @else if (optional()) {
      <span class="wr-form-field__optional">({{ resolvedOptional() }})</span>
    }
  </label>
}

<div class="wr-form-field__control"><ng-content /></div>

@if (hasError()) {
  <div class="wr-form-field__errors" [attr.id]="describedBy()">
    <ng-content select="wr-form-error" />
    @for (message of autoMessages(); track message.key) {
      <div class="wr-form-error wr-form-field__error" role="alert" [attr.data-key]="message.key">
        {{ message.text }}
      </div>
    }
  </div>
} @else if (hint()) {
  <small class="wr-form-field__hint" [attr.id]="hintId()">{{ hint() }}</small>
}
