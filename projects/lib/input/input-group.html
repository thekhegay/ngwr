<ng-content />
<!-- Pointer-only, as the select's is: emptying the field is the keyboard way to clear. -->
@if (clearShown()) {
  <span class="wr-input-group__clear" role="button" [attr.aria-label]="resolvedClear()" tabindex="-1" (click)="clear()">
    <svg
      class="wr-icon__svg"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </span>
}
<!-- Hidden from the accessibility tree: the field says it is busy with `aria-busy`. -->
@if (loading()) {
  <wr-spinner class="wr-input-group__spinner" size="sm" aria-hidden="true" />
}
<ng-content select="[wrInputSuffix], wr-password-toggle" />
