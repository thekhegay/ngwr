<span class="wr-segmented__thumb" aria-hidden="true"></span>

<!--
  `id` on the FIRST segment only: it is the id a surrounding `<wr-form-field>`
  already points its `<label for>` at, and a `for` may only name a labelable
  element — see `controlId` in the component. `null` without a field, so a bare
  strip stamps no document-global id on anything.
-->
@for (option of options(); track option.value) {
  <button
    type="button"
    class="wr-segmented__option"
    [attr.id]="$first ? controlId() : null"
    [class.wr-segmented__option--selected]="isSelected(option)"
    [disabled]="disabled() || !!option.disabled"
    [attr.aria-pressed]="isSelected(option)"
    [attr.aria-label]="option.label ? null : (option.ariaLabel ?? option.value)"
    (click)="select(option)"
  >
    @if (option.icon) {
      <wr-icon class="wr-segmented__icon" [name]="option.icon" />
    }
    @if (option.label) {
      <span class="wr-segmented__label">{{ option.label }}</span>
    }
  </button>
}
