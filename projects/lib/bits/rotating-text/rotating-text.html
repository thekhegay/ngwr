<!--
  The readable text, once: the spans below are per-character. Deliberately NOT a
  live region — `auto` rotates every two seconds by default, and the APG's answer
  for self-advancing content is silence, not an announcement every two seconds.
-->

<span class="wr-rotating-text__sr-only">{{ current() }}</span>

<!--
  Animated visual content. `dir="auto"`: the characters are flex items, which the
  container's direction orders, so without it the PAGE's direction did — 'ship'
  read 'pihs' on an RTL page. `auto` takes it from the text, as plain text does.
-->
<span class="wr-rotating-text__inner" dir="auto" aria-hidden="true">
  @for (word of words(); track $index) {
    <span class="wr-rotating-text__word">
      @for (char of word.characters; track $index) {
        <span class="wr-rotating-text__char">{{ char }}</span>
      }
      @if (word.needsSpace) {
        <span class="wr-rotating-text__space">&nbsp;</span>
      }
    </span>
  }
</span>
