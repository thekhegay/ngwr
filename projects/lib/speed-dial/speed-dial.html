<button
  #trigger
  type="button"
  class="wr-speed-dial__trigger"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="menuId"
  [attr.aria-label]="resolvedTriggerLabel()"
  [disabled]="disabled()"
  (click)="onTrigger()"
>
  <wr-icon [name]="icon()" />
</button>

<!--
  A LIST of buttons, deliberately not a `role="menu"`. The dial used to announce
  aria-haspopup="menu" over role="menuitem" buttons while handling no menu key at
  all — no arrows, no Home/End, no focus moving in on open — and the actions were
  N tab stops rather than the pattern's one. That role also puts a screen reader
  into focus mode, so the arrow keys it promises stop reading the page and then do
  nothing here. The structure now says what the component does: a disclosure
  button (aria-expanded / aria-controls) revealing ordinary buttons that Tab
  reaches and Enter activates, with Escape as the way back.

  `role="list"` is written out because `list-style: none` (styles/_index.scss)
  drops the implicit list semantics in Safari.
-->
<ul class="wr-speed-dial__actions" role="list" [attr.id]="menuId">
  @for (action of actions(); track action.id) {
    <li class="wr-speed-dial__action-wrap" [style.--wr-speed-dial-i]="$index + 1">
      <button
        type="button"
        class="wr-speed-dial__action"
        [attr.aria-label]="action.label"
        [title]="action.label"
        [disabled]="disabled()"
        (click)="onPick(action)"
      >
        @if (action.icon) {
          <wr-icon [name]="action.icon" />
        } @else {
          <span>{{ initial(action.label) }}</span>
        }
      </button>
    </li>
  }
</ul>
