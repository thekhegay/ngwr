@if (isOverlay()) {
  <button
    type="button"
    class="wr-tree__trigger"
    role="combobox"
    [attr.aria-label]="resolvedAriaLabel()"
    [disabled]="disabled()"
    [attr.aria-haspopup]="'tree'"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    (click)="onTriggerClick()"
    (blur)="onBlur()"
  >
    @if (isMulti()) {
      @if (hasSelection()) {
        <span class="wr-tree__chips">
          @for (chip of visibleChips(); track chip.id) {
            <span class="wr-tree__chip">
              <span class="wr-tree__chip-label">{{ chip.label }}</span>
              <span
                class="wr-tree__chip-remove"
                role="button"
                [attr.aria-label]="chipRemoveLabel({ label: chip.label })"
                tabindex="-1"
                (click)="removeChip(chip.id, $event)"
                (keydown.enter)="removeChip(chip.id, $event)"
                (keydown.space)="removeChip(chip.id, $event)"
              >
                <svg
                  class="wr-icon__svg"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </span>
            </span>
          }
          @if (hiddenChipCount(); as extra) {
            <span class="wr-tree__chip wr-tree__chip--more">+{{ extra }} more</span>
          }
        </span>
      } @else {
        <span class="wr-tree__placeholder">{{ resolvedPlaceholder() }}</span>
      }
    } @else {
      @if (singleLabel(); as label) {
        <span class="wr-tree__value">{{ label }}</span>
      } @else {
        <span class="wr-tree__placeholder">{{ resolvedPlaceholder() }}</span>
      }
    }

    @if (clearable() && hasSelection() && !disabled()) {
      <span
        class="wr-tree__clear"
        role="button"
        [attr.aria-label]="clearLabel"
        tabindex="-1"
        (click)="clearSelection($event)"
        (keydown.enter)="clearSelection($event)"
        (keydown.space)="clearSelection($event)"
      >
        <svg
          class="wr-icon__svg"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </span>
    }

    <svg
      class="wr-icon__svg wr-tree__chevron"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <!-- Tree list lives inside the overlay panel. -->
  <ng-template #panelTpl>
    <div class="wr-tree-panel" [class.wr-tree-panel--virtual]="virtualized()" [attr.id]="panelId">
      <ng-container [ngTemplateOutlet]="listTpl" />
    </div>
  </ng-template>
} @else {
  <ng-container [ngTemplateOutlet]="listTpl" />
}

<!-- Shared row list — rendered inline (default) or projected into the
     overlay panel (when openOn="overlay"). -->
<ng-template #listTpl>
  <!-- Roving tabindex (non-virtual) / aria-activedescendant (virtual): the tree
       owns keyboard focus and routes arrow keys to its currently-focused row. -->
  <ul
    class="wr-tree__list"
    role="tree"
    [attr.aria-multiselectable]="isMulti() ? 'true' : null"
    [class.wr-tree__list--virtual]="virtualized()"
    [attr.tabindex]="virtualized() ? 0 : null"
    [attr.aria-activedescendant]="activeRowId()"
    [style.max-height]="virtualized() ? resolvedViewportHeight() : null"
    [style.overflow-y]="virtualized() ? 'auto' : null"
    (keydown)="onKeydown($event)"
  >
    @if (virtualized() && virtualWindow().padTop > 0) {
      <!-- `aria-setsize` / `aria-posinset` in BOTH shapes: the list is flat with no
           `role="group"` either way, so the set a row belongs to is never expressed
           by the DOM. Gated behind the virtual flag, the same tree announced a
           position with windowing on and nothing with it off. -->
      <li
        class="wr-tree__spacer"
        role="presentation"
        aria-hidden="true"
        [style.height.px]="virtualWindow().padTop"
      ></li>
    }
    @for (entry of windowRows(); track entry.node.id) {
      <!-- Click handler lives on focusable rows; keyboard handling is owned
           by the parent <ul> via the roving-tabindex pattern. -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
      <li
        class="wr-tree__row"
        role="treeitem"
        [attr.id]="virtualized() ? rowId(entry.index) : null"
        [class.wr-tree__row--selected]="selectedSet().has(entry.node.id)"
        [class.wr-tree__row--active]="virtualized() && entry.index === cursorIndex()"
        [class.wr-tree__row--disabled]="entry.node.disabled"
        [attr.aria-level]="entry.depth + 1"
        [attr.aria-setsize]="entry.setsize"
        [attr.aria-posinset]="entry.posinset"
        [attr.aria-expanded]="entry.hasChildren ? expandedSet().has(entry.node.id) : null"
        [attr.aria-selected]="selectionMode() === 'none' ? null : selectedSet().has(entry.node.id)"
        [attr.aria-disabled]="entry.node.disabled || disabled() || null"
        [attr.data-tree-index]="entry.index"
        [attr.tabindex]="virtualized() ? null : entry.index === cursorIndex() ? 0 : -1"
        [style.--wr-tree-depth]="entry.depth"
        (click)="onRowClick(entry, $event)"
      >
        @if (entry.hasChildren) {
          <button
            type="button"
            class="wr-tree__toggle"
            tabindex="-1"
            [attr.aria-label]="expandedSet().has(entry.node.id) ? collapseLabel : expandLabel"
            (click)="onToggleClick(entry.node, $event)"
          >
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M3 1 L7 5 L3 9 Z" fill="currentColor" />
            </svg>
          </button>
        } @else {
          <span class="wr-tree__toggle wr-tree__toggle--leaf" aria-hidden="true"></span>
        }
        <span class="wr-tree__label">{{ entry.node.label }}</span>
      </li>
    }
    @if (virtualized() && virtualWindow().padBottom > 0) {
      <li
        class="wr-tree__spacer"
        role="presentation"
        aria-hidden="true"
        [style.height.px]="virtualWindow().padBottom"
      ></li>
    }
  </ul>
</ng-template>
