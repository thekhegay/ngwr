@if (empty()) {
  <span class="wr-copy-value__empty">{{ resolvedEmptyLabel() }}</span>
} @else {
  <span class="wr-copy-value__text" [attr.title]="wrap() ? null : text()">{{ text() }}</span>
  <button
    type="button"
    class="wr-copy-value__button"
    [attr.aria-label]="resolvedCopyLabel()"
    [attr.title]="justCopied() ? resolvedCopiedLabel() : resolvedCopyLabel()"
    (click)="copy()"
  >
    <svg
      class="wr-copy-value__icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @if (justCopied()) {
        <path d="M20 6 9 17l-5-5" />
      } @else {
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      }
    </svg>
  </button>
  <!-- Rendered before the copy, empty: a live region announces a change to its
       content, and one inserted together with its text is often not read. -->
  <span class="wr-copy-value__status" role="status" aria-live="polite">{{
    justCopied() ? resolvedCopiedLabel() : ''
  }}</span>
}
