<!--
  First in the DOM, so it is the first tab stop of the carousel: the way to stop
  the slides comes before the slides. Named for what a press does next.
-->
@if (autoplay() && pauseButton() && count() > 1) {
  <button
    type="button"
    class="wr-carousel__toggle"
    [attr.aria-label]="playing() ? resolvedPauseLabel() : resolvedPlayLabel()"
    (click)="toggleAutoplay()"
  >
    @if (playing()) {
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="5" y="4" width="5" height="16" rx="1" />
        <rect x="14" y="4" width="5" height="16" rx="1" />
      </svg>
    } @else {
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6 4.5a1 1 0 0 1 1.52-.86l12 7.5a1 1 0 0 1 0 1.72l-12 7.5A1 1 0 0 1 6 19.5z" />
      </svg>
    }
  </button>
}

<div
  #viewport
  class="wr-carousel__viewport"
  role="group"
  [attr.aria-roledescription]="resolvedRoledescription()"
  [attr.aria-label]="resolvedAriaLabel()"
  (touchstart)="onSwipeStart($event)"
  (touchmove)="onSwipeMove($event)"
  (touchend)="onSwipeEnd($event, viewport)"
  (touchcancel)="onSwipeEnd($event, viewport)"
>
  <div class="wr-carousel__track" [style.transform]="trackStyle()" [style.transition]="dragging() ? 'none' : null">
    <ng-content />
  </div>
</div>

@if (showArrows() && count() > 1) {
  <button
    type="button"
    class="wr-carousel__nav wr-carousel__nav--prev"
    [attr.aria-label]="resolvedPrevLabel()"
    [disabled]="atStart()"
    (click)="prev()"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M9 2 L4 7 L9 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <button
    type="button"
    class="wr-carousel__nav wr-carousel__nav--next"
    [attr.aria-label]="resolvedNextLabel()"
    [disabled]="atEnd()"
    (click)="next()"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M5 2 L10 7 L5 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
}

@if (showDots() && count() > 1) {
  <div class="wr-carousel__dots" role="group" [attr.aria-label]="resolvedPaginationLabel()">
    @for (slide of slides(); track $index) {
      <button
        type="button"
        class="wr-carousel__dot"
        [class.wr-carousel__dot--active]="$index === active()"
        [attr.aria-current]="$index === active() ? 'true' : null"
        [attr.aria-label]="slideLabel({ index: $index + 1 })"
        (click)="goTo($index)"
      ></button>
    }
  </div>
}

<!--
  One live region for the whole carousel, in the DOM before its text changes.
  Off while the slides advance on their own, as the WAI-ARIA carousel pattern has it.
-->
<div class="wr-carousel__live" aria-atomic="true" [attr.aria-live]="rotating() ? 'off' : 'polite'">
  {{ announcement() }}
</div>
