<div
  #viewport
  class="wr-carousel__viewport"
  role="group"
  aria-roledescription="carousel"
  [attr.aria-label]="resolvedAriaLabel()"
  (touchstart)="onSwipeStart($event)"
  (touchmove)="onSwipeMove($event)"
  (touchend)="onSwipeEnd($event, viewport)"
  (touchcancel)="onSwipeEnd($event, viewport)"
>
  <div class="wr-carousel__track" [style.transform]="trackStyle()" [style.transition]="dragging() ? 'none' : null">
    <ng-content />
  </div>
</div>

@if (showArrows() && count() > 1) {
  <button
    type="button"
    class="wr-carousel__nav wr-carousel__nav--prev"
    [attr.aria-label]="resolvedPrevLabel()"
    (click)="prev()"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M9 2 L4 7 L9 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <button
    type="button"
    class="wr-carousel__nav wr-carousel__nav--next"
    [attr.aria-label]="resolvedNextLabel()"
    (click)="next()"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M5 2 L10 7 L5 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
}

@if (showDots() && count() > 1) {
  <div class="wr-carousel__dots" role="group" [attr.aria-label]="resolvedPaginationLabel()">
    @for (slide of slides(); track $index) {
      <button
        type="button"
        class="wr-carousel__dot"
        [class.wr-carousel__dot--active]="$index === active()"
        [attr.aria-current]="$index === active() ? 'true' : null"
        [attr.aria-label]="slideLabel({ index: $index + 1 })"
        (click)="goTo($index)"
      ></button>
    }
  </div>
}
