<label class="wr-switch__label" [for]="id()">
  <input
    class="wr-switch__input"
    type="checkbox"
    role="switch"
    [id]="id()"
    [attr.aria-label]="ariaLabel()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-invalid]="fieldAria.ariaInvalid()"
    [attr.aria-describedby]="fieldAria.describedBy()"
    (click)="onInputClick($event)"
    (change)="onInputChange($event)"
    (blur)="onInputBlur()"
  />

  <span class="wr-switch__track" aria-hidden="true">
    <span class="wr-switch__thumb"></span>
  </span>

  <span class="wr-switch__text">
    <ng-content />
  </span>
</label>
