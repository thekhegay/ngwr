<!--
  `role="group"` rather than `role="slider"`, because this surface holds TWO
  values and a slider has one `aria-valuenow`; and rather than
  `role="application"`, which would switch the reader out of its own browse mode
  for the whole subtree — the call `wr-image-cropper` already made. A group has
  no value of its own, so the two percentages ride in its accessible name, which
  is where a reader querying the focused element finds them.
-->
<div
  class="wr-color-picker__sv"
  role="group"
  [attr.aria-label]="resolvedAreaLabel()"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-invalid]="fieldAria.ariaInvalid()"
  [attr.aria-describedby]="fieldAria.describedBy()"
  [attr.tabindex]="disabled() ? -1 : 0"
  (pointerdown)="onPointerDown($event, 'sv')"
  (keydown)="onAreaKeydown($event)"
  (blur)="onSurfaceBlur()"
>
  <span class="wr-color-picker__thumb" [style.left.%]="svThumbX()" [style.top.%]="svThumbY()"></span>
</div>

<div
  class="wr-color-picker__slider wr-color-picker__slider--hue"
  role="slider"
  aria-valuemin="0"
  aria-valuemax="360"
  [attr.aria-label]="resolvedHueLabel()"
  [attr.aria-valuenow]="hueValue()"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-readonly]="readonly() || null"
  [attr.aria-invalid]="fieldAria.ariaInvalid()"
  [attr.aria-describedby]="fieldAria.describedBy()"
  [attr.tabindex]="disabled() ? -1 : 0"
  (pointerdown)="onPointerDown($event, 'hue')"
  (keydown)="onSliderKeydown($event, 'hue')"
  (blur)="onSurfaceBlur()"
>
  <!--
    `inset-inline-start`, not `left`: this is a one-value track, so it mirrors
    under `dir="rtl"` the way `wr-slider` does. The SV thumb above keeps `left` —
    the canvas is a picture and does not flip.
  -->
  <span class="wr-color-picker__thumb wr-color-picker__thumb--slider" [style.inset-inline-start.%]="hueThumbX()"></span>
</div>

@if (alpha()) {
  <div
    class="wr-color-picker__slider wr-color-picker__slider--alpha"
    role="slider"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="resolvedAlphaLabel()"
    [attr.aria-valuenow]="alphaPercent()"
    [attr.aria-valuetext]="`${alphaPercent()}%`"
    [attr.aria-disabled]="disabled() || null"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-invalid]="fieldAria.ariaInvalid()"
    [attr.aria-describedby]="fieldAria.describedBy()"
    [attr.tabindex]="disabled() ? -1 : 0"
    (pointerdown)="onPointerDown($event, 'alpha')"
    (keydown)="onSliderKeydown($event, 'alpha')"
    (blur)="onSurfaceBlur()"
  >
    <span
      class="wr-color-picker__thumb wr-color-picker__thumb--slider"
      [style.inset-inline-start.%]="alphaThumbX()"
    ></span>
  </div>
}

<div class="wr-color-picker__chrome">
  <span class="wr-color-picker__preview" [style.background]="hex()"></span>
  <wr-segmented
    class="wr-color-picker__tabs"
    [options]="tabOptions()"
    [value]="activeTab()"
    (valueChange)="onTabChange($event)"
  />
</div>

@switch (activeTab()) {
  @case ('hex') {
    <div class="wr-color-picker__inputs wr-color-picker__inputs--hex">
      <label class="wr-color-picker__field wr-color-picker__field--wide">
        <input
          type="text"
          spellcheck="false"
          autocomplete="off"
          [value]="hexInput()"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onHexInput($event)"
          (blur)="onHexBlur()"
        />
        <span class="wr-color-picker__field-label">{{ channelHexLabel() }}</span>
      </label>
    </div>
  }
  @case ('rgb') {
    <div class="wr-color-picker__inputs">
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="255"
          [value]="rgb().r"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onRgbChannel('r', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelRedLabel() }}</span>
      </label>
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="255"
          [value]="rgb().g"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onRgbChannel('g', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelGreenLabel() }}</span>
      </label>
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="255"
          [value]="rgb().b"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onRgbChannel('b', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelBlueLabel() }}</span>
      </label>
      @if (alpha()) {
        <label class="wr-color-picker__field">
          <input
            type="number"
            min="0"
            max="100"
            [value]="alphaPercent()"
            [disabled]="disabled()"
            [readonly]="readonly()"
            (input)="onAlphaPercent($event)"
          />
          <span class="wr-color-picker__field-label">{{ channelAlphaLabel() }}</span>
        </label>
      }
    </div>
  }
  @case ('hsl') {
    <div class="wr-color-picker__inputs">
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="360"
          [value]="hslView().h | number: '1.0-0'"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onHslChannel('h', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelHueLabel() }}</span>
      </label>
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="100"
          [value]="hslView().s * 100 | number: '1.0-0'"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onHslChannel('s', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelSaturationLabel() }}</span>
      </label>
      <label class="wr-color-picker__field">
        <input
          type="number"
          min="0"
          max="100"
          [value]="hslView().l * 100 | number: '1.0-0'"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onHslChannel('l', $event)"
        />
        <span class="wr-color-picker__field-label">{{ channelLightnessLabel() }}</span>
      </label>
      @if (alpha()) {
        <label class="wr-color-picker__field">
          <input
            type="number"
            min="0"
            max="100"
            [value]="alphaPercent()"
            [disabled]="disabled()"
            [readonly]="readonly()"
            (input)="onAlphaPercent($event)"
          />
          <span class="wr-color-picker__field-label">{{ channelAlphaLabel() }}</span>
        </label>
      }
    </div>
  }
}

@if (swatches().length > 0) {
  <div class="wr-color-picker__swatches">
    @for (color of swatches(); track color) {
      <button
        type="button"
        class="wr-color-picker__swatch"
        [style.background]="color"
        [attr.aria-label]="color"
        [disabled]="disabled() || readonly()"
        (click)="onSwatchClick(color)"
      ></button>
    }
  </div>
}
