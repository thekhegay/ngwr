@if (disablePreview()) {
  <img
    class="wr-lightbox__thumb"
    [src]="preview() || src()"
    [alt]="alt()"
    (load)="onSettled()"
    (error)="onSettled()"
    loading="lazy"
    decoding="async"
  />
} @else {
  <!-- The trigger opens a modal dialog, and used to say so nowhere: no hint that it
       opens anything, and nothing on the page tying it to the viewer it opened. -->
  <button
    type="button"
    class="wr-lightbox__trigger"
    aria-haspopup="dialog"
    [attr.aria-controls]="open() ? viewerId : null"
    [attr.aria-label]="resolvedOpenLabel()"
    (click)="onClick()"
  >
    <img
      class="wr-lightbox__thumb"
      [src]="preview() || src()"
      [alt]="alt()"
      (load)="onSettled()"
      (error)="onSettled()"
      loading="lazy"
      decoding="async"
    />
  </button>
}

<ng-template #viewerTpl>
  <div
    #viewer
    class="wr-lightbox-viewer"
    [id]="viewerId"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="resolvedViewerLabel()"
    (touchstart)="onViewerSwipeStart($event)"
    (touchmove)="onViewerSwipeMove($event, viewer)"
    (touchend)="onViewerSwipeEnd($event, viewer)"
    (touchcancel)="onViewerSwipeEnd($event, viewer)"
  >
    <button
      type="button"
      class="wr-lightbox-viewer__close"
      [attr.aria-label]="resolvedCloseLabel()"
      (click)="onClose()"
      (keydown.enter)="onClose()"
      (keydown.space)="onClose()"
    >
      <svg
        class="wr-icon__svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
    <!--
      Styled `cursor: zoom-out`, which is a promise: clicking the image closes. A
      REDUNDANT mouse affordance — the close button, Escape, the backdrop and
      swipe-down all do the same thing and all reach a keyboard — so the image stays
      out of the tab order rather than becoming a second close stop.
    -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events,@angular-eslint/template/interactive-supports-focus -->
    <img class="wr-lightbox-viewer__full" [src]="src()" [alt]="alt()" (click)="onClose()" />
    @if (caption()) {
      <div class="wr-lightbox-viewer__caption">{{ caption() }}</div>
    }
  </div>
</ng-template>
