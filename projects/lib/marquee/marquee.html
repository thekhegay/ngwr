<div class="wr-marquee__track" #track (mouseenter)="onEnter()" (mouseleave)="onLeave()">
  @for (copyIndex of copyIndices(); track copyIndex) {
    <!--
      `inert` alongside `aria-hidden`, and never one without the other: the copies
      exist only to fill the track, and an item with an `href` renders a real anchor
      in every one of them. Hidden from the screen reader but still in the tab order,
      each duplicate is a tab stop that announces nothing — axe's `aria-hidden-focus`,
      and N stops on one destination for anyone using the keyboard.
    -->
    <ul
      class="wr-marquee__list"
      role="list"
      [attr.aria-hidden]="copyIndex > 0"
      [attr.inert]="copyIndex > 0 ? '' : null"
      [attr.data-copy]="copyIndex"
    >
      @for (item of items(); track $index) {
        <li class="wr-marquee__item" role="listitem">
          @if (item.href) {
            <a
              class="wr-marquee__link"
              [href]="item.href"
              [attr.aria-label]="
                (isNodeItem(item) ? item.ariaLabel || item.title : item.alt || item.title) || resolvedLinkLabel()
              "
              target="_blank"
              rel="noreferrer noopener"
            >
              <ng-container *ngTemplateOutlet="content; context: { $implicit: item }" />
            </a>
          } @else {
            <ng-container *ngTemplateOutlet="content; context: { $implicit: item }" />
          }
        </li>
      }
    </ul>
  }
</div>

<ng-template #content let-item>
  @if (isNodeItem(item)) {
    <span class="wr-marquee__node" [attr.aria-hidden]="!!item.href && !item.ariaLabel">
      <ng-container *ngTemplateOutlet="item.node" />
    </span>
  } @else {
    <img
      [src]="item.src"
      [srcset]="item.srcSet || null"
      [sizes]="item.sizes || null"
      [width]="item.width || null"
      [height]="item.height || null"
      [alt]="item.alt || ''"
      [title]="item.title || null"
      loading="lazy"
      decoding="async"
      draggable="false"
    />
  }
</ng-template>
