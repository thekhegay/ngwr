<!-- The readable text, once: the pieces below are per-character spans. -->
<span class="wr-blur-text__sr-only">{{ text() }}</span>
@for (p of pieces(); track $index) {
  @if (p.kind === 'piece') {
    <span class="wr-blur-text__piece" aria-hidden="true">{{ p.text }}</span>
  } @else {
    <span class="wr-blur-text__space" aria-hidden="true">{{ p.text }}</span>
  }
}
