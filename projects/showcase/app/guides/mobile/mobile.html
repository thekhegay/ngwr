<ngwr-doc-page
  title="Mobile & responsive"
  description="NGWR adapts to touch and small screens — overlays become sheets, hit areas grow on touch, content respects device safe areas, and key layouts reflow to their container. Most of it is automatic; the rest is a one-line opt-in."
  [keywords]="['mobile', 'responsive', 'touch', 'safe-area', 'container-query']"
  [labels]="['Guide']"
>
  <ngwr-doc-section
    title="Responsive overlays"
    description="On small viewports, dialog / select / dropdown / popover collapse from an anchored overlay to a bottom-sheet, and the command-palette goes full-screen — easier to reach with a thumb. Turn it on app-wide with `provideWrResponsiveOverlays()`, built on the existing overlay plumbing."
  >
    <ngwr-doc-code [code]="snippets.overlaysProvider" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Per-component opt-in"
    description="Prefer to keep it surgical? Skip the provider and set the `responsive` input on just the overlays you want adapted. The dialog is service-opened, so it takes a `responsive` option instead."
  >
    <ngwr-doc-code [code]="snippets.overlaysInput" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Adaptive layout components"
    description="`descriptions`, `stepper`, `page-header`, `toolbar`, `pagination` and `table` can reflow based on their own width — a container query, not the viewport — so a two-column descriptions stacks, a horizontal stepper turns vertical, a page-header drops its actions below the title, a toolbar wraps, pagination collapses to a compact `current / total`, and a table becomes labelled cards whenever the box they live in is narrow, on any screen size. Opt in with `responsive`. (Tabs need no flag — the strip scrolls and shows an edge fade automatically when its headers overflow.)"
  >
    <ngwr-doc-code [code]="snippets.containerQuery" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Touch targets"
    description="Small controls grow their hit area on touch devices, gated behind `@media (pointer: coarse)`. The shared `touch-target` mixin floors a full 44px with an invisible pseudo-element — the alert / dialog / drawer / lightbox close buttons, the slider thumb and knob dial, the colour-picker hue and alpha tracks, the splitter divider and the drag handle. The rest is hand-sized to stay clear of its neighbours: the select chip removes and clear, the cascader clear and the toast actions reach 32px and the tree toggle 28px, with their rows and chips opened up around them. Nothing to configure, and mouse / trackpad layouts stay untouched."
  />

  <ngwr-doc-section
    title="Touch density"
    description="For touch-first screens, the `touch` density preset scales the padding of every density-aware control at once — vertical ×1.7, horizontal ×1.25 — so button, input, textarea, select, cascader, the tree-select trigger, list rows, table cells and tags grow together and keep a shared baseline. Controls with fixed geometry — checkbox, switch, radio, segmented, slider — are unaffected; reach for the touch targets above for those. `--wr-density-text` and `--wr-density-gap` are published for you to read in your own `calc()`, but no shipped component multiplies by either yet. Set it app-wide with `provideWrDensity`, or scope it to a subtree with the `wrDensity` directive."
  >
    <ngwr-doc-code [code]="snippets.density" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Swipe gestures"
    description="Touch dismissal and navigation feel native: drag a drawer's grab handle toward its edge to close it (`showHandle`), swipe a lightbox down to close, flick a toast sideways to dismiss it, and swipe a carousel left / right to change slides — the moving surface follows your finger and snaps back if you release before the threshold. Everything but the drawer handle is automatic."
  >
    <ngwr-doc-code [code]="snippets.swipe" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Safe areas"
    description="Fixed surfaces honor `env(safe-area-inset-*)` so content clears notches, home indicators and rounded corners. The toast host, command-palette and back-top do this automatically; the drawer opts in with `safeArea`. `env()` resolves to 0 on devices without insets, so desktop is unaffected."
  >
    <ngwr-doc-code [code]="snippets.safeArea" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Build your own"
    description="For your own responsive logic, the `WrMedia` service exposes signal-based breakpoint queries (and a breakpoints SCSS API covers styles). See the Media service page for the full surface."
  >
    <ngwr-doc-code [code]="snippets.media" language="angular-ts" />
  </ngwr-doc-section>
</ngwr-doc-page>
