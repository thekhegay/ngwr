<ngwr-doc-page
  title="Mobile & responsive"
  updated="15.0.0"
  description="Make ngwr layouts work on touch screens and narrow containers."
  [keywords]="['mobile', 'responsive', 'touch', 'safe-area', 'container-query']"
  [labels]="['Guide']"
>
  <ngwr-doc-section
    title="Adaptive layout components"
    description="Add `responsive` to reflow on the component's own width, not the viewport."
  >
    <ngwr-doc-code [code]="snippets.containerQuery" language="angular-html" />

    <div class="ngwr-table">
      <table>
        <thead>
          <tr>
            <th scope="col">Component</th>
            <th scope="col">When narrow</th>
          </tr>
        </thead>
        <tbody>
          @for (row of reflows; track row.component) {
            <tr>
              <th scope="row">
                <code>{{ row.component }}</code>
              </th>
              <td>{{ row.narrow }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Touch targets"
    description="Small controls grow their hit area on touch screens; mouse layouts do not change."
  />

  <ngwr-doc-section
    title="Touch density"
    description="`touch` enlarges padding on density-aware controls; checkbox, switch, radio, segmented and slider keep their size."
  >
    <ngwr-doc-code [code]="snippets.density" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Swipe gestures" description="Built in, no input needed.">
    <ul>
      <li>Lightbox: swipe down to close.</li>
      <li>Toast: swipe sideways to dismiss.</li>
      <li>Carousel: swipe left or right to change slides.</li>
    </ul>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Safe areas"
    description="Toast and back-top clear notches and home indicators by themselves. A drawer opts in with `safeArea`."
  >
    <ngwr-doc-code [code]="snippets.safeArea" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Build your own"
    description="Use `media-up` / `media-down` from `ngwr/breakpoints` in SCSS, and the CDK's `BreakpointObserver` in TypeScript."
  >
    <ngwr-doc-code
      [files]="[
        { label: 'SCSS', language: 'scss', code: snippets.mediaScss },
        { label: 'TS', language: 'angular-ts', code: snippets.media },
      ]"
    />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="On the server there is no viewport"
    description="Breakpoint queries are `false` on the server, so prefer `responsive` to a template branch ([SSR guide](/guides/ssr))."
  />
</ngwr-doc-page>
