<ngwr-doc-page
  title="Server-side rendering"
  description="Prerender and hydrate an ngwr app without mismatches."
  [keywords]="['ssr', 'hydration', 'prerender', 'server', 'universal', 'event replay']"
  [labels]="['Core']"
>
  <ngwr-doc-section
    title="Hydration and event replay"
    description="ngwr needs nothing extra; turn on Angular's hydration as usual."
  >
    <ngwr-doc-code [code]="snippets.hydration" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Incremental hydration"
    description="On by default in Angular 22; add a `hydrate` trigger to a heavy block whose JavaScript can wait."
  >
    <ngwr-doc-code [code]="snippets.incremental" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Write the <tbody> yourself"
    description="Rows placed straight in a `<table>` get an implicit `<tbody>` from the browser, and hydration fails with `NG0501`."
  >
    <ngwr-doc-code [code]="snippets.tbody" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Reflow in CSS, not in a template branch"
    description="A breakpoint signal is `false` on the server, so reflow with the `responsive` modifiers instead."
  >
    <ngwr-doc-code [code]="snippets.layout" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="What the server can answer">
    <table>
      <thead>
        <tr>
          <th scope="col">API</th>
          <th scope="col">On the server</th>
        </tr>
      </thead>
      <tbody>
        @for (row of answers; track row.api) {
          <tr>
            <td>
              <code>{{ row.api }}</code>
            </td>
            <td>{{ row.server }}</td>
          </tr>
        }
      </tbody>
    </table>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Overlays are not no-ops on the server"
    description="`WrToast.show()` and `WrDialog.open()` also run on the server and ship the overlay in the HTML, so call them from `afterNextRender`."
  >
    <ngwr-doc-code [code]="snippets.overlayGuard" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="A virtualized table on the server"
    description="Pass `viewportHeight` as a number and pin `rowHeight`, so the server's first window matches the client's."
  >
    <ngwr-doc-code [code]="snippets.virtual" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="The theme on a prerendered page"
    description="`auto` needs nothing; for a saved light or dark choice, add the pre-paint script to `<head>`."
  >
    <ngwr-doc-code [code]="snippets.theme" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
