<ngwr-doc-page
  title="Grid"
  description="Lay out a page with a 12-column grid, containers and breakpoint mixins."
  [keywords]="['grid', 'columns', 'breakpoints', 'responsive']"
>
  <ngwr-doc-section title="Opt in" description="Grid is its own entry point. Add it to your global stylesheet.">
    <ngwr-doc-code [code]="snippets.optIn" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Breakpoints">
    <table>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Min width</th>
          <th scope="col">Container max-width</th>
        </tr>
      </thead>
      <tbody>
        @for (bp of breakpoints; track bp.name) {
          <tr>
            <td>
              <code>{{ bp.name }}</code>
            </td>
            <td>{{ bp.min }}</td>
            <td>{{ bp.container }}</td>
          </tr>
        }
      </tbody>
    </table>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="12-column grid"
    description="Give each cell `col-<span>`, or `col-<breakpoint>-<span>` to apply from that breakpoint up."
  >
    <div class="grid-demo">
      @for (span of cols; track span) {
        <div class="grid grid-demo__row">
          @for (i of [].constructor(colSpan(span)); track $index) {
            <div [class]="`grid-demo__cell col-${span}`">.col-{{ span }}</div>
          }
        </div>
      }
    </div>
    <ngwr-doc-code [code]="snippets.grid" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Container" description="Caps the content width at each breakpoint.">
    <ngwr-doc-code [code]="snippets.container" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Gutter"
    description="One custom property sets the gap between cells and the container padding."
  >
    <ngwr-doc-code [code]="snippets.gutter" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Media-query mixin"
    description="The same breakpoints in your own SCSS. This entry emits no CSS."
  >
    <ngwr-doc-code [code]="snippets.mediaUp" language="scss" />
  </ngwr-doc-section>
</ngwr-doc-page>
