<ngwr-doc-page
  title="Motion"
  description="Easing curves, durations and the shorthands that pair them. A component reads these rather than picking its own numbers, so retuning one value re-times everything that reads it."
  [keywords]="['motion', 'animation', 'transition', 'easing', 'duration', 'reduced motion']"
  [labels]="['Tokens']"
>
  <ngwr-doc-section
    title="Easing curves"
    description="Pick by direction, not by taste: `-out` for entering, `-in` for leaving, `-in-out` for motion that stays on screen, `-linear` for anything continuous."
  >
    <ngwr-doc-api [rows]="easings" />

    <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1rem">
      @for (e of easings; track e.name) {
        <div style="display: flex; flex-direction: column; gap: 0.5rem">
          <code style="font-size: var(--wr-text-xs); color: var(--wr-color-text-muted)">{{ e.name }}</code>
          <div
            style="
              width: 9rem;
              height: 0.5rem;
              background: var(--wr-color-hover);
              border-radius: var(--wr-border-radius-pill);
            "
          >
            <div
              [style.animation-timing-function]="`var(${e.name})`"
              style="
                width: 1.75rem;
                height: 0.5rem;
                background: var(--wr-color-primary);
                border-radius: var(--wr-border-radius-pill);
                animation-name: ngwr-doc-ease-demo;
                animation-duration: 1.6s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
              "
            ></div>
          </div>
        </div>
      }
    </div>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Durations"
    description="Four steps. The rule of thumb: the more distance an element covers, the longer it may take — feedback should feel instant, travel should be readable."
  >
    <ngwr-doc-api [rows]="durations" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Transition shorthands"
    description="Each pairs a duration with an easing. They deliberately omit the property — you name that at the call site, which is what lets one token serve `background-color`, `transform` and `opacity` alike."
  >
    <ngwr-doc-api [rows]="transitions" />
    <ngwr-doc-code [code]="snippets.compose" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Overlay timing"
    description="The anchored panels — dropdown, popover / tooltip, context menu, popconfirm — plus the responsive bottom-sheet route their open animation through this one pair instead of their own timing, so retuning it moves all of them at once. Dialog, drawer and toast still carry a hardcoded duration of their own; overriding the pair does not reach them."
  >
    <ngwr-doc-api [rows]="overlayTokens" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Retuning the feel"
    description="Motion is a palette you can rebrand the same way as colour — override the tokens on `:root` and everything that reads them follows."
  >
    <ngwr-doc-code [code]="snippets.retune" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Reduced motion"
    description="The `.wr-animate-*` utilities drop to `animation: none`, and the components whose motion is decorative or looping — marquee, typewriter, the text effects, burger, markdown's streaming caret, plus popover / context-menu / command-palette — opt out for themselves. It is not blanket coverage: an overlay's open animation is not gated, so if your app treats the preference as absolute, kill the durations at the token layer, which is one rule for everything that reads them."
  >
    <ngwr-doc-code [code]="snippets.reduced" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
