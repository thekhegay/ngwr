<ngwr-doc-page
  title="Density"
  description="Make every control tighter or roomier with one setting."
  [keywords]="['density', 'compact', 'comfortable', 'touch', 'spacing', 'data-wr-density']"
  [labels]="['Tokens']"
>
  <ngwr-doc-section
    title="Set it up"
    description="Add the stylesheet and the feature; without the `@use`, density changes nothing."
  >
    <ngwr-doc-code [code]="snippets.styles" language="scss" />
    <ngwr-doc-code [code]="snippets.provider" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="The scale" description="`sm`, `md` (default), `lg` and `touch`. Each sets four multipliers.">
    <div style="display: flex; flex-wrap: wrap; gap: 1rem">
      @for (d of densities; track d) {
        <div [attr.data-wr-density]="d" style="display: flex; flex-direction: column; gap: 0.375rem">
          <span
            style="
              font-size: var(--wr-text-xs);
              color: var(--wr-color-on-surface-muted);
              text-transform: uppercase;
              letter-spacing: 0.05em;
            "
            >{{ d }}</span
          >
          <span
            style="
              display: inline-flex;
              align-items: center;
              padding: calc(var(--wr-control-padding-y-md) * var(--wr-density-y))
                calc(var(--wr-control-padding-x-md) * var(--wr-density-x));
              font-size: calc(var(--wr-text-sm) * var(--wr-density-text));
              line-height: var(--wr-control-line-height-md);
              color: var(--wr-color-primary-contrast);
              background-color: var(--wr-color-primary);
              border-radius: var(--wr-control-radius-md);
            "
            >Button</span
          >
        </div>
      }
    </div>

    <table>
      <thead>
        <tr>
          <th scope="col">Token</th>
          <th scope="col">sm / md / lg / touch</th>
          <th scope="col">Scales</th>
        </tr>
      </thead>
      <tbody>
        @for (t of multipliers; track t.name) {
          <tr>
            <td>
              <code>{{ t.name }}</code>
            </td>
            <td>{{ t.values }}</td>
            <td>{{ t.use }}</td>
          </tr>
        }
      </tbody>
    </table>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Change it at runtime"
    description="`WrDensity` switches the whole app and remembers the choice."
  >
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; align-items: flex-start">
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
          @for (d of densities; track d) {
            <button wr-btn type="button" [color]="current() === d ? 'primary' : null" (click)="set(d)">{{ d }}</button>
          }
          <button wr-btn type="button" (click)="cycle()">cycle()</button>
        </div>
        <p style="margin: 0">
          current(): <code>{{ current() }}</code>
        </p>
      </div>
    </ngwr-doc-snippet>
    <ngwr-doc-code [code]="snippets.service" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="One subtree"
    description="`wrDensity` on any element sets the density for that subtree only."
  >
    <ngwr-doc-code [code]="snippets.directive" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="In your own styles" description="Multiply your padding by the multipliers.">
    <ngwr-doc-code [code]="snippets.consume" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
