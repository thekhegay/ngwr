<ngwr-doc-page
  title="Content Security Policy"
  updated="15.0.0"
  description="Run ngwr under a strict Content Security Policy."
  [keywords]="['csp', 'content security policy', 'nonce', 'unsafe-inline', 'security']"
>
  <ngwr-doc-section
    title="Client-rendered app"
    description="Import ngwr's styles with `@use`, and this policy is enough."
  >
    <ngwr-doc-code [code]="snippets.clientRendered" language="bash" />
    <ngwr-doc-code [code]="snippets.styles" language="scss" />

    <div class="ngwr-table">
      <table>
        <thead>
          <tr>
            <th scope="col">Directive</th>
            <th scope="col">Value</th>
            <th scope="col">Why</th>
          </tr>
        </thead>
        <tbody>
          @for (row of directives; track row.name) {
            <tr>
              <th scope="row">
                <code>{{ row.name }}</code>
              </th>
              <td>
                <code>{{ row.value }}</code>
              </td>
              <td>{{ row.why }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <p>
      Some components also inject their CSS at runtime; <code>style-src 'self'</code> blocks that copy, which is
      harmless. Restyle them through their <code>--wr-*</code> tokens.
    </p>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="If you don't import the stylesheet"
    description="Then the runtime copy is the only one, and it needs a nonce."
  >
    <ngwr-doc-code [code]="snippets.nonce" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Server-rendered and prerendered apps"
    description="The server mints a nonce per response; a static prerender cannot, so use hashes or `'unsafe-inline'`."
  >
    <ngwr-doc-code [code]="snippets.ssr" language="bash" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
