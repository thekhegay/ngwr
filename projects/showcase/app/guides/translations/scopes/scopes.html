<ngwr-doc-page
  title="Scopes"
  description="Load a feature's catalog only when the feature loads."
  [keywords]="['i18n', 'translate', 'scope', 'lazy', 'feature']"
  [labels]="['Service']"
>
  <ngwr-doc-section title="Register a scope" description="Call once per feature, for example in a route guard.">
    <ngwr-doc-code [code]="snippets.register" language="typescript" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Consume in templates" description="Pass the scope to the pipe or the directive.">
    <ngwr-doc-code [code]="snippets.consume" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Loader layout"
    description="Put `{scope}` in the HTTP `path`; `rootPath` is for the root catalog."
  >
    <ngwr-doc-code [code]="snippets.httpLayout" language="typescript" />
  </ngwr-doc-section>
</ngwr-doc-page>
