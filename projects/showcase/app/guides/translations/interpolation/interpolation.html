<ngwr-doc-page
  title="Interpolation"
  description="Fill placeholders in a translation with values."
  [keywords]="['i18n', 'translate', 'interpolation', 'placeholder', 'params']"
  [labels]="['Service']"
>
  <ngwr-doc-section
    title="Catalog shape"
    description="Wrap the param name in double braces; a param missing from the object renders as nothing."
  >
    <ngwr-doc-code [code]="snippets.catalog" language="typescript" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Live" description="Type a name.">
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; max-width: 24rem">
        <input wrInput placeholder="Your name" [value]="name()" (input)="onName($event)" />
        <p wrTypography variant="h3">{{ 'app.hello' | wrT: { name: name() } }}</p>
        <p wrTypography tone="muted">Locale: {{ locale() }}</p>
      </div>
    </ngwr-doc-snippet>
    <ngwr-doc-code [code]="snippets.pipe" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Reusable formatter"
    description="`useI18nFormatter(key, fallback)` returns a function of the params, for a label reused per row."
  >
    <ngwr-doc-code [code]="snippets.formatter" language="typescript" />
  </ngwr-doc-section>
</ngwr-doc-page>
