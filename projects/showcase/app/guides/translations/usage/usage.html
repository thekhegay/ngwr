<ngwr-doc-page
  title="Usage in templates"
  description="Read a translation with the `wrT` pipe, the `[wrT]` directive or the `WrI18n` service."
  [keywords]="['i18n', 'translate', 'pipe', 'directive', 'service']"
  [labels]="['Service']"
>
  <ngwr-doc-section title="Locale switcher" description="Switch the locale to see the demos below update.">
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap">
        <p id="usage-locale-label" wrTypography tone="muted">Active locale:</p>
        <wr-segmented
          aria-labelledby="usage-locale-label"
          size="sm"
          [options]="localeOptions"
          [value]="locale()"
          (valueChange)="use($event)"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Pipe">
    <ngwr-doc-code [code]="snippets.pipe" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <p wrTypography variant="h3">{{ 'common.save' | wrT }}</p>
        <p wrTypography>{{ 'common.cancel' | wrT }}</p>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Directive" description="Replaces the element's text with the translation.">
    <ngwr-doc-code [code]="snippets.directive" language="angular-html" />
    <ngwr-doc-snippet code="">
      <p wrTypography wrT="common.save"></p>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Service" description="`t()` returns a string, `translate()` a signal.">
    <ngwr-doc-code [code]="snippets.service" language="typescript" />
    <p>
      <code>use()</code> switches text only. Dates and numbers follow Angular's <code>LOCALE_ID</code>, which needs a
      reload.
    </p>
  </ngwr-doc-section>
</ngwr-doc-page>
