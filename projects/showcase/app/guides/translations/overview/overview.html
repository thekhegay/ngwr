<ngwr-doc-page
  title="Translate"
  description="Translate your app and ngwr's own labels, and switch the locale at runtime."
  [keywords]="['i18n', 'translate', 'locale', 'wr-i18n', 'service']"
  [labels]="['Service']"
>
  <ngwr-doc-section title="At a glance">
    <div class="ngwr-translate-overview__hero">
      <p wrTypography variant="display">{{ 'common.save' | wrT }} . {{ 'common.cancel' | wrT }}</p>
      <div class="ngwr-translate-overview__switcher">
        <p>Active locale:</p>
        @for (l of available; track l) {
          <button
            type="button"
            class="ngwr-translate-overview__chip"
            [class.ngwr-translate-overview__chip--active]="locale() === l"
            (click)="use(l)"
          >
            {{ l }}
          </button>
        }
      </div>
    </div>
  </ngwr-doc-section>

  <ngwr-doc-section title="Sections">
    <ul class="ngwr-translate-overview__grid">
      @for (card of cards; track card.title) {
        <li>
          <a class="ngwr-translate-overview__card" [routerLink]="card.url">
            <p wrTypography variant="h4">{{ card.title }}</p>
            <p>{{ card.body }}</p>
          </a>
        </li>
      }
    </ul>
  </ngwr-doc-section>
</ngwr-doc-page>
