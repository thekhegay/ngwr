@if (all().length) {
  <section class="see-also" [attr.aria-label]="title()">
    <h2 wrTypography variant="h4" class="see-also__title">{{ title() }}</h2>
    <ul class="ngwr-link-grid">
      @for (link of all(); track link.url.join('/')) {
        <li>
          <a class="ngwr-link-card" [routerLink]="link.url">
            @if (showKind() && link.kind; as kind) {
              <ngwr-doc-label class="see-also__kind" [label]="kind" [link]="false" size="sm" />
            }
            <span class="ngwr-link-card__title">{{ link.title }}</span>
            @if (showDescription() && link.description; as description) {
              <span class="ngwr-link-card__desc ngwr-link-card__desc--line">{{ description }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </section>
}
