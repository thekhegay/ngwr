<ngwr-doc-section title="What changed">
  <div class="ngwr-table">
    <table class="removed">
      <tbody>
        <tr>
          <th scope="row">What it was</th>
          <td [innerHTML]="was() | wrDocRich"></td>
        </tr>
        <tr>
          <th scope="row">Why it went</th>
          <td [innerHTML]="why() | wrDocRich"></td>
        </tr>
        <tr>
          <th scope="row">Use instead</th>
          <td [innerHTML]="instead() | wrDocRich"></td>
        </tr>
      </tbody>
    </table>
  </div>
</ngwr-doc-section>
