<header class="header">
  @if (labels().length || addedIn()) {
    <div class="labels">
      @for (label of labels(); track label) {
        <wr-badge size="sm" shape="pill" [color]="labelColor(label)">{{ label }}</wr-badge>
      }

      <!--
        Beside the title, never inside it: a badge in the `<h1>` makes the
        heading's accessible name "Graph Added in v14.5", and a heading is how a
        screen-reader user finds the page. As its own chip it is announced on its
        own, and it says the whole phrase rather than a bare version.
      -->
      @if (addedIn(); as added) {
        <wr-badge class="since" size="sm" shape="pill" color="light">{{ added }}</wr-badge>
      }
    </div>
  }

  <h1 wrTypography variant="h3" class="title">{{ title() }}</h1>

  @if (description(); as d) {
    <p wrTypography variant="body" tone="medium" class="description" [innerHTML]="d | wrDocRich"></p>
  }
</header>

<div class="content">
  <ng-content />

  <!--
    Last section on the page, and rendered by the shell rather than by the page:
    the catalogue is generated, so a component that grows a hook gets the row
    without anyone remembering to ask for it. `null` for every route that
    documents no entry point, which is most of `/guides` and `/start`.
  -->
  @if (cssVars(); as vars) {
    <ngwr-doc-section title="CSS variables" [description]="cssVarsDescription(vars.subpath)">
      <ngwr-doc-css-vars [rows]="vars.vars" />
    </ngwr-doc-section>
  }
</div>
