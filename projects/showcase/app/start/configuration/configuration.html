  <ngwr-doc-section
    title="Overlay"
    description="`provideWrOverlay()` backs every overlay component — dialog, drawer, popover, dropdown, select, tooltip, menus, pickers — with an overlay container and an `Overlay` instance of NGWR's own. Both tokens fall back to CDK's root instances, so panels still open without it; what you lose is the isolation from other CDK consumers and the `--wr-keyboard-inset` that lets a mobile sheet clear the on-screen keyboard. Call it once. **“Optional” here means the app still works, not that it is free:** what the provider references is CDK's overlay module, which is the largest single dependency anything in this catalog reaches for. In an app that renders any overlay component the module is already in the graph and the provider adds close to nothing; in an app that renders none, it is the whole of it — so skipping it as a size decision only pays off in an app with no dialog, no select and no dropdown, which is the app that was never going to call it. `provideWrResponsiveOverlays()` is a separate function from the same entry point, and it is what turns those panels into bottom sheets below a breakpoint."
  >
    <ngwr-doc-code [code]="snippets.overlay" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Responsive overlays"
    description="`provideWrResponsiveOverlays()` — from `ngwr/overlay`, the same entry point as `provideWrOverlay()`, not from the component's own — makes dialog, select, dropdown and popover present as a full-width bottom-sheet under the breakpoint, and the command palette go full-screen. A per-component `responsive` input overrides it either way, so a page can opt one panel out. The sheet's own presentation lives in the `ngwr/overlay` **stylesheet** as well — if you load styles per component rather than through the umbrella, `&#64;use 'ngwr/overlay'` is what makes a sheet look like one. See the [mobile guide](/guides/mobile) for the rest of the touch story."
  >
    <ngwr-doc-code [code]="snippets.responsiveOverlays" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Component defaults"
    description="`provideWrConfig()` sets what a component falls back to when a template says nothing — the shared `size` scale, the `rounded` shape on the controls that have one, and `<wr-markdown>`'s link target and copy button. A bound value always wins, so nothing has to be re-stated to escape it — and a bound `false` turns a configured `true` back off, because `false` is a value rather than an absence. Intent is deliberately not a key: `null` is how a template says nothing, and it is also how the lib's own chrome says “no colour”.

**The three providers do NOT scope alike, and the difference is worth knowing before you reach for a route.** `provideWrConfig()` is read per route: a component resolves it from its own injector, so a lazy area can carry its own defaults. `provideWrIcons()` works at any level and CHAINS, so a route adds to the set its parent registered rather than replacing it. `provideWrToastConfig()` is bootstrap-only — `WrToast` is root-provided and resolves its config once from the root injector, so a route-level call is never read. That one used to be silent; since v14.0.1 it warns in dev mode and names itself."
  >
    <ngwr-doc-code [code]="snippets.config" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Density"
    description="One knob for app-wide sizing. The provider picks a preset; the per-axis multipliers behind the presets are CSS custom properties, so a value between two presets is a `:root` override rather than a config field."
