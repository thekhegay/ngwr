<ngwr-doc-page
  title="Configuration"
  description="Every ngwr provider in one reference. Wire what you use at bootstrap — the rest is tree-shaken away."
  [keywords]="['configuration', 'providers', 'bootstrap', 'provideWr']"
  [labels]="['Getting started']"
>
  <ngwr-doc-section
    title="Complete bootstrap"
    description="A full-featured `main.ts` showing every common ngwr provider. Delete what you don't need."
  >
    <ngwr-doc-code [code]="snippets.bootstrap" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Overlay"
    description="`provideWrOverlay()` backs every overlay component — dialog, drawer, popover, dropdown, select, tooltip, menus, pickers — with an overlay container and an `Overlay` instance of NGWR's own. Both tokens fall back to CDK's root instances, so panels still open without it; what you lose is the isolation from other CDK consumers and the `--wr-keyboard-inset` that lets a mobile sheet clear the on-screen keyboard. Call it once."
  >
    <ngwr-doc-code [code]="snippets.overlay" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Icons"
    description="Pass only the icon symbols you actually use — the rest tree-shake out. Scaffold a barrel file with `ng g ngwr:icon-set`."
  >
    <ngwr-doc-code [code]="snippets.icons" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Toast"
    description="Stack of dismissible notifications, defaulting to the top-end corner. Inject `WrToast` and call `show(...)` from anywhere — the provider only sets defaults, so it is optional."
  >
    <ngwr-doc-code [code]="snippets.toast" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Internationalization (i18n)"
    description="Catalog-driven translations with double-mustache interpolation, scopes, and a live locale switch. Pair `provideWrI18n` with either the static loader or `provideWrI18nHttpLoader`. See the [Internationalization primer](/guides/translations) for the full story."
  >
    <ngwr-doc-code [code]="snippets.i18n" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Date adapter"
    description="Required by `wr-calendar`, `wr-date-picker` (every mode), `wr-calendar-heatmap`. Native adapter ships zero peer deps; date-fns and Luxon adapters live under separate subpaths."
  >
    <ngwr-doc-code [code]="snippets.dateAdapter" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Component defaults"
    description="`provideWrConfig()` sets what a component falls back to when a template says nothing — the shared `size` scale, the `rounded` shape on the controls that have one, and `<wr-markdown>`'s link target and copy button. A bound value always wins, so nothing has to be re-stated to escape it — and a bound `false` turns a configured `true` back off, because `false` is a value rather than an absence. Intent is deliberately not a key: `null` is how a template says nothing, and it is also how the lib's own chrome says “no colour”."
  >
    <ngwr-doc-code [code]="snippets.config" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Density"
    description="One knob for app-wide sizing. The provider picks a preset; the per-axis multipliers behind the presets are CSS custom properties, so a value between two presets is a `:root` override rather than a config field."
  >
    <ngwr-doc-code [code]="snippets.density" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Theme"
    description="Light / dark / auto with optional `localStorage` persistence. Inject `WrTheme` to read or toggle at runtime — `theme.set('dark')`, `theme.toggle()`."
  >
    <ngwr-doc-code [code]="snippets.theme" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Loading bar"
    description="Router-aware top bar. Auto-shows on `NavigationStart`, hides on `NavigationEnd` / `Cancel`. Imperative `WrLoadingBar.start()` / `complete()` available for non-router waits."
  >
    <ngwr-doc-code [code]="snippets.loadingBar" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Cookie"
    description="SSR-safe typed cookie service. Inject `WrCookie` and call `get(name)` / `set(name, value, opts)` / `remove(name)`."
  >
    <ngwr-doc-code [code]="snippets.cookie" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Storage"
    description="Swappable engine (local / session / memory / custom) with TTL and a reactive watch signal."
  >
    <ngwr-doc-code [code]="snippets.storage" language="angular-ts" />
  </ngwr-doc-section>
</ngwr-doc-page>
