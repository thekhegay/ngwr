<ngwr-doc-page
  title="Lucide"
  [description]="lede()"
  [keywords]="['icons', 'lucide']"
  [labels]="['lucideIcons()', 'ISC']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-install packages="lucide" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Wire icons"
    description="Pass the icons you import from `lucide` to `lucideIcons()` from `ngwr/icon`. Tree-shakes per icon — only what you import ships."
  >
    <ngwr-doc-code [code]="usage" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Browse the catalog">
    <ngwr-icon-grid [icons]="icons()" [snippetFor]="snippetFor" />
  </ngwr-doc-section>
</ngwr-doc-page>
