<ngwr-doc-page
  title="Icons"
  updated="16.0.0"
  description="ngwr ships a registry-based icon system. Bring any icon set you like — install the upstream package separately, then wire icons via `provideWrIcons()`. The library bundles no upstream icons of its own."
  [keywords]="['icons', 'icon-set', 'lucide', 'feather', 'tabler', 'phosphor', 'heroicons']"
  [labels]="['Reference']"
>
  <ngwr-doc-section
    title="The shape"
    description="Everything resolves to a `WrIconDef` — `{ name: string, data: string }` where `data` is a full `<svg>…</svg>` string. Register one or more via `provideWrIcons(...)` and reference by `name` from any `<wr-icon>` instance."
  >
    <ngwr-doc-code [code]="snippets.register" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Pattern 1 — wrSvgIcon() for raw SVG files"
    description="The default path. Bundle the SVG as a string via your bundler's raw import, hand it to `wrSvgIcon()`. Works with every set that ships SVG files — Feather, Tabler, Phosphor, Heroicons, Iconoir, Radix, Bootstrap, and any random icons your designer hands you."
  >
    <ngwr-doc-code [code]="snippets.wrSvgIcon" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Pattern 2 — wrLucideIcons() for Lucide"
    description="Lucide doesn't ship SVG files — it exports per-icon IconNode tuples. Pass the ones you import to `wrLucideIcons()` from `ngwr/icon`, which renders them into the same `WrIconDef` shape."
  >
    <ngwr-doc-code [code]="snippets.lucide" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Scaffold with the schematic"
    description="Faster path for the common case — let the CLI write the boilerplate."
  >
    <ngwr-doc-code [code]="snippets.schematic" language="bash" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
