<!--
  The `<wr-result-404>` preset, not `<wr-result>` spelled out: status, title and
  the `result.notFound` copy are exactly what the preset declares, and the docs
  site should be its own first consumer. Only the description is overridden,
  because this one names the two links below it.
-->
<main class="ngwr-not-found">
  <wr-result-404 description="That page has moved or never existed. The links below are the fastest way back.">
    <a wr-btn color="primary" wrResultExtra [routerLink]="routes.index">Go home</a>
    <a wr-btn outlined wrResultExtra [routerLink]="[routes.index, routes.reference.index]">Browse the reference</a>
  </wr-result-404>
</main>

<ngwr-footer contained />
