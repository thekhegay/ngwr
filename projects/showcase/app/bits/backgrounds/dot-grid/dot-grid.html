<ngwr-doc-page
  title="Dot Grid"
  since="15.1.0"
  description="A field of dots behind your content that lights up and moves aside near the pointer."
  [keywords]="['dot grid', 'wr-dot-grid', 'background', 'dots', 'animation', 'reactbits']"
  [labels]="['Animation']"
>
  <ngwr-reactbits-credit slug="dot-grid" category="backgrounds" />

  <ngwr-doc-section
    title="Playground"
    description="Put it in a positioned box; it fills that box and follows the pointer over the content in front of it."
  >
    <ngwr-doc-playground [code]="snippet()" [controls]="controls">
      <div style="position: relative; width: 100%; height: 18rem; border-radius: 0.75rem; overflow: hidden">
        <wr-dot-grid
          [dotSize]="dotSize()"
          [gap]="gap()"
          [radius]="radius()"
          [strength]="strength()"
          [dotColor]="dotColor() || null"
          [activeColor]="activeColor() || null"
        />
        <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%">
          <p wrTypography variant="h3" style="margin: 0">Content above the dots</p>
        </div>
      </div>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Light only"
    description="A strength of 0 keeps every dot in place. Colours take any CSS colour, a theme token included, and follow the colour scheme."
  >
    <ngwr-doc-snippet [code]="snippets.tokens">
      <div style="position: relative; width: 100%; height: 12rem; border-radius: 0.75rem; overflow: hidden">
        <wr-dot-grid activeColor="var(--wr-color-success)" [strength]="0" [gap]="18" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
