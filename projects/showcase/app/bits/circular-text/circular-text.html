<ngwr-doc-page
  title="Circular Text"
  description="Text laid out around a circle, with the whole circle spinning. Hover swaps the spin rate (or pauses) without resetting the rotation angle — which is why the spin is a Web Animations API animation rather than a CSS keyframe: changing `animation-duration` mid-flight makes the browser recompute progress against the new duration and visibly jump. No per-frame JS loop either way; the `scale` on hover is still plain CSS."
  [keywords]="['circular-text', 'wr-circular-text', 'text animation', 'reactbits']"
  [labels]="['Animation']"
>
  <ngwr-reactbits-credit slug="circular-text" category="text-animations" />

  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="snippet()" [controls]="controls">
      <div style="display: flex; justify-content: center; padding: 1rem; width: 100%">
        <wr-circular-text
          [text]="text()"
          [spinDuration]="spinDuration()"
          [onHover]="onHover()"
          style="font-size: 1.25rem; color: var(--wr-color-on-surface)"
        />
      </div>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
