<ngwr-doc-page
  title="Line Chart"
  description="Multi-series line chart with a hover tooltip that snaps to the nearest x-axis tick."
  [keywords]="['line-chart', 'wr-line-chart']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Multi-series">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-line-chart style="width: 100%" [series]="series" [xLabels]="xLabels" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>
  <ngwr-doc-section
    title="Tooltip"
    description="Hover the plot for every series' value at the nearest x label. Set `[tooltip]` to `false` to drop the crosshair, the point markers and the tooltip together."
  >
    <ngwr-doc-code [code]="snippets.tooltip" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 2rem; flex-wrap: wrap; width: 100%">
        <div style="flex: 1 1 16rem; min-width: 0">
          <p style="margin: 0 0 0.5rem; color: var(--wr-color-on-surface-muted); font-size: 0.875rem">On (default)</p>
          <wr-line-chart [series]="series" [xLabels]="xLabels" style="width: 100%" />
        </div>
        <div style="flex: 1 1 16rem; min-width: 0">
          <p style="margin: 0 0 0.5rem; color: var(--wr-color-on-surface-muted); font-size: 0.875rem">
            <code>[tooltip]="false"</code>
          </p>
          <wr-line-chart [series]="series" [xLabels]="xLabels" [tooltip]="false" style="width: 100%" />
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>
  <ngwr-doc-section title="API" description="Inputs of &lt;wr-line-chart&gt;.">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
  <ngwr-doc-section title="Types" description="Data shapes used by the inputs and outputs above.">
    <ngwr-doc-code [code]="typeSnippet" language="angular-ts" />
    <ngwr-doc-api [rows]="typeRows" />
  </ngwr-doc-section>
</ngwr-doc-page>
