<ngwr-doc-page
  title="Sparkline"
  updated="16.5.0"
  description="A small trend line with no axes, to sit beside a number."
  [keywords]="['sparkline', 'trend', 'wr-sparkline']"
  [labels]="['Component']"
>
  <ngwr-doc-section
    title="Basic"
    description="The line is the first colour of the chart palette. The dot on the last point stays inside `width` by `height`: the drawing is inset by its radius."
  >
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-sparkline [data]="data" width="100%" height="4rem" style="display: block; width: 100%" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="In a row"
    description="At its default size beside a number. The dot of a last point at the edge is not cut by the cell."
  >
    <ngwr-doc-code [code]="snippets.inline" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; align-items: center; gap: 0.75rem; overflow: hidden">
        <strong>1,284</strong>
        <wr-sparkline [data]="data" ariaLabel="Signups, last 30 days" />
        <wr-sparkline [data]="data" color="var(--wr-chart-2)" [strokeWidth]="2" ariaLabel="Visits, last 30 days" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>
  <ngwr-doc-section title="Filled area" description="Set `[showArea]` to fill under the line.">
    <ngwr-doc-code [code]="snippets.area" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-sparkline
        [data]="data"
        [showArea]="true"
        color="var(--wr-chart-2)"
        width="100%"
        height="4rem"
        style="display: block; width: 100%"
      />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Tooltip" description='Set `[tooltip]="false"` to turn it off.'>
    <ngwr-doc-code [code]="snippets.tooltip" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div class="ngwr-demo-pair">
        <div>
          <p class="ngwr-demo-pair__caption">On (default)</p>
          <wr-sparkline [data]="data" ariaLabel="Signups" style="width: 100%" />
        </div>
        <div>
          <p class="ngwr-demo-pair__caption">
            <code>[tooltip]="false"</code>
          </p>
          <wr-sparkline [data]="data" ariaLabel="Signups" [tooltip]="false" style="width: 100%" />
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
