<ngwr-doc-page
  title="Configuration"
  description="Every ngwr provider in one reference. Wire what you use at bootstrap — the rest is tree-shaken away."
  [keywords]="['configuration', 'providers', 'bootstrap', 'provideWr']"
  [labels]="['Getting started']"
>
  <ngwr-doc-section
    title="Complete bootstrap"
    description="A full-featured `main.ts` showing every common ngwr provider. Delete what you don't need."
  >
    <ngwr-doc-code [code]="snippets.bootstrap" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Overlay"
    description="`provideWrOverlay()` backs every overlay component — dialog, drawer, popover, dropdown, select, tooltip, menus, pickers — with an overlay container and an `Overlay` instance of NGWR's own. Both tokens fall back to CDK's root instances, so panels still open without it; what you lose is the isolation from other CDK consumers and the `--wr-keyboard-inset` property that tracks the on-screen keyboard. Call it once. **“Optional” here means the app still works, not that it is free:** what the provider references is CDK's overlay module, which is the largest single dependency anything in this catalog reaches for. In an app that renders any overlay component the module is already in the graph and the provider adds close to nothing; in an app that renders none, it is the whole of it — so skipping it as a size decision only pays off in an app with no dialog, no select and no dropdown, which is the app that was never going to call it."
  >
    <ngwr-doc-code [code]="snippets.overlay" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Icons"
    description="Pass only the icon symbols you actually use — the rest tree-shake out. Scaffold a barrel file with `ng g ngwr:icon-set`. `provideWrIcons()` works at any level and chains, so a route adds to the set its parent registered rather than replacing it."
  >
    <ngwr-doc-code [code]="snippets.icons" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Toast"
    description="Stack of dismissible notifications, defaulting to the top-end corner. Inject `WrToast` and call `show(...)` from anywhere — the provider only sets defaults, so it is optional. Call it at bootstrap: `WrToast` is root-provided and reads its config once from the root injector, so a route-level call is never read, and says so in dev mode."
  >
    <ngwr-doc-code [code]="snippets.toast" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Internationalization (i18n)"
    description="Catalog-driven translations with double-mustache interpolation, scopes, and a live locale switch. Pair `provideWrI18n` with either the static loader or `provideWrI18nHttpLoader`. See the [Internationalization primer](/guides/translations) for the full story."
  >
    <ngwr-doc-code [code]="snippets.i18n" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Date adapter"
    description="Required by `wr-calendar`, `wr-event-calendar`, `wr-date-picker` (every mode). ngwr ships one adapter, the native one over `Date` and `Intl`, with no peer dependency. To run on another date library, extend `WrDateAdapter<Date>` (the components hold and compare native `Date` values), do the arithmetic, formatting and parsing through that library, and pass your class as `adapter`."
  >
    <ngwr-doc-code [code]="snippets.dateAdapter" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Density"
    description="One knob for app-wide sizing. The provider picks a preset; the per-axis multipliers behind the presets are CSS custom properties, so a value between two presets is a `:root` override rather than a config field."
  >
    <ngwr-doc-code [code]="snippets.density" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Theme"
    description="No provider: the theme follows the OS through `color-scheme` out of the box. Inject `WrTheme` to read or switch it at runtime — `theme.set('dark')`, `theme.toggle()` — and override `WR_THEME_CONFIG` only to change the default mode or the storage key. A default other than `auto` applies when `WrTheme` is first injected, so inject it once at boot or ship [`wrThemePrePaintScript()`](/reference/services/theme) with the same options."
  >
    <ngwr-doc-code [code]="snippets.theme" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Loading bar"
    description="A top progress bar driven by `WrLoadingBar.start()` / `complete()`, which need no provider. Router navigations drive it only once you add `provideWrLoadingBarRouter()` from `ngwr/loading-bar/router`: then `NavigationStart` shows it and `NavigationEnd` / `Cancel` / `Error` hide it. Without that call the bar never moves for a navigation, and nothing warns. It is opt-in because the subscription is what brings `@angular/router` into the bundle."
  >
    <ngwr-doc-code [code]="snippets.loadingBar" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Cookie"
    description="SSR-safe typed cookie service. Inject `WrCookie` and call `get(name)` / `set(name, value, opts)` / `remove(name)`."
  >
    <ngwr-doc-code [code]="snippets.cookie" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Storage"
    description="Swappable engine (local / session / memory / custom) with TTL and a reactive watch signal."
  >
    <ngwr-doc-code [code]="snippets.storage" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
