<ngwr-doc-page
  title="Catalog"
  description="The public types you reach for most often, grouped by area — each linked to the component, service or page that uses it. Not the complete set: the library exports a couple of hundred type names, most of them the option and item shapes of a single component, and every entry point re-exports its own through `interfaces/`."
  [keywords]="['types', 'catalog', 'interfaces']"
  [labels]="['Type']"
>
  @for (group of groups; track group.title) {
    <ngwr-doc-section [title]="group.title">
      <ul class="ngwr-type-list">
        @for (t of group.items; track t.name) {
          <li>
            <a [routerLink]="t.url"
              ><code>{{ t.name }}</code></a
            >
            <span>{{ t.description }}</span>
          </li>
        }
      </ul>
    </ngwr-doc-section>
  }
</ngwr-doc-page>
