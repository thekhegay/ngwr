<ngwr-doc-page
  title="cardNumber"
  description="Check a card number: 13 to 19 digits with a valid Luhn checksum."
  [keywords]="['cardNumber', 'luhn', 'payment', 'validator', 'wr-validators']"
  [labels]="['Validator']"
>
  <ngwr-doc-section title="Live demo" description="Try the test number `4242 4242 4242 4242`.">
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; min-width: min(22rem, 100%)"
      >
        <input wrInput [formControl]="control" placeholder="4242 4242 4242 4242" />
        <code style="font-size: 0.8125rem">errors: {{ control.errors | json }}</code>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippet" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
