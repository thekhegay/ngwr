<ngwr-doc-page
  title="iban"
  description="Check an IBAN's structure and mod-97 checksum."
  [keywords]="['iban', 'bank', 'mod97', 'validator', 'wr-validators']"
  [labels]="['Validator']"
>
  <ngwr-doc-section title="Live demo" description="Try `GB82 WEST 1234 5698 7654 32`.">
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; min-width: min(24rem, 100%)"
      >
        <input wrInput [formControl]="control" placeholder="GB82 WEST 1234 5698 7654 32" />
        <code>errors: {{ control.errors | json }}</code>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippet" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
