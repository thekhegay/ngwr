<ngwr-doc-page
  title="match"
  description="Check that a control equals a sibling, such as a password confirmation."
  [keywords]="['match', 'confirm', 'password', 'validator', 'wr-validators']"
  [labels]="['Validator']"
>
  <ngwr-doc-section title="Live demo">
    <ngwr-doc-snippet code="">
      <div
        [formGroup]="form"
        style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; min-width: 20rem"
      >
        <input
          wrInput
          formControlName="password"
          placeholder="password"
          type="text"
          style="-webkit-text-security: disc"
          autocomplete="off"
        />
        <input
          wrInput
          formControlName="confirm"
          placeholder="confirm"
          type="text"
          style="-webkit-text-security: disc"
          autocomplete="off"
        />
        <code>confirm.errors: {{ form.controls.confirm.errors | json }}</code>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippet" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Initial mismatch"
    description="Code that reads `form.valid` before the template binds misses it; add [`matchFields`](/reference/validators/match-fields) to the group."
  />

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
