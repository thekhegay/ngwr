<ngwr-doc-page
  title="matchFields"
  description="Check that two or more controls in a group hold the same value."
  [keywords]="['matchFields', 'match', 'confirm', 'password', 'cross-field', 'validator', 'wr-validators']"
  [labels]="['Validator']"
>
  <ngwr-doc-section
    title="Live demo"
    description="The form starts with two values that disagree, and `form.errors` reports it at once."
  >
    <ngwr-doc-snippet code="">
      <div
        [formGroup]="form"
        style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; min-width: 20rem"
      >
        <input
          wrInput
          formControlName="password"
          placeholder="password"
          type="text"
          style="-webkit-text-security: disc"
          autocomplete="off"
        />
        <input
          wrInput
          formControlName="confirm"
          placeholder="confirm"
          type="text"
          style="-webkit-text-security: disc"
          autocomplete="off"
        />
        <code style="font-size: 0.8125rem">form.errors: {{ form.errors | json }}</code>
        <code style="font-size: 0.8125rem">form.valid: {{ form.valid }}</code>
        <code style="font-size: 0.8125rem">confirm.errors: {{ form.controls.confirm.errors | json }}</code>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippet" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Pair it with match"
    description="`<wr-form-field>` cannot show a group error, so add [`match`](/reference/validators/match) on the confirm control for the field message."
  >
    <ngwr-doc-code [code]="pairing" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Paths and arity"
    description="Names are `get()` paths. With more than two, each is compared with the first."
  >
    <ngwr-doc-code [code]="nested" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
