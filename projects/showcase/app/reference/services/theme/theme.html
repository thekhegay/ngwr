<ngwr-doc-page
  title="WrTheme"
  updated="15.0.0"
  description="Switch between light, dark and auto, and keep the choice."
  [keywords]="['service', 'theme', 'dark mode', 'color-scheme', 'WrTheme']"
  [labels]="['Service']"
>
  <ngwr-doc-section title="Usage" description="Needs no provider: inject it where the toggle lives.">
    <ngwr-doc-code [code]="snippets.usage" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="font-family: var(--wr-font-family-base); font-size: 0.875rem; line-height: 1.5">
        <div>
          Mode: <strong>{{ themeService.mode() }}</strong> · Resolved:
          <strong>{{ themeService.resolved() }}</strong>
        </div>
        <wr-segmented
          style="margin-top: 0.5rem"
          [options]="modeOptions"
          [value]="themeService.mode()"
          (valueChange)="setTheme($event)"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Configuration"
    description="`withTheme()` in `provideWr()` sets `defaultMode` and `storageKey`."
  >
    <ngwr-doc-code [code]="snippets.config" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="SSR: no flash of the wrong theme"
    description="Put this script in `<head>`, above the stylesheets, so a stored choice applies before the first paint."
  >
    <ngwr-doc-code [code]="prePaint" language="html" />
    <ngwr-doc-code [code]="snippets.prePaintCustom" language="typescript" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Gotchas">
    <ul>
      <li>
        Without <code>withTheme()</code>, a stored choice applies only once something injects <code>WrTheme</code>.
      </li>
      <li><code>withTheme()</code> in a route's providers is ignored.</li>
      <li>With two Angular apps on one page, only one should inject <code>WrTheme</code>.</li>
    </ul>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
