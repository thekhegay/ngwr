<ngwr-doc-page
  title="WrLoadingBar"
  description="A progress bar at the top of the page for requests and other long tasks."
  [keywords]="['loading bar', 'progress', 'nprogress', 'wr-loading-bar', 'service']"
  [labels]="['Service']"
>
  <ngwr-doc-section
    title="Live demo"
    description="Each `start()` opens a slot and each `complete()` closes one; the bar runs while any slot is open."
  >
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start">
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
          <button wr-btn type="button" color="primary" (click)="fake()">Fake 1.5s task</button>
          <button wr-btn type="button" (click)="start()">Open slot</button>
          <button wr-btn type="button" (click)="complete()">Close slot</button>
        </div>
        <p style="margin: 0; font-size: 0.875rem">
          progress: <code>{{ bar.progress() | number: '1.0-2' }}</code> · state:
          <code>{{ bar.state() }}</code>
        </p>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="HTTP interceptor"
    description="Concurrent requests share one bar until the last one finishes."
  >
    <ngwr-doc-code [code]="snippets.intercept" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Router navigation"
    description="Add `provideWrLoadingBarRouter()`, or navigation never moves the bar."
  >
    <ngwr-doc-code [code]="snippets.router" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Styling" description="Place one `<wr-loading-bar>` in the app shell.">
    <ngwr-doc-code [code]="snippets.style" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
