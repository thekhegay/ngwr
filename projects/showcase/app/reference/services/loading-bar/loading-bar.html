<ngwr-doc-page
  title="WrLoadingBar"
  description="Top-of-page progress bar with a `start()` / `complete()` slot API for HTTP interceptors or any long-running task. Add `provideWrLoadingBarRouter()` and router navigations drive it as well — an opt-in, because that subscription is what would otherwise pull `@angular/router` into an app that never routes."
  [keywords]="['loading bar', 'progress', 'nprogress', 'wr-loading-bar', 'service']"
  [labels]="['Service']"
>
  <ngwr-doc-section
    title="Live demo"
    description="Click below — the bar at the top of this page ticks. This site adds `provideWrLoadingBarRouter()`, so changing page drives it too."
  >
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start">
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
          <button wr-btn type="button" color="primary" (click)="fake()">Fake 1.5s task</button>
          <button wr-btn type="button" (click)="start()">Open slot</button>
          <button wr-btn type="button" (click)="complete()">Close slot</button>
        </div>
        <p style="margin: 0; font-size: 0.875rem">
          progress: <code>{{ bar.progress() | number: '1.0-2' }}</code> · state:
          <code>{{ bar.state() }}</code>
        </p>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="HTTP interceptor"
    description="Slot-counted — multiple concurrent requests stack, bar stays running until the last finishes."
  >
    <ngwr-doc-code [code]="snippets.intercept" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Styling">
    <ngwr-doc-code [code]="snippets.style" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Why ngwr provides this"
    description="The service owns the parts every app shell would otherwise rewrite: slot COUNTING, so concurrent requests share one bar instead of fighting over it; the asymptotic trickle toward 90% that keeps a long wait moving without promising an end; and the fast-forward-and-reset when the last slot closes. What it deliberately does NOT own is the router — `WrLoadingBar` injects nothing from `@angular/router`, so an app that never routes pays none of it, and an app that does adds `provideWrLoadingBarRouter()` from `ngwr/loading-bar/router`. Without that provider the bar still works for manual `start()` / `complete()` and simply never moves on navigation, which is a silence worth checking for."
  />

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
