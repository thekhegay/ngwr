<ngwr-doc-page
  title="WrDensity"
  description="Switch control spacing between `sm`, `md`, `lg` and `touch`."
  [keywords]="['density', 'sm', 'md', 'lg', 'touch', 'spacing', 'wr-density', 'service']"
  [labels]="['Service']"
>
  <ngwr-doc-section
    title="Live demo — global"
    description="`set()` changes the density for the whole app, and the choice is stored."
  >
    <ngwr-doc-code [code]="snippets.usage" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 1rem; align-items: flex-start">
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
          @for (m of modes; track m) {
            <button wr-btn type="button" [color]="current() === m ? 'primary' : null" (click)="set(m)">
              {{ m }}
            </button>
          }
        </div>
        <p style="margin: 0">
          Active density: <code>{{ current() }}</code>
        </p>

        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center">
          <input wrInput placeholder="Type here" />
          <wr-select [formControl]="demoSelect" style="min-width: 8rem">
            <wr-option value="xs">xs</wr-option>
            <wr-option value="sm">sm</wr-option>
            <wr-option value="md">md</wr-option>
            <wr-option value="lg">lg</wr-option>
          </wr-select>
          <button wr-btn type="button" color="primary">Save</button>
          <wr-tag>ngwr</wr-tag>
          <wr-tag color="primary">density</wr-tag>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Per-subtree override"
    description="Put `[wrDensity]` on an element to give its subtree its own density."
  >
    <ngwr-doc-snippet [code]="snippets.directive">
      <div
        wrDensity="sm"
        style="
          display: flex;
          gap: 0.5rem;
          align-items: center;
          padding: 0.5rem;
          border: 1px dashed var(--wr-border-base);
          border-radius: 0.5rem;
        "
      >
        <input wrInput placeholder="Compact-only field" />
        <button wr-btn type="button">Action</button>
        <wr-tag>scoped</wr-tag>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Override the multipliers"
    description="Re-declare them on the level's `[data-wr-density]` selector; on `:root` the shipped values win."
  >
    <ngwr-doc-code [code]="snippets.tokens" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Configure"
    description="Add `withDensity()` to the app's own `provideWr()`; in a route's providers it is ignored."
  >
    <ngwr-doc-code [code]="snippets.provider" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
