<ngwr-doc-page
  title="wrRange"
  description="Turn a count into `[0, 1, …, n - 1]` to repeat a block with `@for`."
  [keywords]="['wrRange', 'pipe', 'range', 'for', 'sequence']"
  [labels]="['Pipe']"
>
  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
    <ngwr-doc-snippet code="">
      <ul>
        @for (i of 5 | wrRange; track i) {
          <li>Item {{ i + 1 }}</li>
        }
      </ul>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
