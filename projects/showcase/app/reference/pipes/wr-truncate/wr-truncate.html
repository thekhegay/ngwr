<ngwr-doc-page
  title="wrTruncate"
  description="Shorten a string and end it with an ellipsis."
  [keywords]="['pipe', 'wrTruncate', 'truncate', 'string', 'ellipsis']"
  [labels]="['Pipe']"
>
  <ngwr-doc-section title="Basic usage" description="A shorter string passes through unchanged.">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div>{{ longText() | wrTruncate: 24 }}</div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Custom ellipsis" description="The third argument replaces `…` and is added after the cut.">
    <ngwr-doc-code [code]="snippets.ellipsis" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div>{{ longText() | wrTruncate: 24 : ' [more]' }}</div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="playgroundSnippet()" [controls]="controls">
      <p class="ngwr-pipe-output">{{ text() | wrTruncate: length() : ellipsis() }}</p>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
