<ngwr-doc-page
  title="wrDate"
  description="Format a date with a named preset or a token string."
  [keywords]="['pipe', 'wrDate', 'date', 'format', 'intl']"
  [labels]="['Pipe']"
>
  <ngwr-doc-section
    title="Named keys"
    description="Six presets that follow the app locale. With no argument, `shortDate`."
  >
    <ngwr-doc-code [code]="snippets.named" language="angular-html" />
    <ngwr-doc-snippet code="">
      <!-- Keep the <tbody>: without it hydration fails (NG0501). -->
      <table class="ngwr-pipe-table">
        <tbody>
          @for (key of namedKeys; track key) {
            <tr>
              <td>
                <code>{{ key }}</code>
              </td>
              <td>{{ now() | wrDate: key }}</td>
            </tr>
          }
        </tbody>
      </table>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Token strings"
    description="Tokens: `yyyy yy MMMM MMM MM M dd d HH H hh h mm ss a`, plus 'quoted' text. There is no weekday token."
  >
    <ngwr-doc-code [code]="snippets.tokens" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div>
        {{ now() | wrDate: 'dd.MM.yyyy' }} · {{ now() | wrDate: 'd MMMM yyyy' }} · {{ now() | wrDate: 'HH:mm:ss' }}
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="playgroundSnippet()" [controls]="controls">
      <p class="ngwr-pipe-output">{{ now() | wrDate: format() }}</p>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
