<ngwr-doc-page
  title="wrDate"
  description="Uses `WrDateAdapter` when `provideWrDateAdapter()` is wired up; otherwise falls back to `Intl.DateTimeFormat` with the same named format keys."
  [keywords]="['pipe', 'wrDate', 'date', 'format', 'intl']"
  [labels]="['Pipe']"
>
  <ngwr-doc-section title="Import">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Named keys"
    description="Six locale-aware presets work with or without an adapter — they map to `Intl` date/time styles."
  >
    <ngwr-doc-code [code]="snippets.named" language="angular-html" />
    <ngwr-doc-snippet code="">
      <!-- The `<tbody>` is load-bearing, not tidiness: rows written straight
           into `<table>` serialize that way, but the browser's HTML parser
           inserts an implicit `<tbody>` around them, so the live DOM no longer
           matches what the server wrote. Hydration then walks off the end of
           the table and throws — `NG0501` under `ng serve`, reported in the
           optimized build as a `nextSibling` TypeError — and the page loses its
           title to the meta fallback. -->
      <table class="ngwr-pipe-table">
        <tbody>
          @for (key of namedKeys; track key) {
            <tr>
              <td>
                <code>{{ key }}</code>
              </td>
              <td>{{ now() | wrDate: key }}</td>
            </tr>
          }
        </tbody>
      </table>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Token strings"
    description="A raw format string goes straight to the adapter, so the tokens are whichever ones THAT adapter knows — not a fixed language. The demo below runs on `WrNativeDateAdapter`, whose set is `yyyy yy MMMM MMM MM M dd d HH H hh h mm ss a` plus single-quoted literals. It has no weekday token: `EEEE` is not recognised and comes out verbatim. `ngwr/date/adapters/fns` forwards the pattern to date-fns untouched, so there the token set is date-fns's."
  >
    <ngwr-doc-code [code]="snippets.tokens" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div>
        {{ now() | wrDate: 'dd.MM.yyyy' }} · {{ now() | wrDate: 'd MMMM yyyy' }} · {{ now() | wrDate: 'HH:mm:ss' }}
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="playgroundSnippet()" [controls]="controls">
      <p class="ngwr-pipe-output">{{ now() | wrDate: format() }}</p>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
