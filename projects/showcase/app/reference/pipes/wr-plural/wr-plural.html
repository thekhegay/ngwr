<ngwr-doc-page
  title="wrPlural"
  description="Pick the right word form for a count, in any language."
  [keywords]="['wrPlural', 'plural', 'pluralization', 'i18n', 'pipe']"
  [labels]="['Pipe']"
>
  <ngwr-doc-section title="Live demo" description="Drag the count: English has two forms, Russian three.">
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; min-width: 18rem">
        <wr-slider [min]="0" [max]="25" [value]="count()" (valueChange)="setCount($event)" />
        <code style="font-size: 0.875rem">{{ count() | wrPlural: en }}</code>
        <code style="font-size: 0.875rem">{{ count() | wrPlural: ru : { locale: 'ru' } }}</code>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Usage"
    description="Key the forms by CLDR category: `zero`, `one`, `two`, `few`, `many`, `other`. A missing form falls back to `other`."
  >
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
