  <ngwr-doc-section
    title="Why ngwr provides this"
    description="Splitting on whitespace is the point of it. The CDK applies an overlay's `panelClass` with `classList.add()` and never splits a string, so a single `'p-4 rounded-xl'` reaches `add('p-4 rounded-xl')` and throws `InvalidCharacterError` — taking the overlay down with it. Which is the first form anyone writing utility classes reaches for. It is exported because the same rule applies to any class list you build yourself."
