  <ngwr-doc-section
    title="Why ngwr provides this"
    description="This used to be the only way to get a narrowed array out of `filter`, and since TypeScript 5.5 it is not: the compiler infers a type predicate for an inline arrow, so `arr.filter(x => x !== null && x !== undefined)` already gives you `T[]`. What is left is worth less but is still real — one named guard instead of the comparison re-typed at every call site, `Maybe<T>` as its parameter type so an optional field reads as one idea, and a predicate you can pass to `filter`, use in an `if`, and `.every()` over. Reach for it for the name, not for the narrowing."
  >
