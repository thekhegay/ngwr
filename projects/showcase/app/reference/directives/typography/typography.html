<ngwr-doc-page
  title="wrTypography"
  updated="15.0.0"
  description="Style any text element with a shared text role."

  [labels]="['Directive']"
>
  <ngwr-doc-section title="Selector" description="Put it on the element you already have and pick a `variant`.">

      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start">
        <p wrTypography variant="overline" tone="primary">ngwr/typography</p>
        <p wrTypography variant="h3">The directive styles what it sits on</p>
        <p wrTypography variant="lead" style="max-width: 40rem">
          Semantics stay yours — a heading is still an <code>&lt;h1&gt;</code>, a list still a <code>&lt;ul&gt;</code>.
        </p>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  </ngwr-doc-section>

  <ngwr-doc-section title="Variants" description="Some variants have their own colour, which `tone` overrides.">

  </ngwr-doc-section>

  <ngwr-doc-section title="Emitted classes" description="Target these from your own stylesheet.">
