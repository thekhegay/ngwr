<ngwr-doc-page
  title="wrClickOutside"
  description="Emit when a mousedown lands outside the element, to close a popup or an inline edit."
  [keywords]="['wrClickOutside', 'click', 'outside', 'directive']"
  [labels]="['Directive']"
>
  <ngwr-doc-section title="Usage">
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: inline-block; padding: 0.75rem 1rem; background: var(--wr-color-fill); border-radius: 0.375rem"
        (wrClickOutside)="onOutside()"
      >
        Click outside this box (count: {{ outside() }})
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
