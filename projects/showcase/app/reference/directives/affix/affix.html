<ngwr-doc-page
  title="wrAffix"
  description="Stick an element to the top on scroll and style it while it is stuck."
  [keywords]="['wrAffix', 'affix', 'sticky', 'directive', 'scroll']"
  [labels]="['Directive']"
>
  <ngwr-doc-section title="Usage" description="Style the stuck state with `.wr-affix--active`.">
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
    <ngwr-doc-code [code]="snippets.scss" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Demo (scroll inside the box)">
    <ngwr-doc-snippet code="">
      <!-- tabindex: a scrolling region must be reachable by keyboard. -->
      <div
        tabindex="0"
        style="
          width: 100%;
          height: 18rem;
          overflow: auto;
          border: 1px solid var(--wr-border-base);
          border-radius: 0.5rem;
          background: var(--wr-color-surface);
        "
      >
        <div style="height: 4rem"></div>
        <div
          wrAffix
          [wrAffixOffsetTop]="0"
          (wrAffixChange)="affixed.set($event)"
          style="
            padding: 0.75rem 1rem;
            background: var(--wr-color-surface);
            border-bottom: 1px solid var(--wr-border-base);
            font-weight: 600;
            transition: box-shadow 0.2s ease;
          "
          [style.box-shadow]="affixed() ? 'var(--wr-shadow-sm)' : 'none'"
        >
          Sticky header — affixed: {{ affixed() }}
        </div>
        @for (i of [].constructor(40); track $index) {
          <div style="padding: 0.5rem 1rem; border-bottom: 1px dashed var(--wr-border-base)">
            Scroll content row #{{ $index + 1 }}
          </div>
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
