<ngwr-doc-page
  title="wrAutofocus"
  description="Focus an element on init, or each time a binding turns true."
  [keywords]="['wrAutofocus', 'autofocus', 'directive']"
  [labels]="['Directive']"
>
  <ngwr-doc-section title="Usage" description="Setting the binding back to `false` does not blur the element.">
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap">
        <wr-btn (click)="autofocusOn.set(!autofocusOn())">
          {{ autofocusOn() ? 'Set the binding false' : 'Set the binding true' }}
        </wr-btn>
        <input
          wrInput
          [wrAutofocus]="autofocusOn()"
          placeholder="I focus when the binding flips to true"
          style="max-width: 18rem"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
