<ngwr-doc-page
  title="wrAutofocus"
  description="Moves DOM focus to the host on init. Bind a boolean to focus reactively whenever the expression becomes truthy."
  [keywords]="['wrAutofocus', 'autofocus', 'directive']"
  [labels]="['Directive']"
>
  <ngwr-doc-section
    title="Usage"
    description="Focus follows the transition to truthy, and the directive never blurs: setting the binding back to `false` leaves the caret where it is, so focusing again takes a flip back to `true`."
  >
    <ngwr-doc-code [code]="snippets.usage" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap">
        <wr-btn (click)="autofocusOn.set(!autofocusOn())">
          {{ autofocusOn() ? 'Set the binding false' : 'Set the binding true' }}
        </wr-btn>
        <input
          wrInput
          [wrAutofocus]="autofocusOn()"
          placeholder="I focus when the binding flips to true"
          style="max-width: 18rem"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
