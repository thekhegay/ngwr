<ngwr-doc-page
  title="Table"
  description="Data table with sortable / filterable headers and custom cell templates."
  [keywords]="['table', 'wr-table']"
  [labels]="['Component', 'Directive', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Basic usage"
    description="Define columns as a record keyed by row property names. Rows are plain objects."
  >
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%">
        <wr-table [columns]="columns" [items]="visibleRows()" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Sort + filter + custom cell"
    description="Sortable columns cycle asc → desc → off. Filter dropdown emits the selected items via filterChange. Project an [wrTableCell] template to customize a column's rendering."
  >
    <ngwr-doc-snippet [code]="snippets.custom">
      <div style="width: 100%">
        <wr-table [columns]="columns" [items]="visibleRows()" [(sort)]="sort" (filterChange)="onFilter($event)">
          <ng-template wrTableCell="role" let-value>
            <wr-tag [color]="value === 'admin' ? 'danger' : value === 'editor' ? 'primary' : 'medium'" transparent>
              {{ value }}
            </wr-tag>
          </ng-template>
        </wr-table>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Pagination"
    description="Set `[pageSize]` for client-side pagination — the table slices rows automatically and renders a `<wr-pagination>` footer. Pass `[totalItems]` to switch to server-side mode (you handle slicing)."
  >
    <ngwr-doc-snippet [code]="snippets.paginated">
      <div style="width: 100%">
        <wr-table [columns]="columns" [items]="paginatedRows" [pageSize]="5" [(page)]="page" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Virtual scroll"
    description="Set `virtualScroll` with a fixed `viewportHeight` to window thousands of rows — only the visible slice is in the DOM. It forces fixed column layout, assumes a uniform `rowHeight` (auto-measured by default), and falls back to the full render while grouping, tree rows, expandable rows, responsive cards or a pager is active. The table below holds 10,000 rows."
  >
    <ngwr-doc-code [code]="snippets.virtual" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table
          virtualScroll
          [rowHeight]="41"
          [viewportHeight]="440"
          [columns]="virtualColumns"
          [items]="virtualRows"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Row selection"
    description="Set `rowSelection` to `'multiple'` (checkboxes + a select-all header) or `'single'`. Bind `[(selection)]` to the selected row keys, and `rowKey` to identify rows (a property name or a function)."
  >
    <ngwr-doc-code [code]="snippets.selection" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table
          rowSelection="multiple"
          rowKey="email"
          [(selection)]="selected"
          [columns]="columns"
          [items]="visibleRows()"
        />
        <div style="margin-top: 0.75rem; font-size: 0.875rem; color: var(--wr-color-on-surface-muted)">
          selected: <strong>{{ selected().length }}</strong>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Expandable rows"
    description="Project an `<ng-template wrTableExpand let-row>` to reveal a detail panel per row — it adds a leading chevron column. Bind `[(expanded)]` (row keys) and set `rowKey`."
  >
    <ngwr-doc-code [code]="snippets.expandable" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table rowKey="email" [(expanded)]="expanded" [columns]="columns" [items]="visibleRows()">
          <ng-template wrTableExpand let-row>
            <div style="font-size: 0.875rem; color: var(--wr-color-on-surface-muted)">
              <strong>{{ row.name }}</strong> — {{ row.email }} · role: {{ row.role }}
            </div>
          </ng-template>
        </wr-table>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Summary row"
    description="Give a column a `summary` — a built-in aggregate (`'sum'` / `'avg'` / `'count'` / `'min'` / `'max'`) over its numeric values, or a function of all rows. A footer row appears with the results (computed over the current `items`)."
  >
    <ngwr-doc-code [code]="snippets.summary" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table [columns]="summaryColumns" [items]="summaryRows" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Row grouping"
    description="Set `groupBy` to a row property (or a function) to gather rows under collapsible band headers. Grouping runs after pagination — sort by the same key, or use `pageSize = 0`, to keep each group whole. Bind `[(collapsedGroups)]` (keyed by group value) to control or persist collapse. Scroll a pinned table sideways and the group label stays pinned to the left edge like a frozen column."
  >
    <ngwr-doc-code [code]="snippets.grouping" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table groupBy="role" [(collapsedGroups)]="groupCollapsed" [columns]="columns" [items]="visibleRows()" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Group subtotals"
    description="Add `groupSummary` to repeat each column's `summary` aggregate as a subtotal row under every group, computed over that group's rows. The grand footer still totals the whole dataset — with client-side pagination the two describe different scopes, so pair `groupSummary` with `pageSize = 0`."
  >
    <ngwr-doc-code [code]="snippets.groupSummary" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table groupBy="region" groupSummary [columns]="salesColumns" [items]="salesRows" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Custom group header"
    description="Project an `<ng-template wrTableGroupHeader>` for a rich band label — it receives the group `value`, `label`, `rows`, `count`, `collapsed` and a `toggle()` callback. The chevron and the group checkbox are still rendered by the table, so the template may contain its own interactive content."
  >
    <ngwr-doc-code [code]="snippets.groupHeader" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table groupBy="role" [columns]="columns" [items]="visibleRows()">
          <ng-template wrTableGroupHeader let-value let-count="count">
            <wr-tag color="primary" transparent>{{ value }}</wr-tag>
            <small style="color: var(--wr-color-on-surface-muted)">{{ count }} users</small>
          </ng-template>
        </wr-table>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="CSV export"
    description="Call `exportCsv()` on the table (via a template ref) to download its rows — headers from the column titles, values from the row data, in the current column order. It covers the current `items`, so in server-side mode (`totalItems` set) that's the current page. `{ selectedOnly: true }` exports just the selected rows; `toCsv()` returns the string instead of downloading."
  >
    <ngwr-doc-code [code]="snippets.csv" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; width: 100%; flex-direction: column; gap: 0.75rem">
        <wr-table #csvTable [columns]="columns" [items]="visibleRows()" />
        <div>
          <wr-btn size="sm" (click)="csvTable.exportCsv({ filename: 'users.csv' })">Export CSV</wr-btn>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Pinned columns"
    description="Set `pin: 'left'` or `pin: 'right'` on a column to freeze it against that edge while the rest scrolls horizontally. Several per side stack in order, and offsets are measured so columns of any width line up. Scroll the table below sideways — Name stays left, Status stays right."
  >
    <ngwr-doc-code [code]="snippets.pinned" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="max-width: 34rem">
        <wr-table [columns]="wideColumns" [items]="wideRows" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Resizable columns"
    description="Set `resizable: true` for a drag handle on the header's right edge. The first drag freezes the current widths and switches the table to fixed layout so resizing is exact in both directions; `width` sets an initial px width."
  >
    <ngwr-doc-code [code]="snippets.resizable" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table [columns]="resizableColumns" [items]="visibleRows()" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Reorderable columns"
    description="Set `reorderable` to drag column headers into a new order. Bind `[(columnOrder)]` (an array of keys) to control or persist the arrangement. Pinned columns stay anchored — they aren't draggable."
  >
    <ngwr-doc-code [code]="snippets.reorderable" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table reorderable [columns]="columns" [items]="visibleRows()" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Narrow container (stacked cards)"
    description="With `responsive`, each row collapses to a labelled card when the table's own box is too narrow for columns — a container query on its own width, so it adapts inside a split pane on any screen. Every cell shows its column title as a label. The box below is fixed at 360px."
  >
    <ngwr-doc-snippet code='<div style="width: 360px"><wr-table responsive [columns]="columns" [items]="rows" /></div>'>
      <div style="width: 360px; max-width: 100%">
        <wr-table responsive [columns]="columns" [items]="visibleRows()" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Tree rows"
    description="Set `childrenKey` to the property (or a function) holding each row&#39;s children and `items` becomes the roots. The forest is flattened into the same `&lt;tbody&gt;`, so child rows are ordinary `&lt;tr&gt;`s — column pin, resize, drag-reorder and `[wrTableCell]` templates all keep working at every depth. Open state reuses `[(expanded)]` and identity reuses `rowKey`. `treeColumn` picks which column carries the indent and chevron; without it the first rendered column does. `pageSize` pages the roots, selection and the summary row see every node, and the table announces itself as a `treegrid` with `aria-level` / `aria-posinset` / `aria-setsize` per row. Three pairings are refused rather than half-supported: `groupBy` wins over `childrenKey`, since a group buckets a flat list and a forest has none; a projected `[wrTableExpand]` loses to tree rows, which already own the row&#39;s disclosure; and `virtualScroll` falls back to the full render, because expanding a parent re-anchors the window."
  >
    <ngwr-doc-code [code]="snippets.tree" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-table
          rowKey="id"
          childrenKey="reports"
          treeColumn="name"
          rowSelection="multiple"
          [columns]="orgColumns"
          [items]="org"
          [(expanded)]="openRows"
          [(selection)]="picked"
        />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Types" description="Data shapes used by the inputs and outputs above.">
    <ngwr-doc-code [code]="typeSnippet" language="angular-ts" />
    <ngwr-doc-api [rows]="typeRows" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Templates" description="Projected templates the table renders in place of its defaults.">
    <ngwr-doc-api [rows]="templatesApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Methods" description="Called on the component instance via a template reference.">
    <ngwr-doc-api [rows]="methodsApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="&lt;wr-table-filter&gt;">
    <ngwr-doc-api [rows]="filterApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="&lt;wr-table-sort&gt;">
    <ngwr-doc-api [rows]="sortApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
