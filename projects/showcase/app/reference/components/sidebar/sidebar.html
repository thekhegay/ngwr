<ngwr-doc-page
  title="Sidebar"
  description="Data-driven nav with flat links and expandable groups. Active route auto-expands its containing group. Icons, trailing badges, and disabled state all opt-in per entry."
  [keywords]="['sidebar', 'navigation', 'nav', 'wr-sidebar']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Basic usage"
    description="Pass `[entries]` — either `WrSidebarItem` (direct link) or `WrSidebarGroup` (expand to reveal children). Badges accept any string. The host insets its rows by `--wr-sidebar-padding` (`0.5rem`), so a hover or active tint never meets the frame around it. Where the container already pads, set it to `0` on the sidebar itself (`.my-panel .wr-sidebar`): on the container it is shadowed by the host's own default."
  >
    <ngwr-doc-snippet [code]="snippets.template">
      <div class="demo-sidebar">
        <wr-sidebar [entries]="entries" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Which route counts as active"
    description="An entry gets `--active` while the current URL starts with its `url`, which is the router's own rule. An entry at `['/']` is therefore active on every page, and since an active row sets `pointer-events: none` it cannot be clicked from anywhere. Give that entry `activeOptions: { exact: true }`. The field takes anything `[routerLinkActiveOptions]` takes, so `paths`, `queryParams`, `matrixParams` and `fragment` work too. It decides the active class only: a group still expands for the route below it either way."
  >
    <ngwr-doc-code [code]="snippets.activeOptions" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
