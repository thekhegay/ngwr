<ngwr-doc-page
  title="Tree"
  updated="15.10.0"
  description="A nested list to browse and select from, inline or as a dropdown picker."
  [keywords]="['tree', 'tree-select', 'wr-tree', 'hierarchy', 'folders']"
  [labels]="['Composite']"
>
  <ngwr-doc-section
    title="Single selection"
    description="Bind `[(selected)]` and `[(expanded)]` to arrays of node ids."
  >
    <ngwr-doc-code [code]="snippets.single" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-tree ariaLabel="Project files" [nodes]="folders" [(selected)]="singleSelected" [(expanded)]="expanded" />
      <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
        Selected: {{ singleSelected().join(', ') || '(none)' }}
      </small>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Multi selection"
    description="A plain click replaces the selection; Cmd or Ctrl + click adds and removes a row."
  >
    <ngwr-doc-code [code]="snippets.multi" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-tree ariaLabel="Project files" [nodes]="folders" [(selected)]="multiSelected" selectionMode="multi" />
      <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
        Selected: {{ multiSelected().join(', ') || '(none)' }}
      </small>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Combobox mode — single"
    description='`openOn="overlay"` makes the tree a dropdown picker. Bind `[(value)]` or `[formField]`.'
  >
    <ngwr-doc-code [code]="snippets.overlaySingle" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-tree
        openOn="overlay"
        [nodes]="folders"
        selectionMode="single"
        placeholder="Pick a folder"
        [(value)]="comboSingle"
      />
      <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
        Picked: {{ comboSingle() || '(none)' }}
      </small>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Combobox mode — sizes" description="`size` is `sm`, `md` (default) or `lg`, on the trigger.">
    <ngwr-doc-code [code]="snippets.overlaySizes" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap">
        @for (s of sizes; track s) {
          <wr-tree openOn="overlay" [size]="s" [nodes]="folders" [placeholder]="s" [(value)]="comboSized" />
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Combobox mode — multi + chips"
    description="`maxTagCount` caps the chips shown before `+N more`. `defaultExpandAll` opens every parent on first open."
  >
    <ngwr-doc-code [code]="snippets.overlayMulti" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-tree
        openOn="overlay"
        [nodes]="folders"
        selectionMode="multi"
        [maxTagCount]="2"
        [defaultExpandAll]="true"
        placeholder="Pick folders"
        [(value)]="comboMulti"
      />
      <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
        Picked: {{ comboMulti().join(', ') || '(none)' }}
      </small>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Combobox mode — width"
    description="A trigger left to size itself is `12rem` wide. Change that with `--wr-tree-trigger-min-width`; a `min-width` on `.wr-tree__trigger` has no effect."
  />

  <ngwr-doc-section
    title="Virtual scroll"
    description="For a large tree, set `virtualScroll` and `viewportHeight`. `rowHeight` is measured when left at `0`."
  >
    <ngwr-doc-code [code]="snippets.virtual" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-tree
        ariaLabel="Generated folders"
        [nodes]="bigTree"
        [(expanded)]="bigExpanded"
        [(selected)]="bigPick"
        virtualScroll
        [viewportHeight]="320"
      />
      <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
        Picked: {{ bigPick().join(', ') || '(none)' }}
      </small>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Open from code"
    description="In combobox mode, `open()` and `close()` work through a template reference. `(opened)` and `(closed)` fire for every open and close. `open()` does nothing while disabled or read-only."
  >
    <ngwr-doc-code [code]="snippets.openFromCode" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Types">
    <ngwr-doc-api [rows]="typesApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
