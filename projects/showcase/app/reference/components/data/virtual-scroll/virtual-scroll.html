<ngwr-doc-page
  title="Virtual Scroll"
  description="A long list of same-height rows that renders only the rows on screen."
  [keywords]="['virtual-scroll', 'wr-virtual-scroll', 'cdk-virtual-scroll-viewport', 'list', 'performance']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="snippet()" [controls]="controls">
      <wr-virtual-scroll
        [items]="rows()"
        [itemSize]="itemSize()"
        [height]="height()"
        style="width: 100%; border: 1px solid var(--wr-border-base); border-radius: 0.5rem"
      >
        <ng-template let-row let-i="index">
          <div
            [style.height.px]="itemSize()"
            [style.line-height.px]="itemSize()"
            style="padding: 0 1rem; border-bottom: 1px solid var(--wr-border-base); font-variant-numeric: tabular-nums"
          >
            {{ i + 1 }}. {{ row.label }}
          </div>
        </ng-template>
      </wr-virtual-scroll>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
