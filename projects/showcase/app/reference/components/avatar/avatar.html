<ngwr-doc-page
  title="Avatar"
  description="Image avatar with a square, rounded, circle or squircle shape. Projected initials stand in while the image loads and when it fails."
  [keywords]="['avatar', 'profile', 'image', 'wr-avatar']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <wr-avatar [url]="sampleUrl" alt="Sample" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Sizes"
    description="Accepts a number (pixels), '48', '48px', or '3rem'. No percentages — avatars need a deterministic pixel size."
  >
    <ngwr-doc-snippet [code]="snippets.sizes">
      <wr-avatar [url]="sampleUrl" alt="" [size]="32" />
      <wr-avatar [url]="sampleUrl" alt="" size="4rem" />
      <wr-avatar [url]="sampleUrl" alt="" size="6rem" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Shape"
    description="`rounded` (default) is a soft rounded square, `square` keeps hard corners. `circle` replaces the old `[rounded]` boolean. `squircle` uses `corner-shape: squircle` where supported."
  >
    <ngwr-doc-snippet [code]="snippets.shape">
      <wr-avatar [url]="sampleUrl" alt="" size="4rem" shape="square" />
      <wr-avatar [url]="sampleUrl" alt="" size="4rem" shape="rounded" />
      <wr-avatar [url]="sampleUrl" alt="" size="4rem" shape="circle" />
      <wr-avatar [url]="sampleUrl" alt="" size="4rem" shape="squircle" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Initials fallback"
    description="With no `[url]`, projected content fills the box, centred by the avatar's own flex layout."
  >
    <ngwr-doc-snippet [code]="snippets.initials">
      <wr-avatar [size]="48" shape="circle">
        <span style="font-size: 0.875rem; font-weight: 600; color: var(--wr-color-on-surface-muted)">RK</span>
      </wr-avatar>
      <wr-avatar [size]="64" style="background: rgba(var(--wr-color-primary-rgb), 0.15)">
        <span style="font-size: 1.125rem; font-weight: 600; color: var(--wr-color-primary-ink)">AB</span>
      </wr-avatar>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Initials at every size"
    description="Projected initials take the text size around the avatar, capped at `--wr-avatar-initials-scale` of the box — `0.375` by default, where the widest capital pairs (`ЖШ`, `WW`) still clear a circle. Where the surrounding size already fits, nothing changes: beside 15px text a `6rem` avatar keeps 15px initials, and a 16px one draws them at 6px instead of spilling past its own edge. Anything projected that is sized in `em` follows the cap too, a `<wr-icon>` included — pin a `px` or `rem` size on it to opt out. The host publishes the resolved box as `--wr-avatar-size`. The letters are inert — a click on them lands on whatever holds the avatar, and a text selection skips them."
  >
    <ngwr-doc-snippet [code]="snippets.initialsScale">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; width: 100%">
        @for (size of scaleSizes; track size) {
          <wr-avatar
            shape="circle"
            [size]="size"
            style="background: var(--wr-color-primary-soft); color: var(--wr-color-primary-ink); font-weight: 600"
            >ХР</wr-avatar
          >
        }
        <wr-avatar
          shape="circle"
          size="6rem"
          style="background: var(--wr-color-primary-soft); color: var(--wr-color-primary-ink); font-weight: 600"
          >ХР</wr-avatar
        >
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; width: 100%">
        @for (person of people; track person.id) {
          <wr-avatar shape="circle" [size]="16" style="background: var(--wr-color-primary-soft)">{{
            person.initials
          }}</wr-avatar>
          <wr-avatar shape="circle" [size]="24" style="background: var(--wr-color-primary-soft)">{{
            person.initials
          }}</wr-avatar>
        }
      </div>
    </ngwr-doc-snippet>
    <ngwr-doc-code [code]="snippets.initialsScaleCss" language="scss" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Inside a chip and a tag"
    description="Where a small avatar usually lives: a 16px circle in a multi-select chip and 24px in its option rows, and a 16px one in a small tag beside a link. Each sits in different text — the chip's 14px, the tag's 12px — and each draws initials sized to its own box. A click on the letters reaches whatever holds the avatar: the chip and the field around it, or the tag."
  >
    <ngwr-doc-snippet [files]="smallFiles">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 28rem">
        <wr-select
          mode="multi"
          searchable
          virtualScroll
          placeholder="Nobody"
          ariaLabel="Assignees"
          [options]="peopleIds"
          [displayWith]="personName"
          [(value)]="assignees"
        >
          <ng-template wrOptionLeading let-personId let-placement="placement">
            <wr-avatar
              shape="circle"
              [size]="placement === 'chip' ? 16 : 24"
              [url]="personPhoto(personId)"
              [alt]="personName(personId)"
              >{{ personInitials(personId) }}</wr-avatar
            >
          </ng-template>
        </wr-select>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
          @for (id of assignees(); track id) {
            <wr-tag size="sm" color="medium">
              <span style="display: inline-flex; align-items: center; gap: 0.25rem">
                <wr-avatar shape="circle" [size]="16" [url]="personPhoto(id)" [alt]="personName(id)">{{
                  personInitials(id)
                }}</wr-avatar>
                <a href="#" (click)="$event.preventDefault()">{{ personName(id) }}</a>
              </span>
            </wr-tag>
          }
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Initials behind an image"
    description="Give an image and initials together and the initials are the fallback: they show while the image loads, then give way to it. With an `alt`, a screen reader hears the `alt` while an image is in play and the initials otherwise, never both. Without one the image is only named `Avatar`, so the initials stay announced beside it. They are projected into a `.wr-avatar__content` wrapper, and no spinner is drawn over them."
  >
    <ngwr-doc-snippet [code]="snippets.withImage">
      <wr-avatar
        [url]="localUrl"
        alt="Roman Khegay"
        [size]="64"
        shape="circle"
        style="background: var(--wr-color-primary-soft); color: var(--wr-color-primary-ink); font-weight: 600"
      >
        RK
      </wr-avatar>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Broken image"
    description="A `[url]` that fails to load drops the broken `<img>` and the spinner, and the initials stay — the one state where an avatar is guaranteed to have something worth showing. A new `[url]` is a new attempt."
  >
    <ngwr-doc-snippet [code]="snippets.broken">
      <wr-avatar
        [url]="brokenUrl"
        alt="Roman Khegay"
        [size]="64"
        shape="circle"
        style="background: var(--wr-color-primary-soft); color: var(--wr-color-primary-ink); font-weight: 600"
      >
        RK
      </wr-avatar>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
