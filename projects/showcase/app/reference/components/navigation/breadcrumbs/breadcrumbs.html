<ngwr-doc-page
  title="Breadcrumbs"
  updated="15.3.0"
  description="Shows where the current page sits in the site."
  [keywords]="['breadcrumbs', 'wr-breadcrumbs', 'navigation', 'a11y']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Playground" description="An item with no `routerLink` or `href` is the current page.">
    <ngwr-doc-playground [code]="snippet()" [controls]="controls">
      <wr-breadcrumbs [separator]="separator()" [ariaLabel]="ariaLabel()">
        <wr-breadcrumbs-item icon="home" routerLink="/">Home</wr-breadcrumbs-item>
        <wr-breadcrumbs-item icon="folder" routerLink="/reference/components">Components</wr-breadcrumbs-item>
        <wr-breadcrumbs-item routerLink="/reference/components/breadcrumbs">Breadcrumbs</wr-breadcrumbs-item>
        <wr-breadcrumbs-item>Current page</wr-breadcrumbs-item>
      </wr-breadcrumbs>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Query parameters"
    description="`[queryParams]` adds them to a `routerLink` crumb. A `?` written into `routerLink` is escaped as part of the path."
  >
    <ngwr-doc-code [code]="querySnippet" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
