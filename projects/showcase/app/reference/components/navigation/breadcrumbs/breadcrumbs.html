<ngwr-doc-page
  title="Breadcrumbs"
  description='Navigation trail showing the user&apos;s location in the site hierarchy. `<wr-breadcrumbs-item>` IS the row — the host carries `role="listitem"` rather than wrapping an `<li>` — and holds an `<a class="wr-breadcrumbs__link">` when linked, or an `<a class="wr-breadcrumbs__current" aria-current="page" role="text" tabindex="-1">` for the page you are on. Separator is a CSS pseudo-element so it doesn&apos;t pollute the accessibility tree. Each item accepts an optional leading icon.'
  [keywords]="['breadcrumbs', 'wr-breadcrumbs', 'navigation', 'a11y']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Playground">
    <ngwr-doc-playground [code]="snippet()" [controls]="controls">
      <wr-breadcrumbs [separator]="separator()" [ariaLabel]="ariaLabel()">
        <wr-breadcrumbs-item icon="home" routerLink="/">Home</wr-breadcrumbs-item>
        <wr-breadcrumbs-item icon="folder" routerLink="/reference/components">Components</wr-breadcrumbs-item>
        <wr-breadcrumbs-item routerLink="/reference/components/breadcrumbs">Breadcrumbs</wr-breadcrumbs-item>
        <wr-breadcrumbs-item>Current page</wr-breadcrumbs-item>
      </wr-breadcrumbs>
    </ngwr-doc-playground>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
