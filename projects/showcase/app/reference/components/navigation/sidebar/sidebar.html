<ngwr-doc-page
  title="Sidebar"
  description="Navigation drawn from data: links and expandable groups."
  [keywords]="['sidebar', 'navigation', 'nav', 'wr-sidebar']"
  [labels]="['Component']"
>
  <ngwr-doc-section
    title="Basic usage"
    description="Pass `[entries]`: links and groups. The group holding the active route opens."
  >
    <ngwr-doc-snippet [code]="snippets.template">
      <div class="demo-sidebar">
        <wr-sidebar [entries]="entries" />
      </div>
    </ngwr-doc-snippet>
    <p>
      To drop the inner padding, set <code>--wr-sidebar-padding: 0</code> on <code>.wr-sidebar</code>, not on its
      container.
    </p>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Which route counts as active"
    description="Entries match by URL prefix, so give `['/']` `activeOptions: { exact: true }`, or it is active, and not clickable, on every page."
  >
    <ngwr-doc-code [code]="snippets.activeOptions" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
