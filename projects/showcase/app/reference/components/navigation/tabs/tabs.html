<ngwr-doc-page
  title="Tabs"
  description="Switch between panels, or between routes."
  updated="16.10.0"
  [keywords]="['tabs', 'wr-tabs', 'wr-tab']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Content tabs" description="Bind `[(active)]` to a tab `key`.">
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%">
        <wr-tabs [(active)]="active">
          <wr-tab key="overview" title="Overview">
            <p style="margin: 0; color: var(--wr-color-on-surface-muted)">Overview content — short and friendly.</p>
          </wr-tab>
          <wr-tab key="details" title="Details">
            <p style="margin: 0; color: var(--wr-color-on-surface-muted)">Detail-heavy content here.</p>
          </wr-tab>
          <wr-tab key="logs" title="Logs">
            <pre style="margin: 0; color: var(--wr-color-on-surface-muted); font-family: var(--wr-font-family-mono)">
2026-05-21 12:00:00 boot ok
2026-05-21 12:00:01 ready</pre>
          </wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Keep panels mounted"
    description="`keepMounted` renders each panel on its first visit and keeps it, hidden, so typed text and scroll position survive a switch. Content tabs only."
  >
    <ngwr-doc-snippet [code]="snippets.keepMounted">
      <div style="width: 100%">
        <wr-tabs keepMounted>
          <wr-tab key="draft" title="Draft"><input wrInput placeholder="Type, switch, come back" /></wr-tab>
          <wr-tab key="other" title="Other">Other</wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Router tabs"
    description="Give tabs a `routerLink` and add `wrTabsRouting` from `ngwr/tabs/router`, or the strip throws. Put a `<router-outlet>` below."
  >
    <ngwr-doc-code [code]="snippets.router" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Exact router tabs"
    description="A router tab is selected on its path and every path below it. Add `exact` so an overview tab stays unselected on a child route. Query params and fragment still match as before."
  >
    <ngwr-doc-code [code]="snippets.exact" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Count"
    description='`count` adds a small badge after the label, for unread items or results. It is part of the accessible name, "Inbox, 3". `null` hides it; `0` shows `0`.'
  >
    <ngwr-doc-snippet [code]="snippets.count">
      <div style="width: 100%">
        <wr-tabs>
          <wr-tab key="inbox" title="Inbox" [count]="3">Inbox</wr-tab>
          <wr-tab key="drafts" title="Drafts" [count]="12">Drafts</wr-tab>
          <wr-tab key="sent" title="Sent">Sent</wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Icon"
    description="`icon` draws a registered icon before the label, in content and router tabs. It is decorative: the label stays the name."
  >
    <ngwr-doc-snippet [code]="snippets.icon">
      <div style="width: 100%">
        <wr-tabs>
          <wr-tab key="profile" title="Profile" icon="user">Profile</wr-tab>
          <wr-tab key="alerts" title="Alerts" icon="bell" [count]="2">Alerts</wr-tab>
          <wr-tab key="security" title="Security" icon="shield">Security</wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Vertical"
    description='`orientation="vertical"` puts the strip at the inline start with the panel beside it. Up and Down move between tabs. `--wr-tabs-strip-width` sizes the strip.'
  >
    <ngwr-doc-snippet [code]="snippets.vertical">
      <div style="width: 100%">
        <wr-tabs orientation="vertical">
          <wr-tab key="profile" title="Profile" icon="user">Profile settings</wr-tab>
          <wr-tab key="alerts" title="Alerts" icon="bell">Alert settings</wr-tab>
          <wr-tab key="security" title="Security" icon="shield">Security settings</wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Disabled tab">
    <ngwr-doc-snippet [code]="snippets.disabled">
      <div style="width: 100%">
        <wr-tabs>
          <wr-tab key="active" title="Active">Active</wr-tab>
          <wr-tab key="wip" title="WIP" disabled>—</wr-tab>
        </wr-tabs>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Router adapter — template reference"
    description='`#routing="wrTabsRouting"` gives the template the adapter, for example `href()`.'
  >
    <ngwr-doc-code [code]="snippets.exportAs" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Tabs API">
    <ngwr-doc-api [rows]="tabsApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Tab API">
    <ngwr-doc-api [rows]="tabApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
