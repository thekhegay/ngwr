<ngwr-doc-page
  title="Button"
  description="Trigger an action. Renders as <wr-btn>, button[wr-btn], or a[wr-btn]."
  [keywords]="['button', 'wr-btn']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section
    title="Basic usage"
    description="The same selector matches a custom element, a native button, and an anchor."
  >
    <ngwr-doc-snippet [code]="snippets.basic">
      <wr-btn>Default</wr-btn>
      <button type="button" wr-btn>Native button</button>
      <a wr-btn>Anchor</a>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Inside a form"
    description="Use the native form for submit and reset: `<button wr-btn type=submit>`. The `<wr-btn>` element is a custom element, which no browser submits a form for, so it takes no `type` — bind the click instead."
  >
    <ngwr-doc-code [code]="snippets.submit" language="html" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Colors"
    description="Five intents, plus the default you get by setting no `color` at all. An intent ranks a button against the ones beside it — the label says what it does, so write `Delete`, not a red `OK`."
  >
    <ngwr-doc-snippet [code]="snippets.colors">
      <wr-btn>default</wr-btn>
      @for (c of colors; track c) {
        <wr-btn [color]="c">{{ c }}</wr-btn>
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Outlined" description="Transparent fill with a coloured label and border.">
    <ngwr-doc-snippet [code]="snippets.outlined">
      <wr-btn outlined>default</wr-btn>
      @for (c of colors; track c) {
        <wr-btn [color]="c" outlined>{{ c }}</wr-btn>
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Sizes">
    <ngwr-doc-snippet [code]="snippets.sizes">
      <wr-btn size="sm" color="primary">Small</wr-btn>
      <wr-btn size="md" color="primary">Medium</wr-btn>
      <wr-btn size="lg" color="primary">Large</wr-btn>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Shape"
    description="`rounded` (default), `pill` or `squircle`. Where the browser has no `corner-shape`, a squircle falls back to a plain rounded corner."
  >
    <ngwr-doc-snippet [code]="snippets.shape">
      <div class="ngwr-shape-grid">
        @for (s of shapes; track s) {
          <span wrTypography variant="overline" tone="muted">{{ s }}</span>
          <div class="ngwr-shape-grid__row">
            <wr-btn color="primary" [shape]="s">Primary</wr-btn>
            <wr-btn color="primary" outlined [shape]="s">Outlined</wr-btn>
            <wr-btn [shape]="s">Default</wr-btn>
          </div>
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="With icon"
    description="Pass any icon registered via provideWrIcons. iconPosition switches between start/end."
  >
    <ngwr-doc-snippet [code]="snippets.icon">
      <wr-btn icon="add" color="primary">Add</wr-btn>
      <wr-btn icon="checkmark" color="success">Confirm</wr-btn>
      <wr-btn icon="trash" color="danger" outlined>Delete</wr-btn>
      <wr-btn icon="download" iconPosition="end">Download</wr-btn>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Disabled">
    <ngwr-doc-snippet [code]="snippets.disabled">
      <wr-btn disabled>Disabled</wr-btn>
      <wr-btn color="primary" disabled>Disabled</wr-btn>
      <wr-btn color="danger" outlined disabled>Disabled</wr-btn>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Loading"
    description="The spinner overlays the label so layout stays put. By default pointer events are blocked while loading."
  >
    <ngwr-doc-snippet [code]="snippets.loading">
      <wr-btn [loading]="loading()" color="primary" (click)="loading.set(!loading())">Click to toggle</wr-btn>
      <wr-btn loading color="success">Saving</wr-btn>
      <wr-btn loading icon="add" outlined>With icon</wr-btn>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Block" description="Fills the parent's width.">
    <ngwr-doc-snippet [code]="snippets.block">
      <div style="width: 100%">
        <wr-btn color="primary" block icon="checkmark">Full width</wr-btn>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
