<ngwr-doc-page
  title="Bar Chart"
  description="Vertical bars, one series. Per-bar color overrides via the `color` field."
  [keywords]="['bar-chart', 'wr-bar-chart']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="width: 100%">
        <wr-bar-chart [data]="bars" style="width: 100%" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>
  <ngwr-doc-section
    title="Tooltip"
    description="Hover a bar for its label and value, in a tooltip pointing at the top of that bar. Pointer only: each bar's accessible name already carries both. Set `[tooltip]` to `false` to turn it off."
  >
    <ngwr-doc-code [code]="snippets.tooltip" language="angular-html" />
  </ngwr-doc-section>
  <ngwr-doc-section title="API" description="Inputs of &lt;wr-bar-chart&gt;.">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
  <ngwr-doc-section title="Types" description="Data shapes used by the inputs and outputs above.">
    <ngwr-doc-code [code]="typeSnippet" language="angular-ts" />
    <ngwr-doc-api [rows]="typeRows" />
  </ngwr-doc-section>
</ngwr-doc-page>
