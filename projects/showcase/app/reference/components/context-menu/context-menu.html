<ngwr-doc-page
  title="Context Menu"
  description="Attach `[wrContextMenu]` to any element to open a `<wr-context-menu>` at the pointer position on right-click. Native browser menu is suppressed on the host."
  [keywords]="['context menu', 'right click', 'menu', 'submenu', 'wr-context-menu']"
  [labels]="['Overlay']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic" description="Right-click the area below.">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div [wrContextMenu]="basicMenu" class="ngwr-cm-demo">Right-click here</div>

      <wr-context-menu #basicMenu>
        <wr-context-menu-item icon="copy" (click)="pick('copy')">Copy</wr-context-menu-item>
        <wr-context-menu-item icon="document" (click)="pick('paste')">Paste</wr-context-menu-item>
        <wr-context-menu-item icon="trash" (click)="pick('delete')">Delete</wr-context-menu-item>
      </wr-context-menu>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Dividers"
    description="Drop `<wr-context-menu-divider />` between items to visually group related actions. Useful for separating destructive actions from the rest."
  >
    <ngwr-doc-code [code]="snippets.divider" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div [wrContextMenu]="dividerMenu" class="ngwr-cm-demo">Right-click for grouped actions</div>

      <wr-context-menu #dividerMenu>
        <wr-context-menu-item icon="copy" (click)="pick('copy')">Copy</wr-context-menu-item>
        <wr-context-menu-item icon="document" (click)="pick('paste')">Paste</wr-context-menu-item>
        <wr-context-menu-item icon="cog" (click)="pick('settings')">Settings</wr-context-menu-item>
        <wr-context-menu-divider />
        <wr-context-menu-item icon="trash" (click)="pick('delete')">Delete</wr-context-menu-item>
      </wr-context-menu>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Submenus"
    description="Pass another `<wr-context-menu>` to `[submenu]` to nest a submenu off any item. Hover to open, or press the arrow the menu cascades toward — → in LTR, ← under RTL, since the panes mirror with the reading direction and a fixed key would ask an RTL reader to press toward the parent. The opposite arrow, or a click outside, closes it. Submenus can themselves contain submenus — the API is recursive."
  >
    <ngwr-doc-code [code]="snippets.submenu" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div [wrContextMenu]="rootMenu" class="ngwr-cm-demo">Right-click for nested options</div>

      <wr-context-menu #rootMenu>
        <wr-context-menu-item icon="copy" (click)="pick('copy')">Copy</wr-context-menu-item>
        <wr-context-menu-item icon="document" (click)="pick('paste')">Paste</wr-context-menu-item>
        <wr-context-menu-divider />
        <wr-context-menu-item icon="cog" [submenu]="moreMenu">Share</wr-context-menu-item>
        <wr-context-menu-divider />
        <wr-context-menu-item icon="trash" (click)="pick('delete')">Delete</wr-context-menu-item>
      </wr-context-menu>

      <wr-context-menu #moreMenu>
        <wr-context-menu-item (click)="pick('share-link')">Copy link</wr-context-menu-item>
        <wr-context-menu-item (click)="pick('share-email')">Email…</wr-context-menu-item>
        <wr-context-menu-divider />
        <wr-context-menu-item [submenu]="exportMenu">Export as…</wr-context-menu-item>
      </wr-context-menu>

      <wr-context-menu #exportMenu>
        <wr-context-menu-item (click)="pick('export-pdf')">PDF</wr-context-menu-item>
        <wr-context-menu-item (click)="pick('export-png')">PNG</wr-context-menu-item>
        <wr-context-menu-item (click)="pick('export-svg')">SVG</wr-context-menu-item>
      </wr-context-menu>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Custom templates"
    description="`<wr-context-menu>` projects any content between its tags — drop in arbitrary markup alongside items for headers, descriptions, keyboard hints, or fully bespoke rows."
  >
    <ngwr-doc-code [code]="snippets.custom" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div [wrContextMenu]="customMenu" class="ngwr-cm-demo">Right-click for a richer menu</div>

      <wr-context-menu #customMenu>
        <div class="ngwr-cm-header">
          <span class="ngwr-cm-header__title">readme.md</span>
          <span class="ngwr-cm-header__sub">2 KB · modified just now</span>
        </div>
        <wr-context-menu-divider />
        <wr-context-menu-item icon="copy" (click)="pick('copy')">
          Copy
          <span class="ngwr-cm-kbd">⌘C</span>
        </wr-context-menu-item>
        <wr-context-menu-item icon="document" (click)="pick('paste')">
          Paste
          <span class="ngwr-cm-kbd">⌘V</span>
        </wr-context-menu-item>
        <wr-context-menu-divider />
        <wr-context-menu-item icon="trash" (click)="pick('delete')">
          Delete
          <span class="ngwr-cm-kbd">⌫</span>
        </wr-context-menu-item>
      </wr-context-menu>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Template reference"
    description="Two names, deliberately: the panel is `wrContextMenu` — that is what `<wr-context-menu #menu>` hands to the trigger — and the TRIGGER directive is `wrContextMenuTrigger`."
  >
    <ngwr-doc-code [code]="snippets.exportAs" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Directive API">
    <ngwr-doc-api [rows]="directiveApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Item API">
    <ngwr-doc-api [rows]="itemApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
