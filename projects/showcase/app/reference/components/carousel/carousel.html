<ngwr-doc-page
  title="Carousel"
  description="Slide carousel with prev/next, dots, and optional autoplay. Autoplay holds while the pointer is over it, while focus is inside it, and while a drag is in flight — hovering is not a way to stop moving content for someone who never uses a mouse, which is what WCAG 2.2.2 asks for."
  [keywords]="['carousel', 'slider', 'wr-carousel']"
>
  <ngwr-doc-section title="Basic">
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-carousel
        [(active)]="idx"
        autoplay
        style="width: 100%; aspect-ratio: 16 / 9; border-radius: 0.5rem; overflow: hidden"
      >
        @for (slide of slides; track $index) {
          <wr-carousel-slide>
            <div
              [style.background]="slide.fill"
              [style.color]="slide.ink"
              style="
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                font-weight: 600;
              "
            >
              Slide {{ $index + 1 }}
            </div>
          </wr-carousel-slide>
        }
      </wr-carousel>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
