<ngwr-doc-page
  title="Alert"
  updated="15.6.0"
  description="An inline status message."
  [keywords]="['alert', 'banner', 'wr-alert']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%">
        <wr-alert title="Heads up" message="Your trial ends in 3 days." />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Types">
    <ngwr-doc-snippet [code]="snippets.types">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%">
        @for (t of types; track t) {
          <wr-alert [title]="t" message="Sample message" [type]="t" />
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="With title" description="Pair a `title` with a secondary `message`.">
    <ngwr-doc-snippet [code]="snippets.withTitle">
      <div style="width: 100%">
        <wr-alert title="Update available" message="Version 2.0 is ready to install." type="info" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Without title" description="Without a `title`, the `message` is the only line.">
    <ngwr-doc-snippet [code]="snippets.noTitle">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%">
        <wr-alert message="Your changes are live." type="success" />
        <wr-alert message="Connection lost." type="offline" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Content" description="Content you put inside renders below the `message`.">
    <ngwr-doc-snippet [code]="snippets.content">
      <div style="width: 100%">
        <wr-alert title="Sync failed" type="danger"
          >Request <code>8f2c41</code> timed out. Try again in a minute.</wr-alert
        >
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Actions"
    description="Put buttons in `[wrAlertActions]`. They sit under the message and wrap on a narrow screen."
  >
    <ngwr-doc-snippet [code]="snippets.actions">
      <div style="width: 100%">
        <wr-alert title="Update available" message="Version 2.0 is ready to install." type="info" closable>
          <wr-btn wrAlertActions size="sm" color="primary">Install</wr-btn>
          <wr-btn wrAlertActions size="sm" outlined>Later</wr-btn>
        </wr-alert>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Custom icon" description="`iconName` replaces the icon of the `type`.">
    <ngwr-doc-snippet [code]="snippets.customIcon">
      <div style="width: 100%">
        <wr-alert iconName="sparkles" title="What's new" message="Smarter search just landed." />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Closable"
    description="`closable` adds a close button; `(closed)` fires when it hides the alert."
  >
    <ngwr-doc-snippet [code]="snippets.closable">
      <div style="width: 100%">
        <wr-alert title="Saved" message="Your changes are live." type="success" closable />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Without icon" description='`[icon]="false"` hides the icon.'>
    <ngwr-doc-snippet [code]="snippets.noIcon">
      <div style="width: 100%">
        <wr-alert title="Plain" message="No leading icon." [icon]="false" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
