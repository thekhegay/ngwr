<ngwr-doc-page
  title="Result"
  description="A full-size outcome screen, with ready-made 404, 403 and 500 pages."
  [keywords]="['result', 'empty', '404', '403', '500', 'wr-result']"
>
  <ngwr-doc-section
    title="Statuses"
    description="`status` is `success`, `warning`, `error`, `info` (default) or `empty`."
  >
    <ngwr-doc-code [code]="statuses" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div class="result-grid">
        <wr-result status="success" title="Submitted" />
        <wr-result status="warning" title="Heads up" />
        <wr-result status="error" title="Failed" />
        <wr-result status="info" title="In review" />
        <wr-result status="empty" title="No projects" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="With an action"
    description="Mark a projected button with `wrResultExtra` to offer the next step."
  >
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-result status="success" title="Submitted!" description="We'll be in touch.">
        <button type="button" wr-btn color="primary" wrResultExtra>Continue</button>
      </wr-result>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Presets"
    description="`<wr-result-404>`, `<wr-result-403>` and `<wr-result-500>` take `title` and `description` to replace their text."
  >
    <ngwr-doc-code [code]="presets" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div class="result-grid">
        <wr-result-404 />
        <wr-result-403 />
        <wr-result-500 />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
