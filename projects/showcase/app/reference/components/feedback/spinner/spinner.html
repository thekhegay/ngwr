<ngwr-doc-page
  title="Spinner"
  description="An inline loading indicator."
  [keywords]="['spinner', 'loading', 'wr-spinner']"
  [labels]="['Component']"
  updated="16.10.0"
>
  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <wr-spinner />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Sizes" description="Sizes are in `em`, so the spinner scales with the text.">
    <ngwr-doc-snippet [code]="snippets.sizes">
      <wr-spinner size="sm" />
      <wr-spinner size="md" />
      <wr-spinner size="lg" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Color" description="The spinner takes the text colour: set `color` on the parent.">
    <ngwr-doc-snippet [code]="snippets.color">
      <div style="color: var(--wr-color-primary)"><wr-spinner /></div>
      <div style="color: var(--wr-color-success)"><wr-spinner /></div>
      <div style="color: var(--wr-color-danger)"><wr-spinner /></div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Busy container"
    description="`[wrBusy]` lays a veil with a spinner over its host. The host gets `aria-busy`, its content turns `inert`. `wrBusyLabel` is announced when it starts."
  >
    <ngwr-doc-snippet [code]="snippets.busy">
      <form
        style="display: flex; gap: 0.75rem; padding: 1rem; max-width: 24rem"
        [wrBusy]="busy()"
        wrBusyLabel="Saving"
        (submit)="$event.preventDefault()"
      >
        <input wrInput placeholder="Name" aria-label="Name" />
        <wr-btn (click)="save()">Save</wr-btn>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Spinner API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Busy API">
    <ngwr-doc-api [rows]="busyApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
