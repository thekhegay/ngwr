<ngwr-doc-page
  title="Skeleton"
  updated="15.6.0"
  description="A placeholder block shown while content loads."
  [keywords]="['skeleton', 'loading', 'placeholder', 'wr-skeleton']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Basic usage" description="A skeleton is one line high by default.">
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 0.5rem">
        <wr-skeleton />
        <wr-skeleton />
        <wr-skeleton />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Colors">
    <ngwr-doc-snippet [code]="snippets.colors">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 0.5rem">
        @for (c of colors; track c) {
          <wr-skeleton [color]="c" />
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Custom shape"
    description="Set `--wr-skeleton-height` and `--wr-skeleton-radius` for avatars and cards."
  >
    <ngwr-doc-snippet [code]="snippets.custom">
      <div style="width: 100%; display: flex; gap: 0.75rem; align-items: center">
        <wr-skeleton style="--wr-skeleton-height: 3rem; --wr-skeleton-radius: 50%; width: 3rem; flex: 0 0 3rem" />
        <wr-skeleton style="--wr-skeleton-height: 4rem; --wr-skeleton-radius: 1rem" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Lines"
    description="`lines` draws a paragraph: that many lines, the last one shorter. `--wr-skeleton-line-gap` and `--wr-skeleton-last-line-width` tune it."
  >
    <ngwr-doc-snippet [code]="snippets.lines">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 1.5rem">
        <wr-skeleton [lines]="3" />
        <wr-skeleton [lines]="2" color="primary" style="--wr-skeleton-last-line-width: 40%" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Static" description='`[animated]="false"` stops the shimmer.'>
    <ngwr-doc-snippet [code]="snippets.static">
      <div style="width: 100%"><wr-skeleton [animated]="false" /></div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
