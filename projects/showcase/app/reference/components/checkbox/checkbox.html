<ngwr-doc-page
  title="Checkbox"
  description="Two-state checkbox. Standalone (boolean) or inside <wr-checkbox-group> (array of values)."
  [keywords]="['checkbox', 'wr-checkbox', 'wr-checkbox-group']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Standalone"
    description="Signal-forms native — bind the boolean `checked` model via `[(checked)]`, `[formField]`, or classic `[(ngModel)]`."
  >
    <ngwr-doc-snippet [code]="snippets.standalone">
      <wr-checkbox [(checked)]="agree">I agree to the terms</wr-checkbox>
      <span style="color: var(--wr-color-on-surface-muted); font-size: 0.875rem">Value: {{ agree() }}</span>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Inside a group"
    description="The group manages an array of values. Each child contributes its value when checked."
  >
    <ngwr-doc-snippet [code]="snippets.group">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; width: 100%">
        <wr-checkbox-group [(value)]="features">
          <wr-checkbox checkboxValue="autosave">Autosave</wr-checkbox>
          <wr-checkbox checkboxValue="notifications">Notifications</wr-checkbox>
          <wr-checkbox checkboxValue="darkmode">Dark mode</wr-checkbox>
        </wr-checkbox-group>
        <span style="color: var(--wr-color-on-surface-muted); font-size: 0.875rem"
          >Value: [{{ features().join(', ') }}]</span
        >
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Indeterminate"
    description="A parent `[indeterminate]` shows the mixed state (a dash) when only some children are checked — the classic 'select all'. It's visual and controlled: you set it, and clear it on the next toggle."
  >
    <ngwr-doc-snippet [code]="snippets.indeterminate">
      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <wr-checkbox [checked]="allChecked()" (checkedChange)="toggleAll()" [indeterminate]="someChecked()">
          Select all
        </wr-checkbox>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; padding-inline-start: 1.5rem">
          @for (p of permItems; track p) {
            <wr-checkbox [checked]="perms().includes(p)" (checkedChange)="togglePerm(p)">{{ p }}</wr-checkbox>
          }
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Disabled">
    <ngwr-doc-snippet [code]="snippets.disabled">
      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <wr-checkbox [disabled]="true">Disabled</wr-checkbox>
        <wr-checkbox [disabled]="true" [(checked)]="agree">Disabled (checked)</wr-checkbox>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Checkbox API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Checkbox Group API">
    <ngwr-doc-api [rows]="groupApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
