<ngwr-doc-page
  title="Empty"
  description="Empty-state placeholder for when the underlying data is missing. Project a description and an optional `[wrEmptyActions]` row."
  [keywords]="['empty', 'placeholder', 'no data', 'wr-empty']"
  [labels]="['Display']"
>
  <ngwr-doc-section title="Default">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-empty />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="With description and action">
    <ngwr-doc-code [code]="snippets.custom" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-empty iconName="search" title="No results">
        Try a different query or clear filters.
        <ng-container wrEmptyActions>
          <wr-btn>Reset filters</wr-btn>
        </ng-container>
      </wr-empty>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Without the illustration"
    description="Binding `icon` to false drops the artwork entirely — for a placeholder inside a card, a table body or anywhere the surrounding frame already says what is empty. It is a separate input from `iconName`, which only swaps WHICH icon is drawn."
  >
    <ngwr-doc-code [code]="snippets.noIcon" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-empty [icon]="false" title="No results">Try a different query.</wr-empty>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
