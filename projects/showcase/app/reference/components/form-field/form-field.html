<ngwr-doc-page
  title="Form Field"
  description="The default wrapper for a form control: label + control + hint + validation errors. It reads the projected control's `NgControl`, so it decides for itself when to show an error (touched or dirty) and which message to show. `<wr-form-item>` is the bare alternative — layout only, no knowledge of the control — and has its own page."
  [keywords]="['form field', 'label', 'hint', 'error', 'wr-form-field']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Basic usage"
    description="Each `<wr-form-error>` is gated on the matching validator key. Errors appear once the control is touched or dirty — submit to see them all at once."
  >
    <ngwr-doc-snippet [code]="snippets.basic">
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        style="display: flex; flex-direction: column; gap: 1rem; max-width: 24rem"
      >
        <wr-form-field label="Email" hint="We'll never share it." required>
          <input wrInput formControlName="email" type="email" placeholder="ada@example.com" />
          <wr-form-error key="required">Email is required.</wr-form-error>
          <wr-form-error key="email">That isn't a valid email.</wr-form-error>
        </wr-form-field>

        <wr-form-field label="Display name" required>
          <input wrInput formControlName="name" placeholder="Ada Lovelace" />
          <wr-form-error key="required">Display name is required.</wr-form-error>
        </wr-form-field>

        <button wr-btn type="submit" color="primary" style="align-self: flex-start">Submit</button>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Messages without markup"
    description="With no `<wr-form-error>` projected, the field renders the message the validator reports — resolved from the `ngwr/i18n` `validation.*` catalog, so it is already localized. Submit to see it."
  >
    <ngwr-doc-snippet [code]="snippets.auto">
      <form
        [formGroup]="autoForm"
        (ngSubmit)="submitAuto()"
        style="display: flex; flex-direction: column; gap: 1rem; max-width: 24rem"
      >
        <wr-form-field label="Handle" required>
          <input wrInput formControlName="handle" placeholder="ada" />
        </wr-form-field>

        <wr-form-field label="Age">
          <input wrInput formControlName="age" type="number" placeholder="18" />
        </wr-form-field>

        <button wr-btn type="submit" color="primary" style="align-self: flex-start">Submit</button>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="App-wide overrides"
    description="`provideWrFormErrors()` replaces only the keys you name. A projected `<wr-form-error key>` still wins over it — per-field copy beats app-wide copy."
  >
    <ngwr-doc-code [code]="snippets.provider" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Optional marker" description="Use `optional` for the inverse — fields users can skip.">
    <ngwr-doc-snippet [code]="snippets.optional">
      <form [formGroup]="form" style="max-width: 24rem">
        <wr-form-field label="Bio" optional hint="Up to 140 characters.">
          <input wrInput formControlName="bio" placeholder="A short tagline" />
        </wr-form-field>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Behavior notes">
    <ngwr-doc-code [code]="snippets.notes" language="html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
