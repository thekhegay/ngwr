<ngwr-doc-page
  title="Carousel"
  description="Slides with previous and next buttons, dots and optional autoplay."
  [keywords]="['carousel', 'slider', 'wr-carousel']"
>
  <ngwr-doc-section
    title="Basic"
    description="Give the carousel a height: the slides fill it. Autoplay pauses on hover and focus, and does not run while the reader prefers reduced motion."
  >
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-carousel
        [(active)]="idx"
        autoplay
        style="width: 100%; aspect-ratio: 16 / 9; border-radius: 0.5rem; overflow: hidden"
      >
        @for (slide of slides; track $index) {
          <wr-carousel-slide>
            <div
              [style.background]="slide.fill"
              [style.color]="slide.ink"
              style="
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                font-weight: 600;
              "
            >
              Slide {{ $index + 1 }}
            </div>
          </wr-carousel-slide>
        }
      </wr-carousel>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="<wr-carousel-slide>">
    <ngwr-doc-api [rows]="slideApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
