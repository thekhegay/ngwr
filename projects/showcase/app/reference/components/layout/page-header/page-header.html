<ngwr-doc-page
  title="Page Header"
  description="Top-of-page heading block with three projected slots — breadcrumbs, actions, extra (tags / metadata)."
  [keywords]="['page-header', 'wr-page-header']"
  [labels]="['Composite']"
>
  <ngwr-doc-section title="Basic">
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-page-header title="Settings" subtitle="Manage your workspace">
        <div wrPageHeaderActions>
          <wr-btn>Invite</wr-btn>
          <wr-btn color="primary">Save</wr-btn>
        </div>
      </wr-page-header>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Narrow container (container query)"
    description="With `responsive`, the title + actions row stacks vertically when the header's own box is too narrow — a container query on its own width, not the viewport, so it adapts inside a split pane or sidebar even on a wide page. The box below is fixed at 380px."
  >
    <ngwr-doc-snippet code='<div style="width: 380px"><wr-page-header responsive …>…</wr-page-header></div>'>
      <div style="width: 380px; max-width: 100%">
        <wr-page-header responsive title="Settings" subtitle="Manage your workspace">
          <div wrPageHeaderActions>
            <wr-btn>Invite</wr-btn>
            <wr-btn color="primary">Save</wr-btn>
          </div>
        </wr-page-header>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="All three slots"
    description="`[wrPageHeaderBreadcrumbs]` is the row above the title, `[wrPageHeaderActions]` the right-hand side, and `[wrPageHeaderExtra]` the row of tags or metadata below. They are projection SELECTORS rather than directives, so nothing extra goes in `imports` — put the attribute on whatever element the slot should hold. The actions slot lays out a bare `<div>` for you; the extra row leaves a wrapper alone, which is why the tags below are projected through an `<ng-container>`."
  >
    <ngwr-doc-code [code]="allSlots" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-page-header title="Billing" subtitle="Plan, invoices and payment method">
        <wr-breadcrumbs wrPageHeaderBreadcrumbs>
          <wr-breadcrumbs-item>Workspace</wr-breadcrumbs-item>
          <wr-breadcrumbs-item>Settings</wr-breadcrumbs-item>
          <wr-breadcrumbs-item>Billing</wr-breadcrumbs-item>
        </wr-breadcrumbs>

        <div wrPageHeaderActions>
          <wr-btn outlined>Download invoices</wr-btn>
          <wr-btn color="primary">Change plan</wr-btn>
        </div>

        <ng-container wrPageHeaderExtra>
          <wr-tag color="success">Active</wr-tag>
          <wr-tag>Pro</wr-tag>
          <wr-tag outlined>Renews 1 Nov</wr-tag>
        </ng-container>
      </wr-page-header>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
