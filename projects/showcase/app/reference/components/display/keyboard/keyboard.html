<ngwr-doc-page
  title="Keyboard"
  description="A keycap for showing a keyboard shortcut."
  [keywords]="['kbd', 'keyboard', 'keycap', 'shortcut', 'wr-kbd']"
  [labels]="['Display']"
>
  <ngwr-doc-section title="Basic" description="Put a plain `+` between caps for a chord.">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <p>Open the command palette: <wr-kbd>⌘</wr-kbd> + <wr-kbd>K</wr-kbd></p>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Sizes">
    <ngwr-doc-code [code]="snippets.sizes" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; align-items: center; gap: 0.5rem">
        <wr-kbd size="sm">Esc</wr-kbd>
        <wr-kbd size="md">Enter</wr-kbd>
        <wr-kbd size="lg">⌫</wr-kbd>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Full keyboard"
    description="Lay caps out with flex or grid, and set the width of wide keys yourself."
  >
    <ngwr-doc-code [code]="snippets.layout" language="angular-html" />
    <ngwr-doc-snippet code="">
      <!-- Fixed-width rows: the panel scrolls, not the page. -->
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 0.375rem;
          padding: 1rem;
          overflow-x: auto;
          background: var(--wr-color-fill);
          border: 1px solid var(--wr-border-base);
          border-radius: 0.625rem;
        "
      >
        @for (row of rows; track $index) {
          <div style="display: flex; gap: 0.25rem">
            @for (key of row; track $index) {
              <wr-kbd
                size="md"
                [style.flex]="key.w ? `0 0 ${key.w * 1.75}rem` : '0 0 1.75rem'"
                [style.minWidth]="key.w ? `${key.w * 1.75}rem` : '1.75rem'"
              >
                {{ key.cap }}
              </wr-kbd>
            }
          </div>
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Inside prose"
    description="A cap does not take the size of the text around it: use `md` in body copy and `sm` in small text."
  >
    <ngwr-doc-code [code]="snippets.prose" language="angular-html" />
    <ngwr-doc-snippet code="">
      <p wrTypography style="max-width: 32rem">
        Press <wr-kbd>⌘</wr-kbd> + <wr-kbd>P</wr-kbd> to open the command palette.
      </p>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
