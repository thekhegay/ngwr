<ngwr-doc-page
  title="Statistic"
  description="A key number with a label and an optional change."
  [keywords]="['statistic', 'kpi', 'wr-statistic']"
>
  <ngwr-doc-section title="Basic">
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 2.5rem; flex-wrap: wrap">
        <wr-statistic label="Active users" [value]="12345" />
        <wr-statistic label="Revenue" [value]="9512" prefix="$" [delta]="12.4" />
        <wr-statistic label="Churn" [value]="1.8" [precision]="1" suffix="%" [delta]="-0.4" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Dashboard grid"
    description="`<wr-statistic-group>` reflows to its own width (drag the corner): `min` sets the narrowest column, `columns` the most per row."
  >
    <ngwr-doc-code [code]="groupSnippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="
          resize: horizontal;
          overflow: auto;
          min-width: 15rem;
          max-width: 100%;
          padding: 1rem;
          border: 1px dashed var(--wr-border-base);
          border-radius: var(--wr-border-radius-base);
        "
      >
        <wr-statistic-group [columns]="4" min="11rem">
          <wr-statistic label="Active users" [value]="12345" />
          <wr-statistic label="Revenue" [value]="9512" prefix="$" [delta]="12.4" />
          <wr-statistic label="Churn" [value]="1.8" [precision]="1" suffix="%" [delta]="-0.4" />
          <wr-statistic label="Sessions" [value]="48210" />
        </wr-statistic-group>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Count up"
    description="A new number counts up from the old one; `[animate]='false'` turns it off."
  >
    <ngwr-doc-code [code]="countUpSnippet" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 2.5rem; flex-wrap: wrap">
        <wr-statistic label="Revenue" prefix="$" [value]="revenue()" [precision]="2" [delta]="delta()" />
        <wr-statistic label="Sessions" [value]="sessions()" />
        <wr-statistic label="Sessions (no animation)" [value]="sessions()" [animate]="false" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Countdown"
    description="`<wr-statistic-countdown>` counts down to `target`; `format` takes `D`, `H`, `m`, `s` (doubled to pad) and `SSS`. A unit the format leaves out is carried into the largest one it shows, so `HH:mm:ss` reads `73:00:00` three days out."
  >
    <ngwr-doc-code [code]="countdownSnippet" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; gap: 2.5rem; flex-wrap: wrap">
        <wr-statistic-countdown label="Launch in" [target]="launchDate()" format="D days HH:mm:ss" />
        <wr-statistic-countdown
          label="Soon (fires in ~30s)"
          [target]="soonDate()"
          format="mm:ss"
          endText="Live!"
          (countdownEnd)="onLive()"
        />
        @if (fired()) {
          <wr-statistic label="(countdownEnd) fired" value="✓" />
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
