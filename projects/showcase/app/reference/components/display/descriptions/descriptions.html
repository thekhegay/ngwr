<ngwr-doc-page
  title="Descriptions"
  description="A read-only list of labels and their values."
  [keywords]="['descriptions', 'wr-descriptions']"
>
  <ngwr-doc-section
    title="Default"
    description="Each label sits above its value with no rules, which suits a card that has its own frame."
  >
    <ngwr-doc-code [code]="plainSnippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-descriptions title="Account">
        <wr-description-item label="Name">Ada Lovelace</wr-description-item>
        <wr-description-item label="Email">ada@example.com</wr-description-item>
        <wr-description-item label="Joined">2024-03-12</wr-description-item>
      </wr-descriptions>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Inline + bordered"
    description="`inline` puts each label beside its value and `bordered` draws rules; each also works alone."
  >
    <ngwr-doc-code [code]="snippet" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-descriptions title="Account" inline bordered>
        <wr-description-item label="Name">Ada Lovelace</wr-description-item>
        <wr-description-item label="Email">ada@example.com</wr-description-item>
        <wr-description-item label="Joined">2024-03-12</wr-description-item>
      </wr-descriptions>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Narrow container"
    description="With `responsive`, an inline list stacks when its own container is narrow."
  >
    <ngwr-doc-snippet
      code='<div style="width: 280px"><wr-descriptions responsive inline bordered>…</wr-descriptions></div>'
    >
      <div style="width: 280px; max-width: 100%">
        <wr-descriptions title="Account" responsive inline bordered>
          <wr-description-item label="Name">Ada Lovelace</wr-description-item>
          <wr-description-item label="Email">ada@example.com</wr-description-item>
          <wr-description-item label="Joined">2024-03-12</wr-description-item>
        </wr-descriptions>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Descriptions API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Description item API">
    <ngwr-doc-api [rows]="itemApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
