<ngwr-doc-page
  title="Counter"
  description="An animated number: rolling digits or an eased count."
  [keywords]="['counter', 'odometer', 'count-up', 'animated number', 'wr-counter']"
  [labels]="['Display']"
>
  <ngwr-doc-section title="Odometer" description="Digits roll on every change of `value`.">
    <ngwr-doc-code [code]="snippets.odometer" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; font-size: 3rem; font-weight: 600"
      >
        <wr-counter [value]="oilGauge()" mode="odometer" />
        <wr-btn (click)="randomize()">Randomize</wr-btn>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Tween" description='`mode="tween"` eases from the old value to the new one.'>
    <ngwr-doc-code [code]="snippets.tween" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; font-size: 3rem; font-weight: 600"
      >
        <wr-counter [value]="stocks()" mode="tween" [decimals]="2" prefix="$" />
        <wr-btn (click)="randomize()">Randomize</wr-btn>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Padded integer" description="`minIntegerDigits` pads the number with leading zeros.">
    <ngwr-doc-code [code]="snippets.minDigits" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; font-size: 3rem; font-weight: 600"
      >
        <wr-counter [value]="progress()" [minIntegerDigits]="6" mode="odometer" />
        <wr-btn (click)="stepProgress()">Step</wr-btn>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Count up"
    description='`<wr-count-up>` counts from `from` to `to` on load or, with `trigger="visible"`, when it scrolls into view.'
  >
    <ngwr-doc-code [code]="snippets.countUp" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; font-size: 3rem; font-weight: 600"
      >
        <wr-count-up [to]="1000" easing="spring" [duration]="2" trigger="visible" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Count down" description='`direction="down"` counts from `to` to `from`.'>
    <ngwr-doc-code [code]="snippets.countDown" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div
        style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; font-size: 3rem; font-weight: 600"
      >
        <wr-count-up [from]="0" [to]="60" direction="down" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Counter API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Count-up API">
    <ngwr-doc-api [rows]="countUpApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
