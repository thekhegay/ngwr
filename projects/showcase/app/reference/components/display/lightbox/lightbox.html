<ngwr-doc-page
  title="Lightbox"
  description="An image that opens full size in an overlay when clicked."
  [keywords]="['lightbox', 'image', 'preview', 'zoom', 'wr-lightbox', 'wr-image']"
  [labels]="['Component']"
  updated="16.5.0"
>
  <ngwr-doc-section
    title="Basic usage"
    description="Click to open; Escape, the backdrop, the close button or the image itself closes it."
  >
    <ngwr-doc-snippet [code]="snippets.basic">
      <wr-lightbox [src]="landscape" alt="Mountain lake" aspectRatio="3 / 2" style="width: 18rem" />
    </ngwr-doc-snippet>
    <p>
      Opening focuses the viewer itself, with no ring, and traps Tab in it. Set
      <code>autoFocus="first-tabbable"</code> to open on the Close button, or <code>[autoFocus]="false"</code> to leave
      focus on the thumbnail. Closing returns focus to the thumbnail.
    </p>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Separate thumbnail"
    description="`preview` is the small thumbnail, `src` the full-size image."
  >
    <ngwr-doc-snippet [code]="snippets.preview">
      <wr-lightbox [src]="portrait" [preview]="portraitThumb" alt="Forest" aspectRatio="2 / 3" style="width: 12rem" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Caption" description="`caption` shows under the full image.">
    <ngwr-doc-snippet [code]="snippets.caption">
      <wr-lightbox
        [src]="landscape"
        [preview]="landscapeThumb"
        alt="Geiranger"
        caption="Geiranger, Norway — 2023"
        aspectRatio="3 / 2"
        style="width: 18rem"
      />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Gallery"
    description="Lightboxes with the same `group` open as one gallery, in document order: previous and next buttons, a counter, the arrow keys, Home and End, and a sideways swipe. `loop` wraps around the ends."
  >
    <ngwr-doc-snippet [code]="snippets.gallery">
      @for (photo of gallery; track photo.src) {
        <wr-lightbox
          group="trip"
          [src]="photo.src"
          [preview]="photo.preview"
          [alt]="photo.alt"
          [caption]="photo.caption"
          aspectRatio="1"
          style="width: 9rem"
        />
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Disable preview" description="`disablePreview` turns the zoom off and leaves a plain image.">
    <ngwr-doc-snippet [code]="snippets.disabled">
      <wr-lightbox
        [src]="portrait"
        [preview]="portraitThumb"
        alt="No zoom"
        disablePreview
        aspectRatio="2 / 3"
        style="width: 12rem"
      />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
