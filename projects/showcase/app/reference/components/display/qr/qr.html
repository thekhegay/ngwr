<ngwr-doc-page
  title="QR Code"
  description="Draws a QR code on a canvas, encoded by [Project Nayuki's library](https://www.nayuki.io/page/qr-code-generator-library) (MIT)."
  [keywords]="['qr', 'qr-code', 'wr-qr']"
  [labels]="['Component']"
  updated="16.9.0"
>
  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <wr-qr value="https://ngwr.dev" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Sized, colored, high error correction"
    description="`size`, `color` and `bgColor` style it; use `level='H'` when anything covers the centre."
  >
    <ngwr-doc-snippet [code]="snippets.sized">
      <wr-qr value="ngwr" [size]="180" level="H" color="#3969e2" />
      <wr-qr value="ngwr" [size]="180" level="H" color="#0f172a" bgColor="#f1f5f9" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Center icon" description="`iconUrl` puts an image in the middle; pair it with `level='H'`.">
    <ngwr-doc-snippet [code]="snippets.icon">
      <wr-qr value="https://ngwr.dev" [size]="180" level="H" iconUrl="/icon.svg" [iconSize]="40" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Icon background"
    description="`iconBackground` colours the square under the icon; `'transparent'` draws none. In dev mode the console warns when the icon covers more of the code than `level` can recover."
  >
    <ngwr-doc-snippet [code]="snippets.iconBackground">
      <div class="ngwr-demo-pair">
        <div>
          <p class="ngwr-demo-pair__caption">A colour</p>
          <wr-qr
            value="https://ngwr.dev"
            [size]="180"
            level="H"
            iconUrl="/icon.svg"
            [iconSize]="48"
            iconBackground="#dbeafe"
          />
        </div>
        <div>
          <p class="ngwr-demo-pair__caption">No square</p>
          <wr-qr
            value="https://ngwr.dev"
            [size]="180"
            level="H"
            iconUrl="/icon.svg"
            [iconSize]="48"
            iconBackground="transparent"
          />
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Interactive">
    <ngwr-doc-snippet [code]="snippets.interactive">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: center">
        <wr-qr [value]="text()" [size]="180" />
        <input wrInput [(ngModel)]="text" placeholder="Type to encode" style="min-width: 18rem" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
