<ngwr-doc-page
  title="Sparkline"
  description="Tiny inline trend line — no axes, no labels. Drop it next to a number to give context at a glance."
  [keywords]="['sparkline', 'trend', 'wr-sparkline']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-sparkline [data]="data" width="100%" height="4rem" style="display: block; width: 100%" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Filled area" description="Set `[showArea]` to fill under the line.">
    <ngwr-doc-code [code]="snippets.area" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-sparkline
        [data]="data"
        [showArea]="true"
        color="var(--wr-color-success)"
        width="100%"
        height="4rem"
        style="display: block; width: 100%"
      />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Tooltip"
    description="Hover the line for the value of the nearest point, marked on the line, in a tooltip pointing at that mark and named by `ariaLabel` when one is given. Set `[tooltip]` to `false` to turn it off."
  >
    <ngwr-doc-code [code]="snippets.tooltip" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
