<ngwr-doc-page
  title="Drawer"
  description="A side panel that slides in from any edge of the screen."
  [keywords]="['drawer', 'wr-drawer', 'panel', 'overlay', 'sheet']"
  [labels]="['Component', 'Service', 'Directives', 'CDK Overlay']"
>
  <ngwr-doc-section title="Basic usage" description="Bind `[(open)]`; `position` picks the edge.">
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />

    <ngwr-doc-snippet code="">
      <wr-segmented [options]="positionOptions" [(value)]="position" />
      <wr-btn color="primary" (click)="open.set(true)">Open drawer</wr-btn>
    </ngwr-doc-snippet>

    <wr-drawer [(open)]="open" [position]="position()" width="22rem">
      <h2 wrDrawerTitle>Settings</h2>
      <div wrDrawerContent>
        <p style="margin: 0; color: var(--wr-color-on-surface-muted); font-size: 0.875rem">
          Escape or a backdrop click closes it.
        </p>
      </div>
      <div wrDrawerFooter>
        <wr-btn wrDrawerClose>Cancel</wr-btn>
        <wr-btn color="primary" wrDrawerClose>Save</wr-btn>
      </div>
    </wr-drawer>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Opening a drawer from code"
    description="`WrDrawerManager.open()` opens any component as a drawer and returns its close result. The content injects `WR_DRAWER_DATA` and `WrDrawerRef`."
  >
    <ngwr-doc-code [code]="snippets.service" language="angular-ts" />
    <ngwr-doc-code [code]="snippets.serviceContent" language="angular-ts" />

    <ngwr-doc-snippet code="drawers.open(ChatComponent, { data, position: 'right', width: '24rem' })">
      <wr-btn color="primary" (click)="openChat()">Open chat drawer</wr-btn>
      <span style="color: var(--wr-color-on-surface-muted); font-size: 0.875rem; align-self: center">
        Last result: {{ lastResult() }}
      </span>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Drawer API">
    <ngwr-doc-api [rows]="drawerApi" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Focus and lifetime"
    description="Mark the field to focus with `cdkFocusInitial`. Without it, `<wr-drawer>` focuses its ✕ and `WrDrawerManager` the first control."
  >
    <ngwr-doc-code [code]="snippets.focus" language="angular-html" />
    <p>
      A drawer from <code>WrDrawerManager</code> outlives its opener: close the ref in
      <code>DestroyRef.onDestroy</code>. <code>&lt;wr-drawer&gt;</code> closes with its view.
    </p>
  </ngwr-doc-section>

  <ngwr-doc-section title="Service API">
    <ngwr-doc-api [rows]="serviceApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="WrDrawerOptions" description="The component inputs, plus `data` and `closeOnNavigation`.">
    <ngwr-doc-api [rows]="optionsApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Layout directives">
    <ngwr-doc-api [rows]="directivesApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Available inside a service-opened drawer">
    <ngwr-doc-api [rows]="injectablesApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
