<ngwr-doc-page
  title="Form"
  description="A plain layout wrapper for a label, a control and its error."
  [keywords]="['form', 'wr-form-item', 'wr-form-error']"
  [labels]="['Component']"
>
  <ngwr-doc-section title="Which wrapper — item or field?">
    <table>
      <thead>
        <tr>
          <th scope="col">Wrapper</th>
          <th scope="col">Use it when</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <a routerLink="/reference/components/form-field"><code>&lt;wr-form-field&gt;</code></a>
          </td>
          <td>By default. It reads the control, shows its errors and wires the label.</td>
        </tr>
        <tr>
          <td><code>&lt;wr-form-item&gt;</code></td>
          <td>You want the layout only. You set <code>hasError</code> and write the error yourself.</td>
        </tr>
      </tbody>
    </table>
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%; max-width: 24rem">
        <wr-form-item>
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label>Email</label>
          <input wrInput type="email" [(ngModel)]="email" placeholder="you@example.com" />
        </wr-form-item>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="With error"
    description="`[hasError]` turns the label and input red; project the message as `<wr-form-error>`."
  >
    <ngwr-doc-snippet [code]="snippets.error">
      <div style="width: 100%; max-width: 24rem; display: flex; flex-direction: column; gap: 0.75rem">
        <wr-form-item [hasError]="emailInvalid()">
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label>Email</label>
          <input wrInput type="email" [(ngModel)]="email" placeholder="you@example.com" />
          @if (emailInvalid()) {
            <wr-form-error>Please enter a valid email.</wr-form-error>
          }
        </wr-form-item>
        <div>
          <wr-btn color="primary" (click)="validate()">Validate</wr-btn>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Form Item API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Form Error API">
    <ngwr-doc-api [rows]="errorApi" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="&lt;wr-form-field&gt; API — for reference"
    description="Also in `ngwr/form`; the examples are on [its own page](/reference/components/form-field)."
  >
    <ngwr-doc-api [rows]="fieldApi" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
