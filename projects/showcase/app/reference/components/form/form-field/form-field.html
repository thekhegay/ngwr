<ngwr-doc-page
  title="Form Field"
  description="Wraps a form control with a label, a hint and its error messages."
  [keywords]="['form field', 'label', 'hint', 'error', 'wr-form-field']"
  [labels]="['Component']"
>
  <ngwr-doc-section
    title="Basic usage"
    description="Add one `<wr-form-error key>` per validator; errors show once the control is touched or dirty."
  >
    <ngwr-doc-snippet [code]="snippets.basic">
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        style="display: flex; flex-direction: column; gap: 1rem; max-width: 24rem"
      >
        <wr-form-field label="Email" hint="We'll never share it." required>
          <input wrInput formControlName="email" type="email" placeholder="ada@example.com" />
          <wr-form-error key="required">Email is required.</wr-form-error>
          <wr-form-error key="email">That isn't a valid email.</wr-form-error>
        </wr-form-field>

        <wr-form-field label="Display name" required>
          <input wrInput formControlName="name" placeholder="Ada Lovelace" />
          <wr-form-error key="required">Display name is required.</wr-form-error>
        </wr-form-field>

        <button wr-btn type="submit" color="primary" style="align-self: flex-start">Submit</button>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Messages without markup"
    description="Without `<wr-form-error>`, the field shows the rule's `{ message }`, else `validation.<key>` from your i18n catalog, else nothing."
  >
    <ngwr-doc-snippet [code]="snippets.auto">
      <form
        [formGroup]="autoForm"
        (ngSubmit)="submitAuto()"
        style="display: flex; flex-direction: column; gap: 1rem; max-width: 24rem"
      >
        <wr-form-field label="Handle" required>
          <input wrInput formControlName="handle" placeholder="ada" />
        </wr-form-field>

        <wr-form-field label="Age">
          <input wrInput formControlName="age" type="number" placeholder="18" />
        </wr-form-field>

        <button wr-btn type="submit" color="primary" style="align-self: flex-start">Submit</button>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="A message on the validator"
    description="Signal Forms rules take `{ message }`. A custom validator puts a `message` string on its error."
  >
    <ngwr-doc-code [code]="snippets.message" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="A message in your catalog"
    description="A `validation.<key>` entry covers that error on every field; `minLength` and `maxLength` read the `minlength` and `maxlength` keys."
  >
    <ngwr-doc-code [code]="snippets.catalog" language="typescript" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="A message in the markup"
    description="`<wr-form-error key>` wins for its key on that field. Other keys still resolve."
  >
    <ngwr-doc-code [code]="snippets.markup" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Optional marker" description="`optional` marks a field users can skip.">
    <ngwr-doc-snippet [code]="snippets.optional">
      <form [formGroup]="form" style="max-width: 24rem">
        <wr-form-field label="Bio" optional hint="Up to 140 characters.">
          <input wrInput formControlName="bio" placeholder="A short tagline" />
        </wr-form-field>
      </form>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Required marker"
    description="`required` only draws the asterisk. It adds no validator, and a validator does not set it: write both."
  >
    <ngwr-doc-code [code]="snippets.requiredPair" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
