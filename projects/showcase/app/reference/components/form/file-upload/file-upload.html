<ngwr-doc-page
  title="File Upload"
  updated="16.3.0"
  description="Pick files by dropping them on a zone or browsing."
  [keywords]="['file', 'upload', 'drop zone', 'wr-file-upload']"
  [labels]="['Signal Forms']"
>
  <ngwr-doc-section title="Single file" description="The value is the last accepted `File`, or `null`.">
    <ngwr-doc-code [code]="snippets.single" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload [(value)]="single" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Multiple files" description="`multiple` makes the value a `File[]`; `maxFiles` caps it.">
    <ngwr-doc-code [code]="snippets.multi" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload [(value)]="multi" [multiple]="true" [maxFiles]="5" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Constrained"
    description="`accept` and `maxSize` (bytes) filter files; the rest arrive in `(rejected)`."
  >
    <ngwr-doc-code [code]="snippets.constrained" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload
        [(value)]="avatar"
        accept=".png,.jpg,image/webp"
        [maxSize]="2 * 1024 * 1024"
        helperText="PNG, JPG or WebP, up to 2 MB"
        (rejected)="onRejected($event)"
      />
      @if (lastRejection()) {
        <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
          Rejected: {{ lastRejection() }}
        </small>
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Sizes"
    description="`sm`, `md` (default) or `lg` scale the zone's padding, icon and text, and the file rows. Since v16.3."
  >
    <ngwr-doc-code [code]="snippets.sizes" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 1rem; width: 100%">
        @for (s of sizes; track s) {
          <wr-file-upload [size]="s" [multiple]="true" />
        }
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Upload progress"
    description="The component does no HTTP. Upload each file yourself and set its state in `[status]`, a `Map` keyed by `File`: `pending`, `uploading` (with a `percent`, or indeterminate without), `done` or `error`. A failed row shows your `message` and a button that emits `(retry)`. Since v16.3."
  >
    <ngwr-doc-code [code]="snippets.progress" language="angular-html" />
    <ngwr-doc-code [code]="snippets.progressTs" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; width: 100%">
        <wr-file-upload
          [multiple]="true"
          [value]="uploads()"
          [status]="statuses()"
          helperText="A fake upload: every second file fails once"
          (valueChange)="onUploads($event)"
          (retry)="upload($event)"
        />
        <div><wr-btn size="sm" outlined (click)="addSamples()">Add sample files</wr-btn></div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Image previews"
    description="`previews` shows a thumbnail beside each image file. Since v16.3."
  >
    <ngwr-doc-code [code]="snippets.previews" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload [(value)]="previewed" [multiple]="true" [previews]="true" accept="image/*" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Paste"
    description="`acceptPaste` takes files pasted with Ctrl/Cmd+V while the zone has focus, under the same `accept`, `maxSize` and `maxFiles` rules as a drop. Since v16.3."
  >
    <ngwr-doc-code [code]="snippets.paste" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload
        [(value)]="pasted"
        [multiple]="true"
        [acceptPaste]="true"
        helperText="Focus the zone, then paste a screenshot or a copied file"
      />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Types">
    <ngwr-doc-code [code]="typeSnippet" language="angular-ts" />
    <ngwr-doc-api [rows]="typeRows" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
