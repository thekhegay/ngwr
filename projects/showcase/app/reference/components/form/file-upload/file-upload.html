<ngwr-doc-page
  title="File Upload"
  description="Pick files by dropping them on a zone or browsing."
  [keywords]="['file', 'upload', 'drop zone', 'wr-file-upload']"
  [labels]="['Signal Forms']"
>
  <ngwr-doc-section title="Single file" description="The value is the last accepted `File`, or `null`.">
    <ngwr-doc-code [code]="snippets.single" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload [(value)]="single" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Multiple files" description="`multiple` makes the value a `File[]`; `maxFiles` caps it.">
    <ngwr-doc-code [code]="snippets.multi" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload [(value)]="multi" [multiple]="true" [maxFiles]="5" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Constrained"
    description="`accept` and `maxSize` (bytes) filter files; the rest arrive in `(rejected)`."
  >
    <ngwr-doc-code [code]="snippets.constrained" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-file-upload
        [(value)]="avatar"
        accept=".png,.jpg,image/webp"
        [maxSize]="2 * 1024 * 1024"
        helperText="PNG, JPG or WebP, up to 2 MB"
        (rejected)="onRejected($event)"
      />
      @if (lastRejection()) {
        <small style="display: block; margin-top: 0.5rem; color: var(--wr-color-on-surface-muted)">
          Rejected: {{ lastRejection() }}
        </small>
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Types">
    <ngwr-doc-code [code]="typeSnippet" language="angular-ts" />
    <ngwr-doc-api [rows]="typeRows" />
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
