<ngwr-doc-page
  title="Input OTP"
  description="Fixed-length one-time-code input. One cell per character, auto-advances focus on typing, handles paste of a full code, optional masking like a password field."
  [keywords]="['otp', 'pin', 'code', 'verification', 'wr-input-otp']"
  [labels]="['Signal Forms', 'a11y']"
>
  <ngwr-doc-section
    title="Basic (numeric, 6 cells)"
    description="The default. `completed` fires once every cell holds a character — paste the value `123456` to try it."
  >
    <ngwr-doc-snippet [code]="snippets.basic" language="angular-html">
      <wr-input-otp [(value)]="code" (completed)="onCompleted($event)" />
      @if (lastCompleted(); as value) {
        <p style="margin: 0.75rem 0 0; font-size: 0.8125rem; color: var(--wr-color-on-surface-muted)">
          completed: <code>{{ value }}</code>
        </p>
      }
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Custom length">
    <ngwr-doc-snippet [code]="snippets.length" language="angular-html">
      <wr-input-otp [(value)]="codeShort" length="4" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Alphanumeric" description="Letters and digits. Useful for invitation codes.">
    <ngwr-doc-snippet [code]="snippets.alpha" language="angular-html">
      <wr-input-otp [(value)]="alphaNumeric" mode="alphanumeric" length="8" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Masked"
    description="Renders cells as `type='password'` — characters are hidden as you type."
  >
    <ngwr-doc-snippet [code]="snippets.masked" language="angular-html">
      <wr-input-otp [(value)]="secret" mask />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Disabled and read-only"
    description="Tab through both. A DISABLED strip is out of the tab order and submits nothing. A READ-ONLY one keeps every box focusable, keeps announcing the code, and still submits — each box is a real input, so the arrows, Home / End and selection all keep working; only typing and pasting are refused."
  >
    <ngwr-doc-code [code]="snippets.states" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 1rem">
        <wr-input-otp disabled [(value)]="lockedCode" />
        <wr-input-otp readonly [(value)]="lockedCode" />
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>
</ngwr-doc-page>
