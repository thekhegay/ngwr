<ngwr-doc-page
  title="Form"
  description="`<wr-form-item>` — the bare layout wrapper: it stacks a label, a control and an error message, and colours them red when you tell it to. It reads nothing about the control. Its richer sibling `<wr-form-field>` has its own page, and is the one to reach for by default."
  [keywords]="['form', 'wr-form-item', 'wr-form-error']"
  [labels]="['Component', 'Standalone']"
>
  <ngwr-doc-section title="Installation">
    <ngwr-doc-code [code]="snippets.install" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Which wrapper — item or field?"
    description="Both live in `ngwr/form` and both wrap one control. They are not variants of each other, and the choice is not a matter of taste."
  >
    <ngwr-doc-code [code]="snippets.choosing" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Basic usage">
    <ngwr-doc-snippet [code]="snippets.basic">
      <div style="width: 100%; max-width: 24rem">
        <wr-form-item>
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label>Email</label>
          <input wrInput type="email" [(ngModel)]="email" placeholder="you@example.com" />
        </wr-form-item>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="With error"
    description="Toggle hasError to color label/input red and reveal the error message."
  >
    <ngwr-doc-snippet [code]="snippets.error">
      <div style="width: 100%; max-width: 24rem; display: flex; flex-direction: column; gap: 0.75rem">
        <wr-form-item [hasError]="emailInvalid()">
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label>Email</label>
          <input wrInput type="email" [(ngModel)]="email" placeholder="you@example.com" />
          @if (emailInvalid()) {
            <wr-form-error>Please enter a valid email.</wr-form-error>
          }
        </wr-form-item>
        <div>
          <wr-btn color="primary" (click)="validate()">Validate</wr-btn>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Form Item API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Form Error API">
    <ngwr-doc-api [rows]="errorApi" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="&lt;wr-form-field&gt; API — for reference"
    description="The other wrapper's API, listed here because both ship from the one `ngwr/form` entry point. It is NOT the component this page's Installation block imports: to use it, import `WrFormField` and read its own page, which has the examples."
  >
    <ngwr-doc-api [rows]="fieldApi" />
  </ngwr-doc-section>

  <ngwr-doc-see-also [links]="related" />
</ngwr-doc-page>
