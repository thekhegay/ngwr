<ngwr-doc-page
  title="Cascader"
  description="Pick a path through nested options, one column per level."
  [keywords]="['cascader', 'wr-cascader', 'multi-level', 'select']"
  [labels]="['Component']"
>
  <ngwr-doc-section
    title="Basic"
    description="Picking a leaf commits the whole path to `[(value)]` or [any Angular form](/guides/forms)."
  >
    <ngwr-doc-code [code]="snippets.basic" language="angular-ts" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 30rem">
        <wr-cascader [options]="locations" [(value)]="picked" placeholder="Pick a location" />
        <span style="color: var(--wr-color-on-surface-muted); font-size: 0.875rem"> Value: {{ picked() | json }} </span>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="changeOnSelect" description="Commit on every click, parent levels included.">
    <ngwr-doc-code [code]="snippets.changeOnSelect" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 30rem">
        <wr-cascader [options]="locations" [(value)]="pickedAny" changeOnSelect placeholder="Pick any level" />
        <span style="color: var(--wr-color-on-surface-muted); font-size: 0.875rem">
          Value: {{ pickedAny() | json }}
        </span>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Width"
    description="The default is `12rem`; change it with `--wr-cascader-min-width`, not a `min-width` on `.wr-cascader__trigger`."
  />

  <ngwr-doc-section title="API">
    <ngwr-doc-api [rows]="api" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Types">
    <ngwr-doc-api [rows]="typesApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
