<ngwr-doc-page
  title="Color Picker"
  updated="15.0.0"
  description="Pick a colour inline, or from a button that opens the picker."
  [keywords]="['color', 'colour', 'picker', 'palette', 'hsv', 'hex', 'wr-color-picker']"
  [labels]="['Signal Forms', 'CDK Overlay']"
>
  <ngwr-doc-section
    title="Basic"
    description="Bind the colour string with `[(value)]` or [any Angular form](/guides/forms)."
  >
    <ngwr-doc-code [code]="snippets.basic" language="angular-html" />
    <ngwr-doc-snippet code="">
      <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start">
        <wr-color-picker [(value)]="basic" />
        <div style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.8125rem">
          <span
            >Value: <code>{{ basic() }}</code></span
          >
          <span
            style="
              display: inline-block;
              width: 4rem;
              height: 4rem;
              border-radius: 0.5rem;
              border: 1px solid var(--wr-border-base);
            "
            [style.background]="basic()"
          ></span>
        </div>
      </div>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="No alpha"
    description='`[alpha]="false"` hides the alpha slider and drops alpha from the value.'
  >
    <ngwr-doc-code [code]="snippets.opaque" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-color-picker [(value)]="opaque" [alpha]="false" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Swatches" description="`[swatches]` adds a row of preset colours.">
    <ngwr-doc-code [code]="snippets.swatches" language="angular-html" />
    <ngwr-doc-snippet code="">
      <wr-color-picker [(value)]="branded" [swatches]="palette" />
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Popover trigger"
    description="`[wrColorPickerTrigger]` on any button opens the picker in an overlay."
  >
    <ngwr-doc-code [code]="snippets.trigger" language="angular-html" />
    <ngwr-doc-snippet code="">
      <button wr-btn type="button" wrColorPickerTrigger [(value)]="triggered" [swatches]="palette">
        <span
          style="
            display: inline-block;
            width: 1rem;
            height: 1rem;
            margin-inline-end: 0.5rem;
            vertical-align: middle;
            border-radius: 0.25rem;
            border: 1px solid color-mix(in srgb, var(--wr-color-on-surface) 12%, transparent);
          "
          [style.background]="triggered()"
        ></span>
        {{ triggered() }}
      </button>
    </ngwr-doc-snippet>
  </ngwr-doc-section>

  <ngwr-doc-section title="Color utilities" description="Parse and convert colours without a picker.">
    <ngwr-doc-code [code]="snippets.utils" language="angular-ts" />
  </ngwr-doc-section>

  <ngwr-doc-section
    title="Template reference"
    description="Export the trigger as `wrColorPickerTrigger` to open it or read its value from elsewhere."
  >
    <ngwr-doc-code [code]="snippets.exportAs" language="angular-html" />
  </ngwr-doc-section>

  <ngwr-doc-section title="<wr-color-picker>">
    <ngwr-doc-api [rows]="pickerApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="[wrColorPickerTrigger]">
    <ngwr-doc-api [rows]="triggerApi" />
  </ngwr-doc-section>

  <ngwr-doc-section title="[wrColorPickerTrigger] events">
    <ngwr-doc-api [rows]="triggerEvents" />
  </ngwr-doc-section>

  <ngwr-doc-section title="Exported utilities">
    <ngwr-doc-api [rows]="utilsApi" />
  </ngwr-doc-section>
</ngwr-doc-page>
