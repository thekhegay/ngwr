<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>ngwr — the Angular UI library for Signal Forms</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Pre-paint theme resolution. The pages are prerendered at build time, which
      cannot know a visitor's preference — the server has no localStorage and no
      `prefers-color-scheme`, so every static page ships `data-theme="light"`.
      This runs before first paint and corrects it, avoiding a light flash for
      dark-mode visitors.

      Mirrors `WrTheme` + `WrStorage` exactly: key `wr-theme` (empty prefix),
      value stored as a JSON envelope `{"v":"dark"}` with an optional `e`
      expiry, default mode `auto`.

      The library ships this recipe as `wrThemePrePaintScript()` from
      `ngwr/theme`, and `theme/pre-paint.spec.ts` runs BOTH against the same
      stored values and fails when they disagree — so this stays hand-written
      (index.html cannot import) but it cannot drift.
    -->
    <script>
      (function () {
        try {
          var mode = null;
          var raw = localStorage.getItem('wr-theme');
          if (raw !== null) {
            try {
              var parsed = JSON.parse(raw);
              if (parsed !== null && typeof parsed === 'object' && 'v' in parsed) {
                if (parsed.e === undefined || parsed.e >= Date.now()) mode = parsed.v;
              } else {
                mode = parsed;
              }
            } catch (e) {
              mode = raw;
            }
          }
          if (mode !== 'light' && mode !== 'dark') mode = 'auto';
          var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* storage blocked (private mode / sandboxed iframe) — keep the prerendered default */
        }
      })();
    </script>

    <!--
      Pre-paint direction, for the same reason: every prerendered page ships
      `dir="ltr"`, and a reviewer who switched the header to RTL would otherwise
      watch the whole layout mirror after the bundle boots. Key `ngwr-direction`,
      stored as the bare string by `SiteDirection` (`#core/services`); anything
      but `ltr` / `rtl` is ignored. The CDK's `Directionality` reads this
      attribute in its constructor, so it boots agreeing with the paint.

      Kept as its own script on purpose: `theme/pre-paint.spec.ts` runs the FIRST
      inline script here against `wrThemePrePaintScript()`, and that one has to
      stay the theme recipe alone.
    -->
    <script>
      (function () {
        try {
          var dir = localStorage.getItem('ngwr-direction');
          if (dir === 'ltr' || dir === 'rtl') document.documentElement.setAttribute('dir', dir);
        } catch (e) {
          /* storage blocked — keep the prerendered ltr */
        }
      })();
    </script>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <ngwr-root></ngwr-root>
  </body>
</html>
