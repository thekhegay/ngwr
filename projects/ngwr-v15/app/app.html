<header class="sandbox__bar">
  <strong>ngwr v15 sandbox — Feedback</strong>
  <button wr-btn type="button" size="sm" variant="outlined" (click)="toggleTheme()">
    {{ theme.resolved() === 'dark' ? 'Dark' : 'Light' }}
  </button>
</header>

<main class="sandbox">
  <section class="sandbox__block">
    <h2>Alert — closable and no icon</h2>
    <wr-alert title="Saved" type="success" closable (closed)="onClose()" />
    <wr-alert title="Plain" message="No leading icon." [icon]="false" />
    <wr-alert title="Offline" type="offline" closable />
  </section>

  <section class="sandbox__block">
    <h2>Empty</h2>
    <wr-empty />
    <wr-empty iconName="search" title="No results">
      Try a different query or clear filters.
      <ng-container wrEmptyActions>
        <button wr-btn type="button" (click)="reset()">Reset filters</button>
      </ng-container>
    </wr-empty>
    <wr-empty [icon]="false" title="No results">Try a different query.</wr-empty>
  </section>

  <section class="sandbox__block">
    <h2>Progress</h2>
    <wr-progress [value]="42" />
    <wr-progress color="success" [value]="80" />
    <wr-progress [value]="value()" />
    <wr-slider [(value)]="value" />
  </section>

  <section class="sandbox__block">
    <h2>Skeleton and spinner</h2>
    <wr-skeleton />
    <wr-skeleton width="60%" />
    <div class="row">
      <wr-spinner size="sm" />
      <wr-spinner />
      <wr-spinner size="lg" />
      <wr-spinner color="success" />
    </div>
  </section>

  <section class="sandbox__block">
    <h2>Result — statuses</h2>
    <div class="row">
      <wr-result status="success" title="Submitted" />
      <wr-result status="warning" title="Heads up" />
      <wr-result status="error" title="Failed" />
      <wr-result status="info" title="In review" />
      <wr-result status="empty" title="No projects" />
    </div>
  </section>

  <section class="sandbox__block">
    <h2>Result — action and presets</h2>
    <wr-result status="success" title="Submitted!" description="We'll be in touch.">
      <button wr-btn type="button" color="primary" wrResultExtra>Continue</button>
    </wr-result>
    <div class="row">
      <wr-result-404 />
      <wr-result-403 />
      <wr-result-500 />
    </div>
  </section>

  <section class="sandbox__block">
    <h2>Pull to refresh</h2>
    <wr-pull-to-refresh style="height: 8rem" [refreshing]="loading()" (refresh)="reload()">
      @for (item of items(); track item) {
        <div>{{ item }}</div>
      }
    </wr-pull-to-refresh>
  </section>
</main>
