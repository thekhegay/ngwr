<header class="sandbox__bar">
  <strong>z-index on an overlay pane</strong>
  <button wr-btn type="button" size="sm" outlined (click)="toggleTheme()">
    {{ theme.resolved() === 'dark' ? 'Dark' : 'Light' }}
  </button>
</header>

<main class="sandbox">
  <section class="sandbox__block">
    <h2>Open the picker, then the dialog</h2>
    <wr-date-picker [(value)]="picked" placeholder="1. open me" />
    <button wr-btn type="button" color="primary" (click)="openDialog()">2. open a dialog</button>
  </section>
</main>
