<header class="sandbox__bar">
  <strong>ngwr v15 sandbox — Overlays</strong>
  <button wr-btn type="button" size="sm" variant="outlined" (click)="toggleTheme()">
    {{ theme.resolved() === 'dark' ? 'Dark' : 'Light' }}
  </button>
</header>

<main class="sandbox">
  <section class="sandbox__block">
    <h2>Popover and popconfirm</h2>
    <div class="row">
      <wr-btn [wrPopover]="info">Details</wr-btn>
      <wr-btn
        color="danger"
        wrPopconfirm="Delete this item?"
        confirmText="Delete"
        confirmColor="danger"
        (confirmed)="remove()"
        >Delete</wr-btn
      >
      <wr-btn (click)="notify()">Toast</wr-btn>
    </div>
    <ng-template #info>
      <div style="padding: 1rem; max-width: 16rem">Anything you can render in a template.</div>
    </ng-template>
  </section>

  <section class="sandbox__block">
    <h2>Drawer</h2>
    <wr-btn (click)="open.set(true)">Open</wr-btn>
    <wr-drawer [(open)]="open" position="right" width="22rem">
      <h2 wrDrawerTitle>Settings</h2>
      <div wrDrawerContent>Drawer body.</div>
      <div wrDrawerFooter>
        <wr-btn wrDrawerClose>Close</wr-btn>
        <wr-btn color="primary" wrDrawerClose>Save</wr-btn>
      </div>
    </wr-drawer>
  </section>

  <section class="sandbox__block">
    <h2>Context menu</h2>
    <div [wrContextMenu]="menu" style="padding: 1rem; border: 1px dashed var(--wr-color-outline)">Right-click me</div>
    <wr-context-menu #menu>
      <wr-context-menu-item>Copy</wr-context-menu-item>
      <wr-context-menu-item>Paste</wr-context-menu-item>
      <wr-context-menu-item>Delete</wr-context-menu-item>
    </wr-context-menu>
  </section>

  <section class="sandbox__block">
    <h2>Command palette — press mod+k</h2>
    <wr-command-palette [items]="commands" trigger="mod+k" />
  </section>
</main>
