<header class="sandbox__bar">
  <strong>ngwr v15 sandbox — toast stack</strong>
  <button wr-btn type="button" size="sm" outlined (click)="toggleTheme()">
    {{ theme.resolved() === 'dark' ? 'Dark' : 'Light' }}
  </button>
</header>

<main class="sandbox">
  <section class="sandbox__block">
    <h2>Burst</h2>
    <div class="row">
      <button wr-btn type="button" (click)="one()">One</button>
      <button wr-btn type="button" color="primary" (click)="burst(2)">Two at once</button>
      <button wr-btn type="button" color="primary" (click)="burst(3)">Three at once</button>
      <button wr-btn type="button" color="danger" (click)="burst(8)">Eight at once</button>
      <button wr-btn type="button" color="warning" (click)="stream()">Stream (overlapping)</button>
    </div>
  </section>
</main>
