name: Publish

on:
  push:
    branches: [main, next]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    name: Detect release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_rc: ${{ steps.check.outputs.is_rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check
        name: Inspect head commit
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "Head subject: $subject"
          if [[ "$subject" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)(\ \(#[0-9]+\))?$ ]]; then
            version="${BASH_REMATCH[1]}"
            tag="v$version"
            is_rc=$([[ "$version" == *-rc.* ]] && echo true || echo false)
            if [[ "$is_rc" == false && "$GITHUB_REF_NAME" != main ]]; then
              # Syncing next with main after a stable release lands the release
              # commit here too; its tag already exists, so there is nothing to do.
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                echo "$tag is already released; $GITHUB_REF_NAME only synced with main."
                echo "is_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::$version is a stable version on $GITHUB_REF_NAME; only main publishes stable releases."
              exit 1
            fi
            {
              echo "is_release=true"
              echo "version=$version"
              echo "tag=$tag"
              echo "is_rc=$is_rc"
            } >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Tag, release & npm publish
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write
      # The release body names the pull request behind each entry.
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the tag is pushed with git below
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache: this job holds the npm OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # A feat or fix merged after the release PR was cut would ship with no
      # CHANGELOG line. The cure is the Release PR workflow again, same bump.
      - name: Check the changelog names everything that ships
        run: pnpm release:check

      - run: pnpm lint

      - run: pnpm build:lib

      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:body --output=.release-body.md

      - name: Create git tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          tag="$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — skipping"
          else
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          IS_RC: ${{ needs.detect.outputs.is_rc }}
        run: |
          if [[ "$IS_RC" == "true" ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$TAG" --title "$TAG" --notes-file .release-body.md "${flags[@]}"

      - name: Assert npm supports staged publishing
        run: |
          floor=11.15.0
          have=$(npm --version)
          echo "npm $have, bundled with node $(node --version)"
          IFS=. read -r fa fb fc <<<"$floor"
          IFS=. read -r ha hb hc <<<"${have%%-*}"
          if (( ha < fa || (ha == fa && (hb < fb || (hb == fb && hc < fc))) )); then
            echo "::error::npm $have is below the $floor floor for npm stage — raise node-version, or install an exact npm version, but never npm@latest."
            exit 1
          fi

      # Staged: the version goes live once a maintainer approves it with 2FA.
      - name: Stage on npm (Trusted Publisher)
        working-directory: dist/lib
        env:
          IS_RC: ${{ needs.detect.outputs.is_rc }}
        run: |
          tag=$([[ "$IS_RC" == "true" ]] && echo "next" || echo "latest")
          npm stage publish --access public --provenance --tag "$tag"

  find-superseded-major:
    name: Find the major being superseded
    needs: [detect, publish]
    if: needs.detect.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: pick
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          version="$VERSION"
          if [[ ! "$version" =~ ^([0-9]+)\.0\.0$ ]]; then
            echo "$version is not a major release — nothing to archive"
            exit 0
          fi

          prev=$(( BASH_REMATCH[1] - 1 ))
          prev_tag=$(git tag --list "v${prev}.*" --sort=-v:refname | grep -v -- '-rc\.' | head -1)

          if [[ -z "$prev_tag" ]]; then
            echo "No tags found for v${prev} — nothing to archive"
            exit 0
          fi

          echo "Archiving $prev_tag to /v${prev}/"
          echo "tag=$prev_tag"  >> "$GITHUB_OUTPUT"
          echo "path=v$prev"    >> "$GITHUB_OUTPUT"

  archive-superseded-major:
    name: Archive the superseded major
    needs: find-superseded-major
    if: needs.find-superseded-major.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/archive-docs.yml
    with:
      tag: ${{ needs.find-superseded-major.outputs.tag }}
      path: ${{ needs.find-superseded-major.outputs.path }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
      SSH_REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
