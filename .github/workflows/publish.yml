name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# SHA-pinned because this workflow can publish to npm; keep the version comments.
jobs:
  detect:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_rc: ${{ steps.check.outputs.is_rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: check
        name: Inspect head commit
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "Head subject: $subject"
          if [[ "$subject" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)(\ \(#[0-9]+\))?$ ]]; then
            version="${BASH_REMATCH[1]}"
            tag="v$version"
            is_rc=$([[ "$version" == *-rc.* ]] && echo true || echo false)
            echo "is_release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag"         >> "$GITHUB_OUTPUT"
            echo "is_rc=$is_rc"     >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Tag, release & npm publish
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No dependency cache: this job holds the npm OIDC token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build:lib

      - name: Generate release body
        run: pnpm release:body --output=.release-body.md

      - name: Create git tag
        run: |
          tag="${{ needs.detect.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — skipping"
          else
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.tag }}
          body_path: .release-body.md
          prerelease: ${{ needs.detect.outputs.is_rc == 'true' }}
          make_latest: ${{ needs.detect.outputs.is_rc == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert npm supports Trusted Publishing
        run: |
          floor=11.5.1
          have=$(npm --version)
          echo "npm $have, bundled with node $(node --version)"
          IFS=. read -r fa fb fc <<<"$floor"
          IFS=. read -r ha hb hc <<<"${have%%-*}"
          if (( ha < fa || (ha == fa && (hb < fb || (hb == fb && hc < fc))) )); then
            echo "::error::npm $have is below the $floor floor for OIDC Trusted Publishing — raise node-version, or install an exact npm version, but never npm@latest."
            exit 1
          fi

      - name: Publish to npm (Trusted Publisher)
        working-directory: dist/lib
        run: |
          tag=$([[ "${{ needs.detect.outputs.is_rc }}" == "true" ]] && echo "next" || echo "latest")
          npm publish --access public --provenance --tag "$tag"

  find-superseded-major:
    name: Find the major being superseded
    needs: [detect, publish]
    if: needs.detect.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: pick
        run: |
          version="${{ needs.detect.outputs.version }}"
          if [[ ! "$version" =~ ^([0-9]+)\.0\.0$ ]]; then
            echo "$version is not a major release — nothing to archive"
            exit 0
          fi

          prev=$(( ${BASH_REMATCH[1]} - 1 ))
          prev_tag=$(git tag --list "v${prev}.*" --sort=-v:refname | grep -v -- '-rc\.' | head -1)

          if [[ -z "$prev_tag" ]]; then
            echo "No tags found for v${prev} — nothing to archive"
            exit 0
          fi

          echo "Archiving $prev_tag to /v${prev}/"
          echo "tag=$prev_tag"  >> "$GITHUB_OUTPUT"
          echo "path=v$prev"    >> "$GITHUB_OUTPUT"

  archive-superseded-major:
    name: Archive the superseded major
    needs: find-superseded-major
    if: needs.find-superseded-major.outputs.tag != ''
    uses: ./.github/workflows/archive-docs.yml
    with:
      tag: ${{ needs.find-superseded-major.outputs.tag }}
      path: ${{ needs.find-superseded-major.outputs.path }}
    secrets: inherit
