name: Deploy next docs

# The next release's docs at next.ngwr.dev, rebuilt on every push to `next`. The
# server answers that host with `X-Robots-Tag: noindex`, and the `next`
# environment admits this branch only.
on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: deploy-ngwr-next
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy next.ngwr.dev
    # A stable release commit reaches next only when next syncs with main after
    # the release, which changes nothing next.ngwr.dev shows; ngwr.dev is that
    # release's site. A dispatch always runs.
    if: >-
      github.ref == 'refs/heads/next' &&
      (github.event_name == 'workflow_dispatch' ||
      !(startsWith(github.event.head_commit.message, 'chore(release): v') &&
      !contains(github.event.head_commit.message, '-rc.')))
    runs-on: ubuntu-latest
    environment:
      name: next
      url: https://next.ngwr.dev

    steps:
      # The branch tip, not the pushed SHA: a push event delivered late would
      # otherwise deploy an older build over a newer one.
      - uses: actions/checkout@v7
        with:
          ref: next

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      # It names ngwr.dev URLs, and nothing here should be indexed anyway.
      - run: rm -f dist/showcase/sitemap.xml

      - name: Flag the site as the next release
        run: |
          cat > "$RUNNER_TEMP/mark-next.mjs" <<'SCRIPT'
          import { readFileSync, writeFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('projects/lib/package.json', 'utf8'));
          // next carries the release after main's, a minor or a major. A
          // candidate names it (15.1.0-rc.0 is v15.1, 16.0.0-rc.0 is v16); a
          // stable version means no candidate yet, so no number is printed.
          const [base, prerelease] = version.split('-');
          const label = prerelease ? `, <b>v${base.replace(/(\.0)+$/, '')}</b>` : '';
          const banner = `<style>
          .wr-next-banner{position:sticky;bottom:0;z-index:999;display:flex;flex-wrap:wrap;
          gap:.25rem .75rem;align-items:center;justify-content:center;padding:.75rem 1rem;
          background:#1e1b4b;color:#eef2ff;border-top:1px solid #3730a3;text-align:center;
          font:500 .875rem/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
          .wr-next-banner b{color:#a5b4fc}
          .wr-next-banner a{color:#eef2ff;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
          </style>
          <div class="wr-next-banner" role="note">
          <span>You are reading the docs for the next release${label}, still in development (<code>ngwr@next</code>).</span>
          <a href="https://ngwr.dev/">Go to the stable docs</a>
          </div>`;

          for (const file of process.argv.slice(2)) {
            const html = readFileSync(file, 'utf8');
            if (html.includes('</body>')) writeFileSync(file, html.replace('</body>', () => `${banner}</body>`));
          }
          SCRIPT
          find dist/showcase -name '*.html' -print0 | xargs -0 node "$RUNNER_TEMP/mark-next.mjs"

      - uses: easingthemes/ssh-deploy@v6.0.3
        with:
          ARGS: '-rlgoDzvc -i --delete'
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: 'dist/showcase/'
          REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
          TARGET: '/var/www/ngwr-next/'
