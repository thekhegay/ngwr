name: Archive docs version

# Build a past release's showcase docs and deploy them to a versioned path
# (e.g. /v7/) so the header version-switcher can link to frozen older docs.
# Run once per archived major.
#
# Server prerequisite: nginx has to route the versioned path with its own SPA
# fallback, or `/v9/anything` falls through to the ROOT index.html and serves
# the current docs instead of the archived ones. One regex location covers every
# past and future major, so no server change is needed per release:
#
#   location ~ ^/(v[0-9]+(?:\.[0-9]+)*(?:-rc(?:\.[0-9]+)?)?)/ {
#       try_files $uri $uri/ /$1/index.html =404;
#   }
#
# Both halves of that are load-bearing. The optional octets and `-rc` suffix let
# the same location serve a `v9.1.0` or `v9.0.0-rc` path, not just `v9`. The
# `=404` terminator is what stops a miss inside an archive from re-entering this
# same location forever — without it nginx gives up with "rewrite or internal
# redirection cycle" and serves 500s in place of the archived page.
#
# (The older per-version form — `location /v7/ { … }` — works too but has to be
# added by hand each time, which is exactly what the automation below removes.)

on:
  # Manual re-runs: re-archiving a major, or back-filling one that predates the
  # automatic hook below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v7.3.0)'
        required: true
        type: string
      path:
        description: 'Versioned URL path / target subdir (e.g. v7)'
        required: true
        type: string
  # Called by `publish.yml` when a major ships, to freeze the major it replaces.
  # Same inputs, so the two paths cannot drift.
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v9.1.0)'
        required: true
        type: string
      path:
        description: 'Versioned URL path / target subdir (e.g. v9)'
        required: true
        type: string

concurrency:
  group: archive-docs-${{ inputs.path }}
  cancel-in-progress: false

jobs:
  archive:
    name: Build ${{ inputs.tag }} → /${{ inputs.path }}/
    runs-on: ubuntu-latest
    # Same environment as `deploy.yml` — it reaches the same server with the
    # same secrets, so it has to be scoped the same way. Without this the job
    # cannot see them once they move off the repository level.
    environment:
      name: production
      url: https://ngwr.dev/${{ inputs.path }}/

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AI assets are best-effort — the generator may be absent on older tags.
      - run: pnpm exec tsx scripts/gen-ai-assets.ts || true

      # Root the snapshot at the versioned path so its assets + router links
      # resolve under /<path>/.
      - run: pnpm exec ng build showcase --base-href=/${{ inputs.path }}/

      # Keep superseded docs out of search results.
      #
      # Archived majors are indexable exactly like the live site, so someone
      # searching for a component can land on two-year-old documentation with
      # nothing telling them so. `noindex, follow` drops the pages from the
      # index while still letting crawlers walk the links, and it is applied to
      # the built output rather than the source: the older tags this workflow
      # checks out predate any such markup and cannot be changed retroactively.
      #
      # Deliberately not `canonical` to the current version — route paths move
      # between majors, so a page-to-page mapping would silently point at the
      # wrong page or a 404. Dropping from the index is the honest option.
      - name: Mark the snapshot noindex
        run: |
          count=$(find dist/showcase -name '*.html' | wc -l)
          find dist/showcase -name '*.html' -print0 | xargs -0 sed -i \
            's|<head>|<head><meta name="robots" content="noindex, follow">|'
          echo "Marked $count pages noindex"
          # The snapshot's own sitemap would invite exactly the indexing we
          # just turned off.
          rm -f dist/showcase/sitemap.xml

      # Give the reader a way out, and stop the snapshot claiming to be current.
      #
      # An archived build's own version-switcher is frozen at the moment it was
      # tagged, so it can never be right: /v9/ labels itself "v9 · latest" and
      # offers only v7, because the v9 build has no idea v10 exists — and /v7/
      # and /v8/ have no switcher at all, leaving no route back to the live docs
      # from any page. Both are fixed the same way: hide the stale control and
      # inject a banner that always points at the site root.
      #
      # Injected into the built HTML rather than authored in the app, for the
      # same reason as the noindex above — these tags are already cut and cannot
      # be given the markup retroactively. It names the version it IS (a frozen
      # fact) and never the current one (which would go stale on the next
      # major), and it carries its own styles so it does not depend on whatever
      # token layer that release happened to ship.
      #
      # Appended after </body>'s content, i.e. outside the app root, so Angular
      # hydration never sees it as unexpected DOM.
      - name: Flag the snapshot as archived
        env:
          ARCHIVED_PATH: ${{ inputs.path }}
        run: |
          cat > "$RUNNER_TEMP/mark-archived.mjs" <<'SCRIPT'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = process.env.ARCHIVED_PATH;
          const files = process.argv.slice(2);

          const banner = `<style>
          .wr-archived-banner{position:fixed;inset:auto 0 0 0;z-index:2147483647;display:flex;
          flex-wrap:wrap;gap:.25rem .75rem;align-items:center;justify-content:center;
          padding:.75rem 1rem;background:#1c1917;color:#fafaf9;border-top:1px solid #44403c;
          text-align:center;font:500 .875rem/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
          .wr-archived-banner b{color:#fbbf24}
          .wr-archived-banner a{color:#fafaf9;text-decoration:underline;text-underline-offset:2px;
          white-space:nowrap}
          .wr-archived-banner a:hover{color:#fbbf24}
          body{padding-bottom:5rem!important}
          @media (max-width:560px){body{padding-bottom:9rem!important}}
          .ngwr-header__version{display:none!important}
          </style>
          <div class="wr-archived-banner" role="note">
          <span>You are reading the <b>${version}</b> documentation. This version is no longer maintained.</span>
          <a href="https://ngwr.dev/">Go to the current docs</a>
          </div>`;

          let touched = 0;
          for (const file of files) {
            const html = readFileSync(file, 'utf8');
            // Re-runs are expected (back-filling an existing archive), and a
            // page with no </body> is not one we can safely patch.
            if (html.includes('wr-archived-banner') || !html.includes('</body>')) continue;
            writeFileSync(file, html.replace('</body>', () => `${banner}</body>`));
            touched++;
          }
          console.log(`Banner added to ${touched} of ${files.length} pages`);
          SCRIPT
          find dist/showcase -name '*.html' -print0 \
            | xargs -0 node "$RUNNER_TEMP/mark-archived.mjs"

      - uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rlgoDzvc -i'
          SOURCE: 'dist/showcase/'
          REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
          TARGET: '/var/www/ngwr-showcase/${{ inputs.path }}/'
