name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ngwr-showcase
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy showcase
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.head_commit.message, 'chore(release): v') &&
      !contains(github.event.head_commit.message, '-rc.'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ngwr.dev

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build:showcase

      - uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SCRIPT_BEFORE: ls
          # The exclude keeps --delete away from the archived /vN/ docs.
          ARGS: '-rlgoDzvc -i --delete --exclude=/v[0-9]*'
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: 'dist/showcase/'
          REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
          TARGET: '/var/www/ngwr-showcase/'
