name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ngwr-showcase
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build showcase
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.head_commit.message, 'chore(release): v') &&
      !contains(github.event.head_commit.message, '-rc.'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase
          path: dist/showcase
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy showcase
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://ngwr.dev

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase
          path: dist/showcase

      - uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SCRIPT_BEFORE: ls
          # The exclude keeps --delete away from the archived /vN/ docs.
          ARGS: '-rlgoDzvc -i --delete --exclude=/v[0-9]*'
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: 'dist/showcase/'
          REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
          TARGET: '/var/www/ngwr-showcase/'
