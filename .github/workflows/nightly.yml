name: Nightly

on:
  schedule:
    # 01:00 Almaty: scheduled runs start hours late, the report is due by morning.
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  changed:
    name: Did main move?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      # A manual run always runs. A scheduled one runs only when main is not at
      # the commit the last finished nightly checked; a failed lookup runs too.
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""') || last=''
          if [ "$last" = "$SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is still at $SHA, which the last nightly checked. Skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  site:
    name: Site checks
    needs: changed
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/site-checks.yml

  legacy-node:
    name: Node ${{ matrix.node }} (an older LTS line engines accepts)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build:lib

  # One open "Nightly failed" issue at a time: opened or commented on when a
  # job fails, closed by the next green nightly.
  report:
    name: Morning report
    needs: [changed, site, legacy-node]
    if: always() && needs.changed.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly failed'
          today=$(date -u +%F)
          failed=$(jq -r 'to_entries[] | select(.key != "changed" and .value.result == "failure") | "- `\(.key)`"' <<< "$NEEDS")
          green=$(jq -r '[to_entries[] | select(.key != "changed") | .value.result] | all(. == "success")' <<< "$NEEDS")
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")

          if [ -n "$failed" ]; then
            body=$(printf '%s\n\n%s\n\n%s\n' "$today: the nightly failed on main at $SHA." "$failed" "$RUN_URL")
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ "$green" = true ] && [ -n "$issue" ]; then
            gh issue close "$issue" --comment "$today: the nightly passed on main at $SHA. $RUN_URL"
          fi
