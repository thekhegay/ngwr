name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  legacy-node:
    name: Node ${{ matrix.node }} (an LTS line engines still accepts)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build:lib

  contrast:
    name: Contrast & target size
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      - run: pnpm exec playwright install --with-deps chromium

      # shell: bash adds pipefail, so tee cannot hide a failing check.
      - run: pnpm check:contrast --verbose 2>&1 | tee contrast-report.txt
        shell: bash

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: contrast-report.txt
          retention-days: 30

  state-a11y:
    name: Interactive-state a11y
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm check:state-a11y --verbose --probe 2>&1 | tee state-a11y-report.txt
        shell: bash

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: state-a11y-report
          path: state-a11y-report.txt
          retention-days: 30

  layout:
    name: Layout geometry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm check:layout 2>&1 | tee layout-report.txt
        shell: bash

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-report
          path: layout-report.txt
          retention-days: 30

  rtl-layout:
    name: RTL layout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm check:rtl-layout --verbose 2>&1 | tee rtl-layout-report.txt
        shell: bash

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtl-layout-report
          path: rtl-layout-report.txt
          retention-days: 30
