name: Deploy RC docs

# A release candidate's docs, at /v<major>-rc/ beside the stable site. The
# nginx block for archived majors already serves that path, and deploy.yml's
# --delete leaves it alone; the stable X.0.0 deploy removes it.
on:
  push:
    branches: ['v[0-9]+']
  workflow_dispatch:

concurrency:
  group: deploy-ngwr-rc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy /${{ github.ref_name }}-rc/
    if: >-
      startsWith(github.ref, 'refs/heads/v') && (
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.head_commit.message, 'chore(release): v') &&
      contains(github.event.head_commit.message, '-rc.')))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ngwr.dev/${{ github.ref_name }}-rc/

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:showcase --base-href=/${{ github.ref_name }}-rc/

      - name: Mark the preview noindex
        run: |
          find dist/showcase -name '*.html' -print0 | xargs -0 sed -i \
            's|<head>|<head><meta name="robots" content="noindex, follow">|'
          rm -f dist/showcase/sitemap.xml

      - name: Flag the preview as a release candidate
        env:
          MAJOR: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/mark-rc.mjs" <<'SCRIPT'
          import { readFileSync, writeFileSync } from 'node:fs';

          const banner = `<style>
          .wr-rc-banner{position:sticky;bottom:0;z-index:999;display:flex;flex-wrap:wrap;
          gap:.25rem .75rem;align-items:center;justify-content:center;padding:.75rem 1rem;
          background:#1e1b4b;color:#eef2ff;border-top:1px solid #3730a3;text-align:center;
          font:500 .875rem/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
          .wr-rc-banner b{color:#a5b4fc}
          .wr-rc-banner a{color:#eef2ff;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
          </style>
          <div class="wr-rc-banner" role="note">
          <span>You are reading the <b>${process.env.MAJOR} release candidate</b> documentation.</span>
          <a href="https://ngwr.dev/">Go to the stable docs</a>
          </div>`;

          for (const file of process.argv.slice(2)) {
            const html = readFileSync(file, 'utf8');
            if (html.includes('</body>')) writeFileSync(file, html.replace('</body>', () => `${banner}</body>`));
          }
          SCRIPT
          find dist/showcase -name '*.html' -print0 | xargs -0 node "$RUNNER_TEMP/mark-rc.mjs"

      - uses: easingthemes/ssh-deploy@v6.0.3
        with:
          ARGS: '-rlgoDzvc -i --delete'
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: 'dist/showcase/'
          REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SSH_REMOTE_USER }}
          TARGET: '/var/www/ngwr-showcase/${{ github.ref_name }}-rc/'
