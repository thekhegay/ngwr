name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint & build
    # Skip release commits. They are already gated by the workflows that act on
    # them: publish.yml runs `lint` + `build:lib` before `npm publish`, and
    # deploy.yml runs `lint` + `build:showcase` before deploying. Running here as
    # well only added a third copy of the same work that finished *after* both had
    # shipped — which read like the release had raced the gate. (On pull_request
    # `head_commit` is null, so this never skips a PR.)
    if: "!startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `version:` — action reads the pinned pnpm from package.json's
      # `packageManager` field. Single source of truth.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build:lib

      - run: pnpm build:showcase
