name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (rc publishes to npm dist-tag `next`, everything else to `latest`; `next` takes rc only)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - rc

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions: {}

# main cuts every release; `next` cuts the next major's release candidates.
jobs:
  checks:
    name: Full check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/next' && inputs.bump == 'rc')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm check:release

  release-pr:
    name: Cut release PR
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump version and update CHANGELOG
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: pnpm release:prepare "--bump=$BUMP" > /dev/null

      - name: Re-generate the quality facts the bump just changed
        run: pnpm gen:quality

      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:body --output=.release-body.md

      - name: Create release PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/v${{ steps.prepare.outputs.version }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: 'chore(release): v${{ steps.prepare.outputs.version }}'
          title: 'chore(release): v${{ steps.prepare.outputs.version }}'
          body-path: .release-body.md
          labels: |
            release
            ${{ steps.prepare.outputs.is_rc == 'true' && 'release:rc' || 'release:stable' }}

      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/v${{ steps.prepare.outputs.version }}
        run: gh workflow run ci.yml --ref "$BRANCH"
