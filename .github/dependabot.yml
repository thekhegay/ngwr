version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Daily. The grouping below is what keeps that from being noisy — Angular,
    # eslint and the `@types/*` each arrive as ONE pull request however many
    # packages moved, so a daily cadence mostly means the same weekly volume,
    # just noticed sooner.
    schedule:
      interval: 'daily'
      time: '13:00'
      timezone: 'Asia/Almaty'
    open-pull-requests-limit: 10
    # Two bumps that would open a green-looking PR and land a red build.
    #
    # TypeScript is pinned at ~6.0.3 because Angular 22's peer range is
    # `typescript >=6.0 <6.1`. 7.0 is out, and without this it arrives as an
    # ordinary weekly PR — no group claims it, so it looks like a lone chore.
    #
    # @types/node tracks the RUNTIME, and .nvmrc pins Node 24 while `engines`
    # allows `>=26`. Typing against 26 while CI runs 24 does not fail: it
    # type-checks APIs that are not there, which is worse than failing.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6.1']
      - dependency-name: '@types/node'
        versions: ['>=26']
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'type: chore'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - 'ng-packagr'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '13:00'
      timezone: 'Asia/Almaty'
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'type: chore'
