version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '08:00'
      timezone: 'Asia/Almaty'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    # typescript and vitest are held to the peer ranges Angular declares.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6.1']
      - dependency-name: 'vitest'
        versions: ['>=5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5']
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'type: chore'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - 'ng-packagr'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '08:00'
      timezone: 'Asia/Almaty'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'type: chore'
